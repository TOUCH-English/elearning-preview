<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#EEF2FB" />
<title>Touch English — Speak with Confidence</title>
<meta name="description" content="Touch English — adult English grammar e-learning. Speak with confidence." />
<style>
/* =============================================================================
   TOUCH E-learning — 共用设计系统  (shared/theme.css)
   -----------------------------------------------------------------------------
   为什么有这个档案：

   原本 6 个课程长得不像同一间公司做的 —— pre-beginner / level-1 / level-2 / ipa
   用深蓝 #1F3A5F + Fredoka/Nunito；grammar-full 用另一种蓝 #15357B + 红，字体是
   Sora/Inter；grammar 颜色对但字体又是 Plus Jakarta Sans。学生从一个课程跳到
   另一个会觉得「怎么像另一个网站」。

   现在全部课程都指向这里的 --te-* 变数，改一次全部课程一起变。

   -----------------------------------------------------------------------------
   用法（课程 HTML 里，放在自己的 <style> 之前）：

       <link rel="stylesheet" href="../../shared/theme.css">

   然后课程自己的 :root 不要写死色码，改成指向共用变数、并留原本的色码当後备：

       :root{
         --brand: var(--te-brand, #1F3A5F);
         --font-display: var(--te-font-display, 'Fredoka','Nunito',sans-serif);
       }

   -----------------------------------------------------------------------------
   为什么每个地方都要留 fallback：

   课程是给学生双击 file:// 打开的。万一这个档案没跟着一起被复制过去，
   有 fallback 的话画面只是回到原本的样子，不会整页变成没有颜色的白纸。
   这是刻意的保险，不要为了「乾净」把 fallback 拿掉。
============================================================================= */

:root {
  /* ---------- 底色与文字 ----------
     2026-09-23 起跟平台（touch-platform app/globals.css 的 .ui-c）对齐：
     学生从平台的「我的课程」点进来，不应该觉得换了一个网站。
     颜色、字体、圆角、阴影照平台；答对答错、金色 XP 这些课程自己的语意色不动。 */
  --te-canvas:        #EEF2FB;   /* 页面底色 */
  --te-surface:       #FFFFFF;   /* 卡片底色 */
  --te-ink:           #16202E;   /* 主要文字 */
  --te-muted:         #5C6779;   /* 次要文字 */
  --te-subtle:        #8C97A8;   /* 更淡的说明文字 */
  --te-line:          #DFE5F0;   /* 分隔线、外框 */

  /* ---------- 品牌深蓝 ---------- */
  --te-brand:         #15357B;
  --te-brand-d:       #112C68;
  --te-brand-dd:      #0D2253;
  --te-brand-2:       #2A5BD7;   /* 连结、次要强调 */
  --te-brand-soft:    #EAF0FB;   /* 浅色底 */

  /* ---------- 答对 ---------- */
  --te-success:       #4FAE8A;
  --te-success-d:     #3C8E6F;
  --te-success-soft:  #E6F4EE;

  /* ---------- 品牌红（TOUCH logo 的红，用在重点强调） ---------- */
  --te-danger:        #8B1E3F;
  --te-danger-d:      #6F1730;
  --te-danger-soft:   #F3E1E6;

  /* ---------- 答错（比品牌红亮，避免跟强调色混淆） ---------- */
  --te-bad:           #C0405C;
  --te-bad-d:         #9E2E47;
  --te-bad-soft:      #F6E4E8;

  /* ---------- 金色（XP、奖励、徽章） ---------- */
  --te-gold:          #D9B56B;
  --te-gold-deep:     #BE9648;
  --te-gold-soft:     #F8EFDB;

  /* ---------- 圆角与阴影 ---------- */
  --te-hairline:      rgba(21,53,123,.08);
  --te-radius:        22px;
  --te-sh-sm:         0 1px 2px rgba(20,33,50,.05),0 4px 12px rgba(20,33,50,.05);
  --te-sh-md:         0 1px 2px rgba(20,33,50,.05),0 8px 24px rgba(20,33,50,.06);
  --te-sh-lg:         0 16px 48px rgba(14,36,86,.16);

  /* ---------- 字体 ----------
     跟平台同一套（Marco 2026-09-23：课程搬进平台，外观要跟平台一致）：
     Sora 当标题和数字，Plus Jakarta Sans 当内文。原本是 Fredoka／Nunito。
     中文没有对应的 webfont，交给系统字体处理。 */
  --te-font-display:  'Sora','Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;
  --te-font-body:     'Plus Jakarta Sans',-apple-system,'Segoe UI','Noto Sans',sans-serif;
  --te-font-cjk:      'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans SC',sans-serif;

  /* ---------- 分类用的辅助色 ----------
     只有 grammar-full 会用到（它的模组各有一个颜色）。
     这些是刻意跟品牌色区隔开的，不要拿来做按钮或状态。 */
  --te-ac-blue:       #3B82C4;
  --te-ac-indigo:     #6366E0;
  --te-ac-teal:       #1AA6B8;
  --te-ac-green:      #16A394;
  --te-ac-amber:      #E0922E;
  --te-ac-red:        #E0483F;
  --te-ac-purple:     #9B5FE0;
  --te-ac-pink:       #D957A8;
}

/* =============================================================================
   动态与材质  (append-only，2026-09)
   -----------------------------------------------------------------------------
   为什么加这一段：原本每个课程各自写 transition .18s ease、各自决定按钮按下去
   有没有反应。结果是「同一间公司的 7 个课程，手感不一样」。

   这里定的是「时间与曲线」，不是新的颜色 —— 所以套上去不会改变现有配色。

   两条规矩（来自 Apple 的 Designing Fluid Interfaces）：

     1. 回馈发生在「按下去」的那一刻，不是放开之后。
        延迟一出现，「直接操作」的感觉就整个塌掉。
     2. 会被手指抓住的东西（面板、卡片、滑动）用弹簧，不用固定长度的动画 ——
        弹簧可以随时被打断、被反向，固定动画只能播完。
        弹簧在 shared/motion.js，这里只负责静态的 hover/press。

   damping 1.0（不回弹）是预设。只有「手势本身带了动量」（甩、拖放开）才给回弹，
   否则一个只是淡入的选单在那边弹一下，看起来很廉价。
============================================================================= */

:root {
  /* ---------- 时间 ----------
     press 要够短，短到学生感觉是「手指压下去」而不是「画面在动」。 */
  --te-dur-press:   90ms;
  --te-dur-fast:    160ms;
  --te-dur-base:    240ms;
  --te-dur-slow:    360ms;

  /* ---------- 曲线 ----------
     te-ease-out    一般进场／离场（对应 damping 1.0，不回弹）
     te-ease-spring 带一点回弹，只给动量手势用
     te-ease-in     离场（跟 ease-out 互为镜像，同一条路进出）*/
  --te-ease-out:    cubic-bezier(.22,.61,.36,1);
  --te-ease-in:     cubic-bezier(.64,0,.78,.39);
  --te-ease-spring: cubic-bezier(.2,.9,.28,1.12);

  /* ---------- 按下去的量 ----------
     大按钮压小一点，整张卡片压更少 —— 面积越大，同样的比例看起来越夸张。 */
  --te-press-btn:   .97;
  --te-press-card:  .985;

  /* ---------- 材质（半透明的浮层） ----------
     顶栏、面板用这个，内容从底下卷过去，而不是被一条实心的横条切掉。
     prefers-reduced-transparency 会在下面换成实心。 */
  --te-glass:       rgba(255,255,255,.72);
  --te-glass-blur:  saturate(180%) blur(20px);
  --te-glass-edge:  rgba(255,255,255,.55);   /* 上缘的亮边＝光打在材质上 */
  --te-scrim:       rgba(14,36,86,.32);      /* 挡住底下内容的遮罩 */

  /* ---------- 焦点框 ----------
     键盘使用者要看得到自己在哪里，而且不能被卡片的圆角切掉。 */
  --te-focus:       0 0 0 3px rgba(42,91,215,.34);
}

/* -----------------------------------------------------------------------------
   字距要跟着字级走（The Details of UI Typography, WWDC 2020）

   大标题的字母在视觉上会「散开」，所以要收紧（负字距）；
   小字反而要放松一点才好读。一个 letter-spacing 套全部字级，一定有地方是错的。
   行高相反：字越大行高越紧。
----------------------------------------------------------------------------- */
.te-display { font-size:clamp(28px,6vw,46px); line-height:1.08; letter-spacing:-.022em; }
.te-title   { font-size:clamp(20px,3.4vw,26px); line-height:1.22; letter-spacing:-.012em; }
.te-body    { font-size:15px; line-height:1.6; letter-spacing:0; }
.te-caption { font-size:12.5px; line-height:1.5; letter-spacing:.006em; }
.te-label   { font-size:11.5px; line-height:1; letter-spacing:.1em; text-transform:uppercase; }

/* -----------------------------------------------------------------------------
   按下去的回馈

   [data-pressed] 由 shared/motion.js 在 pointerdown 当下加上去 —— 不等 click。
   :active 留着当後备（motion.js 没载到时至少还有反应）。
   手指移开超过 10px 会被 motion.js 取消，跟 iOS 一样：按错了可以滑开。
----------------------------------------------------------------------------- */
.te-pressable {
  transition: transform var(--te-dur-press) var(--te-ease-out),
              box-shadow var(--te-dur-fast) var(--te-ease-out),
              background-color var(--te-dur-fast) var(--te-ease-out),
              border-color var(--te-dur-fast) var(--te-ease-out);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.te-pressable[data-pressed],
.te-pressable:active            { transform: scale(var(--te-press-btn)); }
.te-pressable.te-card-press[data-pressed],
.te-pressable.te-card-press:active { transform: scale(var(--te-press-card)); }
.te-pressable:focus-visible     { outline:none; box-shadow: var(--te-focus); }

/* -----------------------------------------------------------------------------
   浮层（顶栏、底部面板）
----------------------------------------------------------------------------- */
.te-glass {
  background: var(--te-glass);
  -webkit-backdrop-filter: var(--te-glass-blur);
  backdrop-filter: var(--te-glass-blur);
  border-color: var(--te-glass-edge);
}

/* 内容跟浮动顶栏交界处用渐层淡出，不要用一条 1px 的线 */
.te-edge-fade {
  -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 14px);
  mask-image: linear-gradient(180deg, transparent 0, #000 14px);
}

/* -----------------------------------------------------------------------------
   无障碍：三个偏好各自独立，不是同一个开关

   reduce motion       ＝要更温和的回馈，不是完全没有回馈：位移／回弹换成淡入淡出
   reduce transparency ＝毛玻璃换实心，学生才读得到字
   more contrast       ＝近乎实心的底 ＋ 明确的外框
----------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  :root {
    --te-dur-press: 1ms; --te-dur-fast: 1ms; --te-dur-base: 120ms; --te-dur-slow: 140ms;
    --te-ease-spring: linear; --te-press-btn: 1; --te-press-card: 1;
  }
  .te-pressable[data-pressed],
  .te-pressable:active { transform:none; background-color: var(--te-brand-soft,#E6ECF4); }
  *,*::before,*::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; }
}

@media (prefers-reduced-transparency: reduce) {
  :root { --te-glass: var(--te-surface,#fff); --te-glass-blur: none; --te-glass-edge: var(--te-line,#DCE3EC); }
  .te-glass { -webkit-backdrop-filter:none; backdrop-filter:none; }
}

@media (prefers-contrast: more) {
  :root {
    --te-glass: var(--te-surface,#fff); --te-glass-blur:none;
    --te-muted:#3C4655; --te-subtle:#44505F;
    --te-line:#8A97A8; --te-hairline: rgba(31,58,95,.4);
    --te-focus: 0 0 0 3px #1F3A5F;
  }
  .te-glass { border:1px solid var(--te-line); }
}

/* =============================================================================
   底：跟平台同一片（平台的 .ui-c.ui-plane）
   -----------------------------------------------------------------------------
   课程各自在 body 画了自己的渐层；这里用 html body（权重比 body 高）盖过去，
   七个课程不用各改一次。淡淡的四色光晕来自平台 —— 蓝、金、绿、红，TOUCH 的颜色。
============================================================================= */
html body {
  background-color: var(--te-canvas);
  background-image:
    radial-gradient(34rem 34rem at 88% -6rem, rgb(31 159 230 / 0.18), transparent 70%),
    radial-gradient(30rem 30rem at -4rem 10rem, rgb(235 177 42 / 0.16), transparent 70%),
    radial-gradient(32rem 32rem at 56% 22rem, rgb(46 158 80 / 0.11), transparent 72%),
    radial-gradient(38rem 38rem at 104% 40rem, rgb(232 71 43 / 0.09), transparent 72%),
    linear-gradient(135deg, #EEF2FB, #E4EBF7);
  background-repeat: no-repeat;
  background-attachment: fixed;
}

</style>
<style>
  html,body{margin:0;padding:0;background:var(--te-canvas, #F5F7FA);-webkit-text-size-adjust:100%;}
  #root{min-height:100vh;}
</style>
</head>

<div id="root"></div>

.te *{box-sizing:border-box}
.te{
  --canvas:var(--te-canvas, #F5F7FA); --surface:var(--te-surface, #FFFFFF); --ink:var(--te-ink, #1F2937); --muted:var(--te-muted, #667085);
  --subtle:var(--te-subtle, #98A2B3); --line:var(--te-line, #E5E7EB); --brand:var(--te-brand, #15357B); --brand-2:var(--te-brand-2, #2A5BD7);
  --brand-soft:var(--te-brand-soft, #EEF3F9); --success:var(--te-success, #4FAE8A); --success-soft:var(--te-success-soft, #E9F5F0);
  --maroon:var(--te-danger, #8B1E3F); --danger:var(--te-danger, #8B1E3F); --danger-soft:var(--te-danger-soft, #F6EAEE);
  --gold:var(--te-gold, #D9B56B); --gold-deep:var(--te-gold-deep, #B08A3E); --amber:var(--te-gold-deep, #B08A3E); --gold-soft:var(--te-gold-soft, #FBF4E6);
  --sh-sm:var(--te-sh-sm, 0 1px 2px rgba(21,53,123,.05), 0 1px 3px rgba(21,53,123,.04));
  --sh-md:var(--te-sh-md, 0 1px 0 rgba(255,255,255,.8) inset, 0 2px 6px rgba(21,53,123,.05), 0 10px 26px rgba(21,53,123,.07));
  --sh-lg:var(--te-sh-lg, 0 1px 0 rgba(255,255,255,.85) inset, 0 8px 20px rgba(21,53,123,.07), 0 28px 56px rgba(21,53,123,.12));
  --hairline:var(--te-hairline, rgba(21,53,123,.08));
  --r:20px;
  font-family:var(--te-font-body, 'Nunito',-apple-system,'Segoe UI','Noto Sans',sans-serif);
  color:var(--ink); background:
    radial-gradient(1100px 560px at 82% -12%, #F1EBDC 0%, rgba(241,235,220,0) 52%),
    radial-gradient(900px 520px at 8% -8%, #EAF0F7 0%, rgba(234,240,247,0) 50%),
    var(--canvas);
  min-height:100vh; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.te-display{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);letter-spacing:-.02em}

/* top bar */
.te-top{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);
  background:rgba(255,255,255,.72);border-bottom:1px solid var(--hairline);box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.te-top-in{max-width:1080px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px}
.te-logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.te-tabs{display:flex;gap:4px;margin-left:8px}
.te-tab{border:0;background:none;font:inherit;font-size:14px;font-weight:600;color:var(--subtle);
  padding:8px 12px;border-radius:10px;cursor:pointer}
.te-tab[data-on="true"]{color:var(--brand);background:var(--brand-soft)}
.te-stats{margin-left:auto;display:flex;gap:8px}
.te-chip{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;
  padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:var(--sh-sm)}
.te-chip svg{color:var(--brand-2)}
.te-chip.amber svg{color:var(--amber)}

/* layout */
.te-wrap{max-width:1080px;margin:0 auto;padding:38px 22px 124px}
.te-eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-2)}
.te-h1{font-size:31px;font-weight:800;margin:7px 0 3px;letter-spacing:-.02em}
.te-sub{color:var(--muted);font-size:15px}
.te-screen{animation:rise .4s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* cards \u2014 solid, with a thin highlight border + gentle inner highlight */
.te-card{position:relative;background:var(--surface);border:1px solid var(--hairline);
  border-radius:var(--r);box-shadow:var(--sh-md)}
.te-card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 0 0 1px rgba(255,255,255,.4) inset}

/* homepage hero */
.te-hero{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:22px}
.te-overview{padding:26px 28px}
.te-prog-num{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:48px;font-weight:800;line-height:1;letter-spacing:-.03em}
.te-prog-num span{font-size:22px;color:var(--subtle);font-weight:700}
.te-bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:16px 0 8px}
.te-bar>i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--brand-2),var(--brand))}
.te-meta{display:flex;gap:22px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.te-meta b{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:20px;font-weight:800;display:block}
.te-meta small{color:var(--subtle);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* resume card (signature element) */
.te-resume{position:relative;overflow:hidden;padding:26px 28px;color:#fff;border:0;border-radius:var(--r);
  background:radial-gradient(900px 400px at 110% -20%, #3B6699 0%, rgba(59,102,153,0) 60%),
             linear-gradient(150deg,#234670,#152A43);box-shadow:var(--sh-lg);
  display:flex;flex-direction:column;justify-content:space-between}
.te-resume::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;
  background:linear-gradient(90deg,var(--gold),rgba(217,181,107,0))}
.te-resume .lbl{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.te-resume h3{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:23px;font-weight:800;margin:14px 0 4px;line-height:1.25}
.te-resume .next{font-size:13.5px;opacity:.85}

/* grid of lessons */
.te-sec-h{display:flex;align-items:end;justify-content:space-between;margin:42px 0 18px}
.te-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.te-lesson{position:relative;padding:22px;display:flex;flex-direction:column;gap:14px;text-align:left;border:1px solid var(--hairline);
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-md);cursor:pointer;font:inherit;color:inherit;
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease}
.te-lesson::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset}
.te-lesson:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.te-lesson-top{display:flex;align-items:flex-start;justify-content:space-between}
.te-ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--brand);
  background:var(--brand-soft);border:1px solid rgba(255,255,255,.6);box-shadow:0 1px 0 rgba(255,255,255,.5) inset}
.te-lnum{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.te-ltitle{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:18px;font-weight:800;margin-top:2px}
.te-status{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-top:auto}
.te-dot{width:8px;height:8px;border-radius:50%}
.s-done{color:var(--success)} .s-done .te-dot{background:var(--success)}
.s-go{color:var(--brand)} .s-go .te-dot{background:var(--brand)}
.s-new{color:var(--muted)} .s-new .te-dot{background:var(--subtle)}

/* buttons */
.te-btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:inherit;font-weight:700;
  font-size:15px;padding:13px 22px;border-radius:14px;border:1px solid transparent;cursor:pointer;
  transition:transform .14s cubic-bezier(.2,.7,.2,1), box-shadow .18s ease, background .18s ease}
.te-btn:active{transform:scale(.98)}
.te-btn-primary{color:#fff;background:linear-gradient(150deg,var(--brand-2),var(--brand));
  box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 4px 12px rgba(21,53,123,.22)}
.te-btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 8px 20px rgba(21,53,123,.28)}
.te-btn-primary:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.te-btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:var(--sh-sm)}
.te-btn-ghost:hover{border-color:#D3D9E6}
.te-btn-lg{padding:16px 28px;font-size:16px}
.te-back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted);
  background:none;border:0;cursor:pointer;padding:6px 0;margin-bottom:14px;font-family:inherit}
.te-back:hover{color:var(--ink)}

/* lesson detail */
.te-lead{max-width:760px;margin:0 auto}
.te-video{position:relative;aspect-ratio:16/9;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh-lg);
  background:radial-gradient(700px 360px at 50% 40%, #244562 0%, #0F2236 82%);display:grid;place-items:center}
.te-play{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:var(--brand);
  background:rgba(255,255,255,.95);box-shadow:0 12px 30px rgba(0,0,0,.35);cursor:pointer;border:0;
  transition:transform .15s ease}
.te-play:hover{transform:scale(1.06)}
.te-vchip{position:absolute;left:16px;top:16px;font-size:12px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.4);padding:6px 12px;border-radius:999px;display:flex;gap:6px;align-items:center}
.te-vdur{position:absolute;right:14px;bottom:14px;font-size:12px;font-weight:700;color:#fff;
  background:rgba(0,0,0,.55);padding:5px 9px;border-radius:8px}
.te-note{text-align:center;font-size:12.5px;color:var(--subtle);margin-top:10px}
.te-explain{padding:26px 28px;margin-top:22px}
.te-explain h2{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:21px;font-weight:800;margin:0 0 18px}
.te-block{border-radius:14px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line)}
.te-block .bh{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:8px}
.b-rule{background:var(--brand-soft);border-color:#D6E2EF}.b-rule .bh{color:var(--brand)}
.b-ex{background:#F6F8FB}.b-ex .bh{color:var(--muted)}
.b-mis{background:var(--success-soft);border-color:#CFEEDE}.b-mis .bh{color:var(--success)}
.te-ex-row{font-size:16px;font-weight:600;padding:3px 0}
.te-bad,.te-good{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;padding:3px 0}
.te-bad{color:var(--danger)} .te-good{color:var(--success)}

/* practice intro */
.te-intro{max-width:520px;margin:10px auto 0;padding:38px 32px;text-align:center}
.te-intro .ring{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;margin:0 auto 18px;
  color:#fff;background:linear-gradient(150deg,var(--brand-2),var(--brand));box-shadow:var(--sh-md)}
.te-intro h2{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:24px;font-weight:800;margin:0 0 6px}
.te-pillrow{display:flex;gap:12px;justify-content:center;margin:20px 0 26px}
.te-pill{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;
  background:#F6F8FB;border:1px solid var(--line)}
.te-pill svg{color:var(--brand-2)}

/* exercise */
.te-ex-head{max-width:680px;margin:0 auto 18px}
.te-ex-meta{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.te-qcard{max-width:680px;margin:0 auto;padding:30px 30px 26px}
.te-qhint{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle)}
.te-qtext{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:24px;font-weight:800;line-height:1.4;margin:10px 0 22px}
.te-blank{color:var(--brand)}
.te-opts{display:flex;flex-direction:column;gap:11px}
.te-opt{display:flex;align-items:center;gap:13px;padding:15px 17px;border-radius:13px;border:1.5px solid var(--line);
  background:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;text-align:left;width:100%;
  transition:border-color .14s ease, background .14s ease}
.te-opt:not([data-locked="true"]):hover{border-color:#B7CADE}
.te-opt[data-sel="true"]{border-color:var(--brand);background:var(--brand-soft)}
.te-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.te-opt[data-sel="true"] .te-radio{border-color:var(--brand)}
.te-radio i{width:11px;height:11px;border-radius:50%;background:var(--brand);transform:scale(0)}
.te-opt[data-sel="true"] .te-radio i{transform:scale(1);transition:transform .14s ease}
.te-ex-foot{max-width:680px;margin:18px auto 0;display:flex;justify-content:space-between;align-items:center}

/* result */
.te-result{max-width:520px;margin:10px auto 0;padding:40px 34px;text-align:center}
.te-score{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:56px;font-weight:800;letter-spacing:-.03em;line-height:1}
.te-score span{font-size:26px;color:var(--subtle)}
.te-result h2{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:22px;font-weight:800;margin:14px 0 4px}
.te-medal{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 6px;color:#fff;
  background:linear-gradient(150deg,#63C0A0,#3E9A78);box-shadow:var(--sh-md)}
.te-review{margin-top:22px;text-align:left;border-top:1px solid var(--line);padding-top:18px}
.te-rev-item{padding:14px 16px;border-radius:12px;background:#F6F8FB;border:1px solid var(--line);margin-bottom:10px}
.te-rev-item .q{font-weight:700;font-size:15px;margin-bottom:6px}
.te-rev-item .row{font-size:14px;font-weight:600}
.te-actions{display:flex;gap:12px;margin-top:26px}
.te-actions .te-btn{flex:1}

@media (max-width:760px){
  .te-hero{grid-template-columns:1fr}
  .te-grid{grid-template-columns:1fr}
  .te-tabs{display:none}
  .te-h1{font-size:25px}
}
.te button:focus-visible, .te .te-lesson:focus-visible{outline:3px solid #A9C2DD;outline-offset:2px}
@media (prefers-reduced-motion:reduce){
  .te *{animation:none!important;transition:none!important}
}

/* circular learner avatar (navy / gold / white) */
.te-avatar{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-weight:800;font-size:14px;color:var(--gold);letter-spacing:.02em;
  background:linear-gradient(150deg,#2A5BD7,#15357B);box-shadow:var(--sh-sm), inset 0 0 0 2px var(--gold);
  margin-left:auto}
.te-avatar:hover{box-shadow:var(--sh-md), inset 0 0 0 2px var(--gold)}
.te-avatar.lg{width:88px;height:88px;font-size:30px;margin:0 auto;
  box-shadow:var(--sh-md), inset 0 0 0 3px var(--gold)}

/* bottom navigation */
.te-bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.82);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-top:1px solid var(--hairline);
  display:flex;justify-content:center;gap:10px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 24px rgba(21,53,123,.05), 0 1px 0 rgba(255,255,255,.6) inset}
.te-navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;cursor:pointer;
  font-family:inherit;font-size:11.5px;font-weight:700;color:var(--subtle);padding:8px 26px;border-radius:14px;
  transition:color .15s ease, background .15s ease}
.te-navbtn[data-on="true"]{color:var(--brand);background:var(--brand-soft)}

/* profile */
.te-profile{max-width:640px;margin:0 auto}
.te-profile-head{text-align:center;padding:30px 28px}
.te-profile-head h2{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:22px;font-weight:800;margin:14px 0 2px}
.te-statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}
.te-stat{padding:18px 14px;text-align:center}
.te-stat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;margin:0 auto 10px}
.te-stat b{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:22px;font-weight:800;display:block;line-height:1.1}
.te-stat small{color:var(--subtle);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.te-ach{display:flex;flex-wrap:wrap;gap:10px}
.te-achchip{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--gold-deep);
  background:var(--gold-soft);border:1px solid #EFE0C2;border-radius:999px;padding:9px 15px}
.te-achchip svg{color:var(--gold-deep)}

/* richer wrong-answer feedback inside review */
.te-rev-item .rev-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.te-rev-item .rev-exp{font-size:13.5px;color:var(--muted);margin-top:10px;line-height:1.5}
.te-rev-item .rev-exp b,.te-rev-item .rev-mis b{display:block;font-size:11px;font-weight:800;text-transform:uppercase;
  letter-spacing:.08em;color:var(--subtle);margin-bottom:3px}
.te-rev-item .rev-mis{margin-top:10px;display:flex;flex-direction:column;gap:2px;font-size:14px;font-weight:600}
.te-rev-item .rev-mis span{display:flex;align-items:center;gap:8px}

/* Today's Review card */
.te-revcard{margin-top:18px;padding:22px 26px;display:flex;align-items:center;gap:18px}
.te-revcard .ric{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none}
.te-revcard .rtext{flex:1;min-width:0}
.te-revcard h3{font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-size:18px;font-weight:800;margin:3px 0 2px}
.te-revcard p{margin:0;font-size:13.5px;color:var(--muted)}
@media (max-width:560px){
  .te-revcard{flex-wrap:wrap}
  .te-revcard .te-btn{width:100%;justify-content:center}
}

/* per-question answer feedback layer */
.te-opt[data-correct="true"]{border-color:var(--success);background:var(--success-soft)}
.te-opt[data-wrong="true"]{border-color:var(--maroon);background:var(--danger-soft)}
.te-opt[data-locked="true"]{cursor:default}
.te-opt .te-opt-ic{margin-left:auto}
.te-fb{margin-top:18px;border-radius:14px;padding:16px 18px;border:1px solid var(--line);animation:rise .28s ease both}
.te-fb.ok{background:var(--success-soft);border-color:#CDEBDF}
.te-fb.bad{background:var(--danger-soft);border-color:#F0D6DE}
.te-fb .fb-h{display:flex;align-items:center;gap:8px;font-family:var(--te-font-display, 'Fredoka','Nunito',sans-serif);font-weight:800;font-size:16px}
.te-fb.ok .fb-h{color:var(--success)}
.te-fb.bad .fb-h{color:var(--maroon)}
.te-fb .fb-sub{font-size:14px;font-weight:600;color:var(--muted);margin-top:4px}
.te-fb .fb-line{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:12px;line-height:1.5}
.te-fb .fb-line b{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
  color:var(--subtle);margin-bottom:3px}
.te-fb .fb-line .te-bad,.te-fb .fb-line .te-good{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:2px}

@media (max-width:560px){ .te-statgrid{grid-template-columns:1fr} }

/* ============================================================
   EXERCISE & FEEDBACK \u2014 UI polish pass (additive, CSS-only)
   Refines the core practice loop only. No markup / logic change.
   Sits under the global prefers-reduced-motion guard above.
============================================================ */
/* progress fill glides as you advance through questions */
.te-bar>i{transition:width .45s cubic-bezier(.2,.7,.2,1)}

/* answer options: tactile press + smoother multi-prop transition */
.te-opt{transition:border-color .15s ease, background .15s ease,
  box-shadow .18s ease, transform .12s cubic-bezier(.2,.7,.2,1)}
.te-opt:not([data-locked="true"]):active{transform:scale(.992)}

/* selected (pre-check) gains a soft brand ring for clearer affordance */
.te-opt[data-sel="true"]{box-shadow:0 0 0 3px rgba(21,53,123,.10)}

/* once locked, drop the selected ring so it never clashes with reveal colours */
.te-opt[data-locked="true"][data-sel="true"]{box-shadow:none}

/* on reveal, fade options that are neither the answer nor the user's pick */
.te-opt[data-locked="true"]:not([data-correct="true"]):not([data-wrong="true"]){opacity:.5}

/* correct answer: one gentle confirming pulse */
.te-opt[data-correct="true"]{animation:te-correct-pulse .55s ease both}
@keyframes te-correct-pulse{
  0%{box-shadow:0 0 0 0 rgba(79,174,138,0)}
  35%{box-shadow:0 0 0 5px rgba(79,174,138,.18)}
  100%{box-shadow:0 0 0 0 rgba(79,174,138,0)}
}

/* the check / cross on reveal pops in instead of snapping */
.te-opt-ic{animation:te-ic-pop .26s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes te-ic-pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}

/* feedback panel: badge the leading icon for stronger hierarchy */
.te-fb .fb-h svg{width:28px;height:28px;padding:5px;border-radius:9px;flex:none}
.te-fb.ok .fb-h svg{background:rgba(79,174,138,.14)}
.te-fb.bad .fb-h svg{background:rgba(139,30,63,.10)}

/* ============================================================
   HOMEPAGE \u2014 UI polish pass 2 (additive, CSS-only)
   Scoped under .te-home so lessons / lesson / profile screens
   are unaffected. Refines the Continue Learning card, Today's
   Review card, homepage spacing rhythm, and heading hierarchy.
   No new gradients / glass / transparency. Identity preserved.
============================================================ */

/* --- spacing & reading rhythm --- */
.te-home .te-hero{margin-top:26px;gap:20px}
.te-home .te-revcard{margin-top:20px}
.te-home .te-sec-h{margin:48px 0 20px}
.te-home .te-grid{gap:20px}
.te-home .te-h1{letter-spacing:-.025em}

/* --- Continue Learning card: premium material + hierarchy + CTA --- */
.te-home .te-resume{
  padding:28px 30px;cursor:pointer;
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,
             0 10px 24px rgba(21,42,67,.22),
             0 30px 60px rgba(21,42,67,.16);
}
.te-home .te-resume:hover{
  transform:translateY(-2px);
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,
             0 16px 32px rgba(21,42,67,.26),
             0 38px 72px rgba(21,42,67,.20);
}
.te-home .te-resume .lbl{letter-spacing:.14em}
.te-home .te-resume h3{font-size:24px;line-height:1.22;margin:13px 0 6px;letter-spacing:-.01em}
.te-home .te-resume .next{font-size:14px;opacity:.82;line-height:1.45}
/* stronger gold CTA \u2014 background stays gold per identity */
.te-home .te-resume .te-btn{
  padding:14px 22px;font-weight:800;letter-spacing:.01em;
  box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 6px 16px rgba(217,181,107,.34);
}
.te-home .te-resume:hover .te-btn{
  transform:translateY(-1px);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 10px 22px rgba(217,181,107,.42);
}

/* --- Today's Review card: cleaner hierarchy + readability --- */
.te-home .te-revcard .ric{
  width:48px;height:48px;border-radius:14px;
  box-shadow:inset 0 0 0 1px rgba(21,53,123,.06);
}
.te-home .te-revcard .te-eyebrow{letter-spacing:.14em}
.te-home .te-revcard h3{font-size:18.5px;line-height:1.25;margin:5px 0 3px}
.te-home .te-revcard p{font-size:13.5px;color:var(--muted);line-height:1.45}

/* ============================================================
   LESSON CARDS \u2014 UI polish pass 3 (additive, CSS-only)
   Targets .te-lesson, refining the card wherever it renders
   (Recent lessons + All lessons). State-aware styling uses :has()
   so NO markup change is needed; cards fall back to the default
   brand look if :has() is unsupported. Identity + structure +
   lesson order + progress values all preserved.
============================================================ */

/* spacing & hierarchy */
.te-lesson{padding:24px 22px;gap:15px}
.te-lnum{letter-spacing:.12em}
.te-ltitle{margin-top:3px;line-height:1.3}

/* icon chip: a touch more material presence */
.te-ico{
  transition:transform .22s cubic-bezier(.2,.7,.2,1), box-shadow .22s ease;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(21,53,123,.06);
}

/* state-aware icon chip (continue keeps the default brand look) */
.te-lesson:has(.te-status.s-done) .te-ico{background:var(--success-soft);color:var(--success)}
.te-lesson:has(.te-status.s-new) .te-ico{background:#EFF1F5;color:var(--subtle)}

/* progress ring label: tighter tracking, tinted to match state */
.te-lesson-top svg text{letter-spacing:-.02em}
.te-lesson:has(.te-status.s-done) .te-lesson-top svg text{fill:var(--success)}
.te-lesson:has(.te-status.s-new) .te-lesson-top svg text{fill:var(--subtle)}

/* status indicator: subtle ring on active / complete, calm when not started */
.te-status .te-dot{transition:box-shadow .2s ease}
.s-done .te-dot{box-shadow:0 0 0 3px rgba(79,174,138,.16)}
.s-go .te-dot{box-shadow:0 0 0 3px rgba(21,53,123,.14)}

/* hover / press feel */
.te-lesson:active{transform:translateY(-1px)}
.te-lesson:hover .te-ico{transform:translateY(-1px)}
.te-status svg{transition:transform .18s ease}
.te-lesson:hover .te-status svg{transform:translateX(3px)}

/* ============================================================
   LESSON DETAIL \u2014 UI polish pass 4 (additive, CSS-only)
   Scoped under .te-lead (unique to this screen) so nothing else
   is affected. Refines page hierarchy, the video frame, the
   explanation card readability, and the Start-Practice CTA.
   Video embed / lesson flow / content untouched. No glass /
   heavy gradients. Identity preserved.
============================================================ */

/* page hierarchy & back button */
.te-lead .te-eyebrow{letter-spacing:.14em}
.te-lead .te-h1{letter-spacing:-.025em}
.te-lead .te-back{margin-bottom:16px}
.te-lead .te-back svg{transition:transform .18s ease}
.te-lead .te-back:hover svg{transform:translateX(-2px)}

/* video: crisp hairline ring around the existing frame */
.te-lead .te-video{box-shadow:var(--sh-lg), 0 0 0 1px var(--hairline)}

/* explanation card: more air + steadier reading rhythm */
.te-lead .te-explain{margin-top:24px;padding:28px 30px}
.te-lead .te-explain h2{margin:0 0 20px;letter-spacing:-.01em}
.te-lead .te-block{padding:18px 20px;margin-bottom:14px;border-radius:16px}
.te-lead .te-block .bh{margin-bottom:10px;letter-spacing:.11em}
.te-lead .te-ex-row{padding:4px 0;line-height:1.5}
.te-lead .te-bad,.te-lead .te-good{padding:4px 0}

/* Start-Practice CTA: richer navy lift + forward-moving arrow */
.te-lead .te-btn-primary{box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 6px 16px rgba(21,53,123,.24)}
.te-lead .te-btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 12px 26px rgba(21,53,123,.30)}
.te-lead .te-btn svg{transition:transform .18s ease}
.te-lead .te-btn-primary:hover svg{transform:translateX(3px)}

/* ============================================================
   RESULT PAGE \u2014 UI polish pass 5 (additive, CSS-only)
   Scoped under .te-result (unique to this screen) so nothing
   else is affected. Refines score presentation, completion
   message hierarchy, card spacing, medal polish, and the
   Review / Continue CTA hierarchy. Scoring / result / review-
   pool logic untouched. No glass / heavy gradients. Identity kept.
============================================================ */

/* card spacing */
.te-result{padding:44px 36px}

/* medal: more material presence (success identity kept) */
.te-result .te-medal{
  margin:0 auto 10px;
  box-shadow:var(--sh-md), inset 0 1px 0 rgba(255,255,255,.4),
             inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 24px rgba(62,154,120,.26);
}

/* completion eyebrow + score presentation */
.te-result .te-eyebrow{letter-spacing:.14em}
.te-result .te-score{font-size:60px;letter-spacing:-.035em}
.te-result .te-score span{font-weight:700;margin-left:2px}

/* verdict + supporting line hierarchy */
.te-result h2{font-size:23px;letter-spacing:-.01em;margin:12px 0 6px}
.te-result .te-sub{line-height:1.5;max-width:380px;margin-left:auto;margin-right:auto}

/* mistakes review: a touch more air + readability */
.te-result .te-review{margin-top:26px;padding-top:20px}
.te-result .te-rev-item{padding:16px 18px;border-radius:14px;margin-bottom:12px}

/* Review / Continue CTAs: clearer hierarchy + motion cues */
.te-result .te-actions{margin-top:28px}
.te-result .te-btn-primary{box-shadow:0 1px 0 rgba(255,255,255,.22) inset, 0 6px 16px rgba(21,53,123,.24)}
.te-result .te-btn-primary:hover{box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 12px 26px rgba(21,53,123,.30)}
.te-result .te-btn svg{transition:transform .2s ease}
.te-result .te-btn-primary:hover svg{transform:translateX(3px)}
.te-result .te-btn-ghost:hover svg{transform:rotate(-28deg)}

/* ============================================================
   PROFILE PAGE \u2014 UI polish pass 6 (additive, CSS-only)
   Scoped under .te-profile (unique to this screen). Refines the
   header hierarchy, stat cards, achievement chips, and the empty
   achievement state. Real statistics / XP / achievement logic
   untouched. No glass / heavy gradients. Identity preserved.
============================================================ */

/* header: hierarchy + premium avatar depth (gold ring kept) */
.te-profile .te-profile-head{padding:34px 28px}
.te-profile .te-profile-head h2{margin:16px 0 3px;letter-spacing:-.01em}
.te-profile .te-profile-head .te-sub{font-size:14px}
.te-profile .te-avatar.lg{box-shadow:var(--sh-md), inset 0 0 0 3px var(--gold), 0 8px 22px rgba(21,53,123,.18)}

/* stat cards: more air + clearer number/label hierarchy */
.te-profile .te-statgrid{gap:16px;margin-top:20px}
.te-profile .te-stat{padding:20px 16px}
.te-profile .te-stat .ic{width:44px;height:44px;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(21,53,123,.05)}
.te-profile .te-stat b{font-size:24px;letter-spacing:-.02em}
.te-profile .te-stat small{letter-spacing:.05em}

/* achievements: heading + premium gold chips */
.te-profile .te-sec-h h2{letter-spacing:-.01em}
.te-profile .te-ach{gap:11px}
.te-profile .te-achchip{padding:10px 16px;border-color:#ECDBB8;box-shadow:0 1px 2px rgba(176,138,62,.10)}

/* empty achievement state: a tidy, restrained placeholder panel */
.te-profile > .te-sub{margin-top:2px;padding:22px;text-align:center;color:var(--muted);
  border:1px dashed var(--line);border-radius:16px;background:#FBFCFD}

/* ============================================================
   BRAND LOGO \u2014 pass 7b (full lockup)
   Full TOUCH ENGLISH wordmark + bars + checkmark (from the provided
   logo; tagline omitted for header legibility, white feathered to
   transparent). Occupies the same top-left brand slot; the duplicate
   text label is removed. Header layout / navigation / logic untouched.
============================================================ */
.te-logo-img{height:30px;width:auto;display:block}
@media (max-width:760px){ .te-logo-img{height:26px} }

/* ============================================================
   GLOBAL FINAL POLISH \u2014 pass 7 (additive, CSS-only)
   Cross-screen consistency only: premium text rendering, tabular
   figures for stats/scores, branded selection, and house-standard
   interaction feedback on the interactive elements that still
   lacked it (cards / options / buttons already have it). No layout,
   structure, shadow, or logic changes. The existing global
   prefers-reduced-motion guard disables all of the transitions below.
============================================================ */

/* premium text rendering + calm mobile taps */
.te{text-rendering:optimizeLegibility;-moz-osx-font-smoothing:grayscale}
.te button{-webkit-tap-highlight-color:transparent}

/* branded text selection */
.te ::selection{background:rgba(21,53,123,.16)}
.te ::-moz-selection{background:rgba(21,53,123,.16)}

/* tabular figures so stat numbers / scores never jitter */
.te-score,.te-prog-num,.te-stat b,.te-meta b{font-variant-numeric:tabular-nums}

/* consistent transition timing + press feedback (house easing) */
.te-tab{transition:color .15s ease, background .15s ease, transform .12s cubic-bezier(.2,.7,.2,1)}
.te-tab:not([data-on="true"]):hover{background:rgba(21,53,123,.05);color:var(--brand-2)}
.te-tab:active{transform:scale(.96)}
.te-navbtn{transition:color .15s ease, background .15s ease, transform .12s cubic-bezier(.2,.7,.2,1)}
.te-navbtn:active{transform:scale(.96)}
.te-avatar{transition:box-shadow .18s ease, transform .12s cubic-bezier(.2,.7,.2,1)}
.te-avatar:active{transform:scale(.96)}
.te-back{transition:color .15s ease}
.te-home .te-resume:active{transform:translateY(-1px)}

/* lesson detail breadcrumb \u2014 clean one-line hierarchy (back left, lesson right) */
.te-lead .te-crumb{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
.te-lead .te-crumb .te-back{margin-bottom:0}
.te-lead .te-crumb-now{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.01em;white-space:nowrap}

/* lesson video \u2014 "Open on YouTube" fallback link (restored 2026-08-22 to match the deployed build) */
.te-note .te-vlink{color:var(--brand-2);font-weight:700;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s ease}
.te-note .te-vlink:hover{border-bottom-color:currentColor}
.te-vlink{color:var(--brand-2);font-weight:700;text-decoration:none;border-bottom:1px solid transparent;transition:border-color .15s ease}
.te-vlink:hover{border-bottom-color:currentColor}

/* \u5728\u5E73\u53F0\u91CC\u4E0A\u8BFE\uFF08profile.js \u5728 <html> \u6302 te-platform\uFF09\uFF1A\u4E2A\u4EBA\u9875\u53EA\u6709\u5E73\u53F0\u4E00\u4E2A\uFF0C
   \u8FD9\u91CC\u7684 Profile \u5206\u9875\u3001\u53F3\u4E0A\u89D2\u7684\u5934\u50CF\u6309\u94AE\u90FD\u4E0D\u663E\u793A\uFF08Marco 2026-09-24\uFF09 */
html.te-platform .te-bottomnav, html.te-platform .te-avatar{display:none !important}
/* \u6392\u53E5\u9898\u7684\u8BCD\u5757\uFF082026-09-24\uFF09\uFF1A\u9898\u76EE\u4E0D\u518D\u628A\u8BCD\u7167\u987A\u5E8F\u5217\u51FA\u6765\uFF0C\u5B66\u751F\u81EA\u5DF1\u70B9\u51FA\u987A\u5E8F */
.te-build{display:flex;flex-direction:column;gap:14px}
.te-build-line{min-height:58px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:13px;
  border:1.5px dashed var(--line);background:#F6F8FB}
.te-build-line[data-state="ok"]{border-style:solid;border-color:var(--success);background:var(--success-soft)}
.te-build-line[data-state="bad"]{border-style:solid;border-color:var(--maroon);background:var(--danger-soft)}
.te-build-ph{color:var(--subtle);font-size:14px;font-weight:600}
.te-build-done{font-size:16px;font-weight:700}
.te-tiles{display:flex;flex-wrap:wrap;gap:8px}
.te-tile{font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#fff;border:1.5px solid var(--line);
  border-radius:11px;padding:10px 14px;min-height:44px;cursor:pointer;transition:border-color .15s ease, opacity .15s ease}
.te-tile:hover{border-color:#B7CADE}
.te-tile[data-placed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.te-tile:disabled{opacity:.3;cursor:default}
/* \u5F71\u7247\u8BF4\u9519\u7684\u5730\u65B9\uFF0C\u8BFE\u7A0B\u5728\u8BB2\u89E3\u5361\u91CC\u6CE8\u660E\uFF08\u5F71\u7247\u4E0D\u6362\uFF0CMarco \u7684\u89C4\u5219\uFF09 */

keys in are the drawer.","In the drawer the keys are."],a:"The keys are in the drawer."},{id:"pre-35",type:"build",p:"Put the words in order: [The clock] [is] [on] [the wall]",o:["The clock is on the wall.","The clock on is the wall.","On the wall the clock is."],a:"The clock is on the wall."}],generic:[{p:"I have two [____].",o:["book","books","bookes"],a:"books"},{p:"She [____] to school every day.",o:["go","goes","going"],a:"goes"},{p:"This is [____] interesting topic.",o:["a","an","the"],a:"an"},{p:"There [____] three chairs in the room.",o:["is","are","am"],a:"are"},{p:"[____] name is Anna.",o:["My","Me","I"],a:"My"},{p:"He can [____] very fast.",o:["run","runs","running"],a:"run"},{p:"We [____] dinner at 7 pm.",o:["have","has","having"],a:"have"},{p:"The cat is [____] the table.",o:["on","in","at"],a:"on"},{p:"She is [____] than her sister.",o:["tall","taller","tallest"],a:"taller"},{p:"[____] you like coffee?",o:["Do","Does","Is"],a:"Do"},{p:"They are watching [____] film.",o:["a","an","the"],a:"a"},{p:"I [____] my homework yesterday.",o:["do","did","done"],a:"did"}]},rl={whatbe:{objective:"Learn to ask what something is, and answer with It's / They're.",title:"What + Be Form",ruleLines:["One thing: What is it? - It is a fork. / It's a fork.","More than one: What are they? - They are switches. / They're switches.","It's and They're are the short forms."],ruleCn:["\u4E00\u6837\u4E1C\u897F\uFF1A\u95EE What is it? \u56DE\u7B54 It is / It's \u2026","\u4E24\u6837\u6216\u4EE5\u4E0A\uFF1A\u95EE What are they? \u56DE\u7B54 They are / They're \u2026","\u7F29\u5199\uFF1AIt's = It is\uFF0CThey're = They are\u3002"],rule:"Use What is it? for one thing and What are they? for more than one.",examples:["What is it? - It is a fork. / It's a fork.","What is it? - It is a knife. / It's a knife.","What are they? - They are switches. / They're switches.","What is it? - It is a water tap."],bad:"What are it?",good:"What is it?",mistakes:[{bad:"What are it?",good:"What is it?"},{bad:"Its a fork.",good:"It's a fork."}]},thisthat:{objective:"Learn this / that / these / those, and their negatives.",title:"This, That, These, Those",ruleLines:["Near you: this (one) / these (more than one).","Far from you: that (one) / those (more than one).","One thing uses is. More than one uses are."],ruleCn:["\u8FD1\u7684\uFF1Athis \u8FD9\u4E2A\uFF08\u5355\u6570\uFF09/ these \u8FD9\u4E9B\uFF08\u590D\u6570\uFF09\u3002","\u8FDC\u7684\uFF1Athat \u90A3\u4E2A\uFF08\u5355\u6570\uFF09/ those \u90A3\u4E9B\uFF08\u590D\u6570\uFF09\u3002","\u5355\u6570\u914D is\uFF0C\u590D\u6570\u914D are\u3002"],rule:"Use this and these for things near you, that and those for things far away.",examples:["This is a book. / This is my book.","These are books.","That is the moon. (There is only one moon, so we say the moon.)","Those are cars.","This isn't a book. / Those aren't birds."],bad:"These is books.",good:"These are books.",mistakes:[{bad:"These is books.",good:"These are books."},{bad:"This are a book.",good:"This is a book."}],videoNote:`The video says "That isn't a cheese." We don't count cheese, so we say "That isn't cheese." (or "That isn't a piece of cheese.")`},posspron:{objective:"Learn mine, yours, his, hers, ours, theirs.",title:"Possessive Pronouns",ruleLines:["my + noun -> mine. This is my book. -> This book is mine.","your -> yours, our -> ours, their -> theirs, her -> hers, his -> his.","A possessive pronoun stands alone. No noun after it.","its almost always comes before a noun (its toy) - that is a possessive adjective, like my toy."],ruleCn:["my + \u540D\u8BCD = mine\uFF08\u6211\u7684\uFF09\uFF1A\u8FD9\u672C\u4E66\u662F\u6211\u7684\u3002","your \u2192 yours\uFF0Cour \u2192 ours\uFF0Ctheir \u2192 theirs\uFF0Cher \u2192 hers\uFF0Chis \u4E0D\u53D8\u3002","\u6240\u6709\u683C\u4EE3\u8BCD\u5355\u72EC\u7528\uFF0C\u540E\u9762\u4E0D\u63A5\u540D\u8BCD\uFF08\u4E0D\u8BF4 mine book\uFF09\u3002","its \u51E0\u4E4E\u53EA\u653E\u5728\u540D\u8BCD\u524D\u9762\uFF08its toy\uFF09\uFF0C\u662F\u6240\u6709\u683C\u5F62\u5BB9\u8BCD\uFF0C\u8DDF my toy \u4E00\u6837\u3002"],rule:"Use mine, yours, his, hers, ours and theirs in place of a possessive adjective plus noun.",examples:["I have a new book. It is mine.","You have a new toy. It is yours.","We have new coats. They are ours.","He has a new car. The car is his.","The cat has a new toy. Its toy is red. (its + noun, like my + noun)"],videoNote:'The video lists "its" with mine, yours and hers. In real English "its" is used before a noun ("its toy", "its name"), like my or your - we almost never say "The toy is its."',bad:"This book is my.",good:"This book is mine.",mistakes:[{bad:"This book is my.",good:"This book is mine."},{bad:"These coats are our.",good:"These coats are ours."}]},thenoun:{objective:"Learn when to use the instead of a / an.",title:"The + Noun",ruleLines:["First time you talk about something: a / an.","Second time, the listener knows it: the.","Only one in the world: the (the sun, the moon).","You and the listener both know which one: the (the office, the door)."],ruleCn:["\u7B2C\u4E00\u6B21\u63D0\u5230\uFF1A\u7528\u4E0D\u5B9A\u51A0\u8BCD a / an\u3002","\u7B2C\u4E8C\u6B21\u63D0\u5230\uFF08\u5BF9\u65B9\u5DF2\u7ECF\u77E5\u9053\u662F\u54EA\u4E00\u4E2A\uFF09\uFF1A\u7528\u5B9A\u51A0\u8BCD the\u3002","\u4E16\u4E0A\u53EA\u6709\u4E00\u4E2A\u7684\uFF1A\u7528 the\uFF08the sun\u3001the moon\uFF09\u3002","\u53CC\u65B9\u90FD\u77E5\u9053\u662F\u54EA\u4E00\u4E2A\uFF1A\u7528 the\uFF08the office\u3001the door\uFF09\u3002"],rule:"Use a or an the first time, and the after that - or when there is only one, or the listener knows which one.",examples:["I watched a movie. The movie was fun.","It's an ant. The ant is small.","She is a girl. The girl is pretty.","The sun is very strong today.","Please close the door. (the door of this room)","I am at the office. (my office - you know which one)"],bad:"I watched a movie. A movie was fun.",good:"I watched a movie. The movie was fun.",mistakes:[{bad:"I watched a movie. A movie was fun.",good:"I watched a movie. The movie was fun."},{bad:"A sun is very strong today.",good:"The sun is very strong today."}],videoNote:`The video says "It's a sun." There is only one sun, so we say "It's the sun."`},dontdoesnt:{objective:"Learn to say what someone does not have.",title:"Don't & Doesn't Have",ruleLines:["do not = don't, does not = doesn't.","don't have: I, you, we, they.","doesn't have: he, she, it."],ruleCn:["\u7F29\u5199\uFF1Ado not = don't\uFF0Cdoes not = doesn't\u3002","I\u3001you\u3001we\u3001they \u7528 don't have\u3002","\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\uFF08he\u3001she\u3001it\uFF09\u7528 doesn't have\u3002"],rule:"Use don't have with I, you, we and they. Use doesn't have with he, she and it.",examples:["I don't have a child.","She doesn't have an umbrella.","My cat doesn't have a new toy.","My parents don't have a sports car.","A snake doesn't have legs."],bad:"She don't have an umbrella.",good:"She doesn't have an umbrella.",mistakes:[{bad:"She don't have an umbrella.",good:"She doesn't have an umbrella."},{bad:"He doesn't has long hair.",good:"He doesn't have long hair."}],videoNote:'The video says "a sport car". The correct form is "a sports car".'},dontdoesntq:{objective:"Learn to ask if someone has something, and give a short answer.",title:"Do / Does + Have (Questions)",ruleLines:["Do + I, you, we, they + have ... ?","Does + he, she, it + have ... ?","After Do / Does, always use have (never has)."],ruleCn:["I\u3001you\u3001we\u3001they \u7684\u95EE\u53E5\uFF1ADo \u2026 have \u2026?","\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\uFF08he\u3001she\u3001it\uFF09\u7684\u95EE\u53E5\uFF1ADoes \u2026 have \u2026?","Do / Does \u540E\u9762\u4E00\u5F8B\u7528 have\uFF0C\u4E0D\u7528 has\u3002"],rule:"Use Do with I, you, we and they, and Does with he, she and it. The verb stays have.",examples:["Do we have a pet? - Yes, we do. / No, we don't.","Does she have a dress? - Yes, she does.","Do they have a scooter? - No, they don't.","Does it have a toy? - Yes, it does."],bad:"Does she has a dress?",good:"Does she have a dress?",mistakes:[{bad:"Does she has a dress?",good:"Does she have a dress?"},{bad:"Do he have a friend?",good:"Does he have a friend?"}]},pronounsq:{objective:"Learn to make yes/no questions by moving the be form to the front.",title:"Pronouns Questions",ruleLines:["Move the be form to the front: Am / Is / Are.","He is an actor. -> Is he an actor?","Short answers: Yes, he is. / No, it isn't."],ruleCn:["\u95EE\u53E5\uFF1A\u628A be \u52A8\u8BCD\uFF08am / is / are\uFF09\u79FB\u5230\u53E5\u9996\u3002","\u4F8B\uFF1AHe is an actor. \u2192 Is he an actor?","\u7B80\u7B54\uFF1AYes, he is. / No, it isn't."],rule:"To ask a yes/no question, move am, is or are to the front of the sentence.",examples:["Am I a student? - Yes, you are.","Is he an actor? - Yes, he is an actor.","Is she a singer? - Yes, she is a singer.","Are they tourists? - Yes, they are tourists.","Is it a dolphin? - No, it isn't a dolphin."],bad:"Is they tourists?",good:"Are they tourists?",mistakes:[{bad:"Is they tourists?",good:"Are they tourists?"},{bad:"He is an actor?",good:"Is he an actor?"}],videoNote:'The video answers "Am I a student?" with "Yes, I am a student." When someone asks about themselves (Am I ...?), you answer about them: "Yes, you are."'},articles:{objective:"Learn when to use a and an before a singular noun.",title:"Using a and an",ruleLines:['Use "an" before a vowel sound: an apple, an email, an hour.','Use "a" before a consonant sound: a book, a manager, a university.','Listen to the sound, not the letter: an hour (the h is silent), a university (it starts with a "you" sound).',"Use a or an with one singular thing."],ruleCn:["\u5143\u97F3\u300C\u53D1\u97F3\u300D\u5F00\u5934\u7684\u5B57\uFF0C\u524D\u9762\u7528 an\u3002","\u8F85\u97F3\u300C\u53D1\u97F3\u300D\u5F00\u5934\u7684\u5B57\uFF0C\u524D\u9762\u7528 a\u3002","\u770B\u53D1\u97F3\uFF0C\u4E0D\u770B\u5B57\u6BCD\uFF1Ahour \u7684 h \u4E0D\u53D1\u97F3\uFF0C\u6240\u4EE5\u7528 an\uFF1Buniversity \u5FF5 you \u5F00\u5934\uFF0C\u6240\u4EE5\u7528 a\u3002","\u51A0\u8BCD a / an \u53EA\u7528\u5728\u5355\u6570\u53EF\u6570\u540D\u8BCD\u524D\u9762\u3002"],rule:'Use "an" before a vowel sound and "a" before a consonant sound. Listen to the sound, not the first letter.',examples:["a manager","a meeting","an apple","an office","an email","an hour","a university"],bad:"a apple",good:"an apple",mistakes:[{bad:"a apple",good:"an apple"},{bad:"a hour",good:"an hour"},{bad:"an university",good:"a university"}],videoNote:'If you hear "use an before a, e, i, o, u", that is a shortcut. The real rule is the first SOUND of the word: an hour, a university.'},pronouns:{objective:"Learn to make negative sentences with am / is / are + not.",title:"Be verb + not (negatives)",ruleLines:['Add "not" after am, is, or are.',"I am not. He is not. They are not.","Use it to say something is false."],ruleCn:["\u5426\u5B9A\u53E5\uFF1Abe \u52A8\u8BCD\uFF08am / is / are\uFF09\u540E\u9762\u52A0 not\u3002","\u4F8B\uFF1AI am not / He is not / They are not\u3002","\u7528\u6765\u8868\u793A\u5426\u5B9A\uFF08\u4E0D\u662F\u3001\u4E0D\u2026\u2026\uFF09\u3002"],rule:'Add "not" after am, is, or are to make a sentence negative.',examples:["I am not busy.","She is not at work.","He is not ready.","We are not late.","They are not students."],bad:"She not is busy.",good:"She is not busy.",mistakes:[{bad:"She not is busy.",good:"She is not busy."},{bad:"I am no tired.",good:"I am not tired."}]},alphabet:{title:"Vowels & Consonants",ruleLines:["The five vowels are A, E, I, O, U.","All the other letters are consonants.","Y is special: it can be a vowel (city, dry) or a consonant (yellow, yawn)."],ruleCn:["\u4E94\u4E2A\u5143\u97F3\uFF1AA\u3001E\u3001I\u3001O\u3001U\u3002","\u5176\u4ED6\u5B57\u6BCD\u90FD\u662F\u8F85\u97F3\u3002","Y \u5F88\u7279\u522B\uFF1A\u6709\u65F6\u5F53\u5143\u97F3\uFF08city\u3001dry\uFF09\uFF0C\u6709\u65F6\u5F53\u8F85\u97F3\uFF08yellow\u3001yawn\uFF09\u3002"],rule:"The five vowels are A, E, I, O, U. All the other letters are consonants.",examples:["The vowels are A, E, I, O, U.","cat \u2014 the vowel is a.","pen \u2014 the vowel is e.","dog \u2014 the vowel is o.","book \u2014 the vowels are o, o.","city \u2014 here Y is a vowel.","yellow \u2014 here Y is a consonant."],bad:"The vowels are A, E, I, O.",good:"The vowels are A, E, I, O, U.",mistakes:[{bad:"The vowels are A, E, I, O.",good:"The vowels are A, E, I, O, U."},{bad:"B is a vowel.",good:"B is a consonant."}]},be:{title:"Subjective pronouns + be (am / is / are)",ruleLines:['Use "am" with I.','Use "is" with he, she, and it.','Use "are" with you, we, and they.'],ruleCn:["I \u914D am\u3002","\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570 he\u3001she\u3001it \u914D is\u3002","you\u3001we\u3001they \u914D are\u3002"],rule:'Use "am" with I, "is" with he, she, and it, and "are" with you, we, and they.',examples:["I am a student.","She is a teacher.","He is busy.","It is hot.","You are ready.","We are classmates.","They are happy."],bad:"She are a teacher.",good:"She is a teacher.",mistakes:[{bad:"She are a teacher.",good:"She is a teacher."},{bad:"I is busy.",good:"I am busy."}]},nouns:{objective:"Learn how to make nouns plural by adding -s or -es.",title:"Singular and plural nouns",ruleLines:["One thing is singular: a book. More than one is plural: two books.","Add -s to most nouns: books, managers.","Add -es after s, x, ch, sh: buses, boxes, watches, dishes.","Consonant + y: change y to i and add -es: baby - babies."],ruleCn:["\u4E00\u4E2A\u662F\u5355\u6570\uFF0C\u4E24\u4E2A\u6216\u4EE5\u4E0A\u662F\u590D\u6570\u3002","\u5927\u90E8\u5206\u540D\u8BCD\u52A0 -s\u3002","\u5B57\u5C3E\u662F s\u3001x\u3001ch\u3001sh \u7684\u540D\u8BCD\u52A0 -es\u3002","\u8F85\u97F3 + y\uFF1A\u628A y \u53D8 i \u518D\u52A0 -es\u3002"],rule:"One thing is singular. For more than one, add -s; add -es after s, x, ch, sh; consonant + y becomes -ies.",examples:["one book \u2014 two books","a teacher \u2014 three teachers","a box \u2014 two boxes","a bus \u2014 three buses","a watch \u2014 two watches","a baby \u2014 two babies"],bad:"two book",good:"two books",mistakes:[{bad:"two book",good:"two books"},{bad:"one books",good:"one book"}]},subjpron:{objective:"Learn the subject pronouns: I, you, he, she, it, we, they.",title:"Subject pronouns",ruleLines:["A pronoun can replace a name.","People: I, you, he, she, we, they.","One thing: it. More than one thing: they."],ruleCn:["\u4E3B\u8BED\u4EE3\u8BCD\u53EF\u4EE5\u4EE3\u66FF\u540D\u5B57\u3002","\u4EBA\uFF1AI \u6211\u3001you \u4F60\uFF0F\u4F60\u4EEC\u3001he \u4ED6\u3001she \u5979\u3001we \u6211\u4EEC\u3001they \u4ED6\u4EEC\u3002","\u4E00\u6837\u4E1C\u897F\u7528 it\uFF0C\u51E0\u6837\u4E1C\u897F\u7528 they\u3002"],rule:"Use I, you, he, she, it, we, they in place of a name.",examples:["I am at work.","You are my colleague.","He is the manager.","She is a teacher.","It is a new office.","We are a team.","They are students."],bad:"Me am a student.",good:"I am a student.",mistakes:[{bad:"Me am a student.",good:"I am a student."},{bad:"Him is busy.",good:"He is busy."}]},possadj:{objective:"Learn to show who something belongs to: my, your, his, her, its, our, their.",title:"Possessive adjectives",ruleLines:["Put my, your, his, her before a noun.","my book, your manager, her office.","our team, their class, its name."],ruleCn:["\u6240\u6709\u683C\u5F62\u5BB9\u8BCD\u653E\u5728\u540D\u8BCD\u524D\u9762\u3002","my \u6211\u7684\u3001your \u4F60\u7684\u3001his \u4ED6\u7684\u3001her \u5979\u7684\u3002","our \u6211\u4EEC\u7684\u3001their \u4ED6\u4EEC\u7684\u3001its \u5B83\u7684\u3002"],rule:"Use my, your, his, her, its, our, their before a noun to show who it belongs to.",examples:["This is my desk.","Your meeting is at nine.","His manager is kind.","Her email is ready.","Our office is new.","Their class is big."],bad:"This is me book.",good:"This is my book.",mistakes:[{bad:"This is me book.",good:"This is my book."},{bad:"She office is new.",good:"Her office is new."}]},thereis:{objective:"Learn to say that something is in a place with there is and there are.",title:"There is / There are",ruleLines:["One thing (a / an / one): There is a cat in the box.","More than one: There are two cats in the box.","To say something is in a place, use there is / there are - not have.","have means to own something: I have a cat."],ruleCn:["\u4E00\u6837\u4E1C\u897F\uFF08a / an / one\uFF09\uFF1A\u7528 there is\u3002","\u4E24\u6837\u6216\u4EE5\u4E0A\uFF08\u590D\u6570\uFF09\uFF1A\u7528 there are\u3002","\u4E2D\u6587\u8BF4\u300C\u67D0\u5904\u6709\u2026\u2026\u300D\uFF0C\u82F1\u6587\u7528 there is / there are\uFF0C\u4E0D\u7528 have\uFF08\u4E0D\u8BF4 Have a cat in the box\uFF09\u3002","have \u662F\u300C\u62E5\u6709\u300D\uFF1AI have a cat.\uFF08\u6211\u517B\u4E86\u4E00\u53EA\u732B\uFF09"],rule:"Use there is for one thing and there are for more than one. Don't use have to say something is in a place.",examples:["There is a cat under the table.","There is a bank near my house.","There are two chairs in the room.","There are many people in the shop."],bad:"Have a cat under the table.",good:"There is a cat under the table.",mistakes:[{bad:"Have a cat under the table.",good:"There is a cat under the table."},{bad:"There is two chairs.",good:"There are two chairs."},{bad:"There have many people in the shop.",good:"There are many people in the shop."}]},havehas:{objective:"Learn when to use have and has.",title:"Have / Has",ruleLines:["Use have with I, you, we, they.","Use has with he, she, it.","I have a job. She has a job."],ruleCn:["I\u3001you\u3001we\u3001they \u7528 have\u3002","\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570 he\u3001she\u3001it \u7528 has\u3002","\u4F8B\uFF1AI have a job. / She has a job."],rule:"Use have with I, you, we, they; use has with he, she, it.",examples:["I have a meeting.","We have a new manager.","They have two offices.","He has a question.","She has a laptop."],bad:"She have a meeting.",good:"She has a meeting.",mistakes:[{bad:"She have a meeting.",good:"She has a meeting."},{bad:"They has a car.",good:"They have a car."}]},presentsimple:{objective:"Learn to talk about habits and facts, and to add -s with he, she and it.",title:"Present Simple",ruleLines:["Use the present simple for habits and facts: I work in a bank.","he / she / it (or one other person or thing: my father, the bus): add -s to the verb. She works. My father drives. (I and you: no -s)","Verbs ending in s, sh, ch, x, o add -es: goes, watches. Consonant + y: study - studies.","Don't put am / is / are before the verb: He works. (not He is work.)"],ruleCn:["\u73B0\u5728\u5F0F\uFF08\u4E00\u822C\u73B0\u5728\u65F6\uFF09\uFF1A\u8BF4\u4E60\u60EF\u3001\u5E38\u505A\u7684\u4E8B\u548C\u4E8B\u5B9E\u3002","\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\uFF08he\u3001she\u3001it\uFF0C\u6216 my father\u3001the bus \u8FD9\u7C7B\u5355\u6570\u4E3B\u8BED\uFF09\uFF1A\u52A8\u8BCD\u52A0 -s\u3002I\u3001you \u4E0D\u52A0\u3002","\u52A8\u8BCD\u5B57\u5C3E\u662F s\u3001sh\u3001ch\u3001x\u3001o \u52A0 -es\uFF1B\u8F85\u97F3 + y \u628A y \u53D8 i \u518D\u52A0 -es\u3002","\u52A8\u8BCD\u524D\u9762\u4E0D\u8981\u52A0 be \u52A8\u8BCD\uFF1AHe works\uFF0C\u4E0D\u8BF4 He is work\u3002"],rule:"Use the present simple for habits and facts. With he, she and it, add -s to the verb.",examples:["I work in a bank.","She works in a hospital.","My father drives a taxi.","He watches TV every night.","My brother studies English.","My parents live in Johor."],bad:"She work every day.",good:"She works every day.",mistakes:[{bad:"She work every day.",good:"She works every day."},{bad:"He is work in a bank.",good:"He works in a bank."},{bad:"He gos to school.",good:"He goes to school."}]},adverbfreq:{objective:"Learn to say how often you do something.",title:"Adverbs of Frequency",ruleLines:["How often? always (every time) - usually - often - sometimes - never (not at any time).","Put the word before the main verb: I always drink coffee.","With am / is / are, put it after: She is never late.","The verb does not change: he / she / it still takes -s. He often works late."],ruleCn:["\u9891\u7387\u526F\u8BCD\uFF1Aalways \u603B\u662F \u2192 usually \u901A\u5E38 \u2192 often \u5E38\u5E38 \u2192 sometimes \u6709\u65F6 \u2192 never \u4ECE\u4E0D\u3002","\u653E\u5728\u4E00\u822C\u52A8\u8BCD\uFF08\u884C\u4E3A\u52A8\u8BCD\uFF09\u524D\u9762\u3002","\u9047\u5230 be \u52A8\u8BCD\uFF08am / is / are\uFF09\uFF0C\u653E\u5728 be \u52A8\u8BCD\u540E\u9762\u3002","\u52A0\u4E86\u9891\u7387\u526F\u8BCD\uFF0C\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\u7684\u52A8\u8BCD\u8FD8\u662F\u8981\u52A0 -s\u3002"],rule:"Put always, usually, often, sometimes and never before the main verb, but after am, is and are.",examples:["I always drink coffee in the morning.","She usually walks to school.","We often eat out on Sunday.","He is never late.","They are sometimes busy."],bad:"She never late.",good:"She is never late.",mistakes:[{bad:"She never late.",good:"She is never late."},{bad:"I check always my email.",good:"I always check my email."},{bad:"He always walk to school.",good:"He always walks to school."}]},presentcont:{objective:"Learn to talk about what is happening now.",title:"Present Continuous",ruleLines:["am / is / are + verb-ing: I am reading. She is working.","Use it for something happening now: Look! He is running.","You need both parts: She is working. (not She working / She is work)","Spelling: make - making, sit - sitting, run - running.","For habits (every day), use the present simple: He goes to work every day."],ruleCn:["\u73B0\u5728\u8FDB\u884C\u5F0F\uFF1Aam / is / are + \u52A8\u8BCD-ing\u3002","\u8868\u793A\u300C\u6B63\u5728\u300D\u53D1\u751F\u7684\u4E8B\uFF08now\u3001Look!\u3001Listen!\uFF09\u3002","\u4E24\u90E8\u5206\u90FD\u8981\u6709\uFF1Abe \u52A8\u8BCD\u4E0D\u80FD\u7701\u7565\uFF0C\u52A8\u8BCD\u8981\u52A0 -ing\u3002","\u62FC\u6CD5\uFF1A\u5B57\u5C3E e \u53BB\u6389\u518D\u52A0 -ing\uFF1B\u77ED\u52A8\u8BCD\u5B57\u5C3E\u662F\u300C\u4E00\u4E2A\u5143\u97F3 + \u4E00\u4E2A\u8F85\u97F3\u300D\uFF0C\u53CC\u5199\u6700\u540E\u7684\u8F85\u97F3\u518D\u52A0 -ing\u3002","\u6BCF\u5929\u7684\u4E60\u60EF\u7528\u73B0\u5728\u5F0F\uFF0C\u4E0D\u7528\u73B0\u5728\u8FDB\u884C\u5F0F\u3002"],rule:"Use am, is or are + verb-ing for something happening now.",examples:["I am reading a book now.","Look! The baby is sleeping.","She is making a cake.","The children are running in the park.","Listen! He is singing."],bad:"She working now.",good:"She is working now.",mistakes:[{bad:"She working now.",good:"She is working now."},{bad:"I am work now.",good:"I am working now."},{bad:"He is going to work every day.",good:"He goes to work every day."}]},cancant:{objective:"Learn to say what you can and can't do.",title:"Can / Can't",ruleLines:["can + base verb: I can swim. She can drive. (no -s, no to, no -ing)","can't = cannot: He can't come today.","can never changes: I can, she can, they can. Don't add is: She can swim.","Questions: Can you swim? - Yes, I can. / No, I can't."],ruleCn:["can \u540E\u9762\u63A5\u539F\u5F62\u52A8\u8BCD\uFF1A\u4E0D\u52A0 -s\u3001\u4E0D\u52A0 to\u3001\u4E0D\u52A0 -ing\u3002","can't \u662F cannot \u7684\u7F29\u5199\uFF0C\u8868\u793A\u300C\u4E0D\u4F1A\uFF0F\u4E0D\u80FD\u300D\u3002","can \u672C\u8EAB\u4E0D\u53D8\uFF08\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\u4E5F\u4E0D\u52A0 -s\uFF09\uFF0C\u524D\u9762\u4E5F\u4E0D\u52A0 be \u52A8\u8BCD\uFF08\u4E0D\u8BF4 She is can swim\uFF09\u3002","\u95EE\u53E5\u628A can \u653E\u53E5\u9996\uFF1B\u7B80\u7B54\u7528 can / can't\u3002"],rule:"Use can or can't + the base verb to say what someone is able to do.",examples:["I can swim.","She can speak three languages.","He can't come today.","Can you help me? - Yes, I can.","Can your brother cook? - No, he can't."],bad:"She can drives.",good:"She can drive.",mistakes:[{bad:"She can drives.",good:"She can drive."},{bad:"I can to help.",good:"I can help."},{bad:"She is can swim.",good:"She can swim."}]},pastbe:{objective:"Learn to talk about the past with was and were.",title:"Past Simple: was / were",ruleLines:["was and were are the past of am, is and are.","I / he / she / it + was: I was tired. It was hot.","you / we / they + were: They were late. You were right.","With yesterday, last night, last week, use the past - and don't leave out was / were: I was at home yesterday."],ruleCn:["was / were \u662F be \u52A8\u8BCD\u7684\u8FC7\u53BB\u5F0F\u3002","I\u3001he\u3001she\u3001it\uFF08\u5355\u6570\uFF09\u7528 was\u3002","you\u3001we\u3001they \u7528 were\uFF08you \u5C31\u7B97\u53EA\u6709\u4E00\u4E2A\u4EBA\u4E5F\u7528 were\uFF09\u3002","\u6709 yesterday\u3001last night\u3001last week \u7B49\u8FC7\u53BB\u7684\u65F6\u95F4\uFF0C\u5C31\u8981\u7528\u8FC7\u53BB\u5F0F\uFF1Bbe \u52A8\u8BCD\u4E5F\u4E0D\u80FD\u7701\u7565\uFF08\u4E0D\u8BF4 I at home yesterday\uFF09\u3002"],rule:"Use was with I, he, she and it, and were with you, we and they.",examples:["I was at home yesterday.","It was very hot last week.","They were late this morning.","We were at the party last night.","I was tired yesterday, but today I am fine."],bad:"They was happy.",good:"They were happy.",mistakes:[{bad:"They was happy.",good:"They were happy."},{bad:"I at home yesterday.",good:"I was at home yesterday."},{bad:"She is sick last week.",good:"She was sick last week."}]},pastregular:{objective:"Learn to talk about finished actions in the past by adding -ed, and to use did.",title:"Past Simple: -ed Verbs",ruleLines:["For a finished action in the past, add -ed: work - worked. (yesterday, last week, an hour ago)","Spelling: like - liked, study - studied, stop - stopped.","The same for every subject: I worked, she worked, they worked. (no -s)","Negatives and questions use did + base verb: I didn't work. Did you work?"],ruleCn:["\u8FC7\u53BB\u5F0F\uFF1A\u5DF2\u7ECF\u505A\u5B8C\u7684\u4E8B\uFF0C\u89C4\u5219\u52A8\u8BCD\u52A0 -ed\uFF08\u5E38\u8DDF yesterday\u3001last week\u3001an hour ago \u4E00\u8D77\u7528\uFF09\u3002","\u62FC\u6CD5\uFF1A\u5B57\u5C3E e \u53EA\u52A0 -d\uFF1B\u8F85\u97F3 + y \u628A y \u53D8 i \u52A0 -ed\uFF1B\u77ED\u52A8\u8BCD\u5B57\u5C3E\u662F\u300C\u4E00\u4E2A\u5143\u97F3 + \u4E00\u4E2A\u8F85\u97F3\u300D\uFF0C\u53CC\u5199\u6700\u540E\u7684\u8F85\u97F3\u518D\u52A0 -ed\u3002","\u8FC7\u53BB\u5F0F\u4E0D\u5206\u4EBA\u79F0\uFF1A\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\u4E5F\u4E0D\u52A0 -s\u3002","\u5426\u5B9A\u53E5\u548C\u95EE\u53E5\u7528 did / didn't + \u539F\u5F62\u52A8\u8BCD\uFF08\u4E0D\u8BF4 didn't worked\uFF09\u3002"],rule:"Add -ed to most verbs for a finished action in the past. After did and didn't, use the base verb.",examples:["I worked late yesterday.","She called me last night.","We visited our grandmother last Sunday.","He studied English last year.","I didn't watch TV yesterday.","Did you finish your homework?"],bad:"I work yesterday.",good:"I worked yesterday.",mistakes:[{bad:"I work yesterday.",good:"I worked yesterday."},{bad:"He didn't worked yesterday.",good:"He didn't work yesterday."},{bad:"Did she visited you?",good:"Did she visit you?"}]},questionwords:{objective:"Learn to ask questions with what, where, when, who, why and how.",title:"Question Words",ruleLines:["what = a thing, where = a place, when = a time, who = a person, why = a reason, how = the way (how old = age).","Put the question word first: Where do you live? (not You live where?)","With am / is / are, put it after the question word: Where is the office? (not Where the office is?)","With other verbs, add do / does: When do you start? Where does she live?"],ruleCn:["\u7591\u95EE\u8BCD\uFF1Awhat \u4EC0\u4E48\u3001where \u54EA\u91CC\u3001when \u4EC0\u4E48\u65F6\u5019\u3001who \u8C01\u3001why \u4E3A\u4EC0\u4E48\u3001how \u600E\u6837\uFF08how old \u51E0\u5C81\uFF09\u3002","\u7591\u95EE\u8BCD\u653E\u53E5\u9996\uFF1A\u4E2D\u6587\u300C\u4F60\u4F4F\u54EA\u91CC\u300D\u7684\u300C\u54EA\u91CC\u300D\u5728\u53E5\u5C3E\uFF0C\u82F1\u6587\u8981\u642C\u5230\u6700\u524D\u9762\u3002","\u6709 be \u52A8\u8BCD\u65F6\uFF0Cbe \u52A8\u8BCD\u653E\u5728\u7591\u95EE\u8BCD\u540E\u9762\u3001\u4E3B\u8BED\u524D\u9762\u3002","\u4E00\u822C\u52A8\u8BCD\u8981\u52A0 do / does\uFF08\u7B2C\u4E09\u4EBA\u79F0\u5355\u6570\u7528 does\uFF0C\u540E\u9762\u63A5\u539F\u5F62\u52A8\u8BCD\uFF09\u3002"],rule:"Put the question word first, then am / is / are or do / does, then the subject.",examples:["What is your name?","Where do you live?","When is your birthday?","Who is your teacher?","Why are you tired?","How old are you?"],bad:"Where the office is?",good:"Where is the office?",mistakes:[{bad:"You live where?",good:"Where do you live?"},{bad:"Where the office is?",good:"Where is the office?"},{bad:"Where she lives?",good:"Where does she live?"}]},prepplace:{objective:"Learn to say where things are with in, on and under \u2014 and match is / are.",title:"Prepositions: in / on / under",ruleLines:['Use "in" for inside something.','Use "on" for a surface.','Use "under" for below something.',"One thing \u2192 is. More than one \u2192 are."],ruleCn:["in\uFF1A\u5728\u2026\u2026\u91CC\u9762\u3002","on\uFF1A\u5728\u2026\u2026\u4E0A\u9762\uFF08\u8868\u9762\uFF09\u3002","under\uFF1A\u5728\u2026\u2026\u4E0B\u9762\u3002","\u5355\u6570\u7528 is\uFF0C\u590D\u6570\u7528 are\u3002"],rule:"Use in, on and under to say where something is. Use is for one thing and are for more than one.",examples:["The cat is in the box.","The cat is on the box.","The cat is under the table.","The oranges are in the box.","The strawberries are under the table."],bad:"The pen is in the desk.",good:"The pen is on the desk.",mistakes:[{bad:"The pen is in the desk.",good:"The pen is on the desk."},{bad:"The books is on the table.",good:"The books are on the table."}]},generic:{title:"Lesson explanation",rule:"Placeholder rule \u2014 your real grammar explanation for this lesson goes here.",examples:["Example sentence one.","Example sentence two."],bad:"common mistake example",good:"corrected example"}},Jh={Type:Vo,Hash:No,Layers:Oo,Users:Yo,BookOpen:qa,MessageSquare:zo,Quote:Uo},
