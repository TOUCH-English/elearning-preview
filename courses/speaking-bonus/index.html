<style>
:root{
  --canvas: var(--te-canvas, #F5F7FA); --surface: var(--te-surface, #FFFFFF);
  --ink: var(--te-ink, #1B2433); --muted: var(--te-muted, #5C6675); --subtle: var(--te-subtle, #98A2B3);
  --line: var(--te-line, #DCE3EC); --brand: var(--te-brand, #1F3A5F); --brand-d: var(--te-brand-d, #19314F);
  --brand-2: var(--te-brand-2, #2E5685); --brand-soft: var(--te-brand-soft, #E6ECF4);
  --success: var(--te-success, #4FAE8A); --success-soft: var(--te-success-soft, #E6F4EE);
  --bad: var(--te-bad, #C0405C); --bad-soft: var(--te-bad-soft, #F6E4E8);
  --gold: var(--te-gold, #D9B56B); --gold-deep: var(--te-gold-deep, #BE9648); --gold-soft: var(--te-gold-soft, #F8EFDB);
  --hairline: var(--te-hairline, rgba(31,58,95,.08)); --radius: var(--te-radius, 18px);
  --sh-sm: var(--te-sh-sm, 0 1px 2px rgba(27,36,51,.05),0 3px 8px rgba(27,36,51,.07));
  --sh-md: var(--te-sh-md, 0 1px 2px rgba(27,36,51,.05),0 8px 22px rgba(27,36,51,.10));
  --font-h: var(--te-font-display, 'Fredoka','Nunito',sans-serif);
  --font-b: var(--te-font-body, 'Nunito',-apple-system,'Segoe UI',sans-serif);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font-b);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:clamp(16px,4vw,32px) clamp(14px,4vw,24px) 64px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{font-family:var(--font-h);font-weight:700;color:var(--brand);font-size:15px;letter-spacing:.02em}
.chips{margin-left:auto;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-h);font-weight:600;font-size:12.5px;
  padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--brand-2)}
.chip b{color:var(--brand);font-weight:700}
.ltog{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.ltog button{border:0;background:transparent;cursor:pointer;font-family:var(--font-h);font-weight:600;
  font-size:11px;color:var(--muted);padding:5px 8px;border-radius:7px}
.ltog button.on{background:var(--brand);color:#fff}
@media (max-width:380px){ .chips{gap:6px} .ltog button{padding:5px 6px;font-size:10.5px} }

/* ---------- home ---------- */
h1{font-family:var(--font-h);font-weight:700;color:var(--brand);font-size:clamp(26px,5.5vw,36px);line-height:1.15}
.sub{margin-top:8px;color:var(--muted);font-size:15px;font-weight:600;line-height:1.5}
.bar{height:9px;border-radius:99px;background:var(--brand-soft);overflow:hidden;margin:18px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-2),var(--brand));border-radius:99px;transition:width .3s ease}
.barnote{font-size:13px;color:var(--muted);font-weight:700}

.days{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));margin-top:24px}
.day{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:13px 14px;cursor:pointer;font:inherit;color:inherit;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.day:hover,.day:focus-visible{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--brand-soft);outline:none}
.day .n{font-family:var(--font-h);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--subtle)}
.day .t{margin-top:5px;font-size:13.5px;line-height:1.4;font-weight:700;color:var(--brand)}
.day.done{border-color:var(--success);background:var(--success-soft)}
.day.done .n::after{content:" ✓";color:var(--success);font-weight:800}
.day.rev{background:var(--gold-soft);border-color:rgba(191,150,72,.35)}
.day.rev .n{color:var(--gold-deep)}
.day.rev.done{background:var(--success-soft);border-color:var(--success)}

/* ---------- day view ---------- */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font:inherit;font-weight:700;
  color:var(--brand-2);cursor:pointer;padding:6px 0;margin-bottom:10px;font-size:14px}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh-md);background:var(--brand-dd,#142640);margin:14px 0}
.video iframe{width:100%;height:100%;border:0;display:block}
.note{text-align:center;font-size:12.5px;color:var(--subtle);margin-top:10px;font-weight:700}
.note a{color:var(--brand-2);text-decoration:none;border-bottom:1px solid transparent}
.note a:hover{border-bottom-color:currentColor}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:var(--sh-sm);margin-top:14px}
.lbl{font-family:var(--font-h);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.h2{font-family:var(--font-h);font-weight:600;font-size:19px;color:var(--brand);margin-top:5px;line-height:1.25}
.hint{margin-top:5px;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.5}

.pat{background:var(--brand-soft);border:1px solid var(--hairline);border-radius:12px;padding:13px 15px;margin-top:12px}
.pat .tp{font-family:var(--font-h);font-weight:600;font-size:16px;color:var(--brand)}
.pat .tp b{color:var(--gold-deep)}
.pat .nt{margin-top:4px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.5}
.pat .ex{margin-top:8px;font-size:14.5px;color:var(--ink);font-weight:700;line-height:1.55}
.pat .ex span{display:block;padding-left:16px;position:relative}
.pat .ex span::before{content:"›";position:absolute;left:0;color:var(--brand-2);font-weight:800}
.wl{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.wl span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:700}

/* build / bank chips */
.zone{min-height:56px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;
  background:var(--canvas);border:2px dashed var(--line);border-radius:12px;padding:11px;margin-top:14px}
.zone:empty::before{content:attr(data-ph);color:var(--subtle);font-size:13.5px;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chipw{font:inherit;font-weight:700;font-size:14.5px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .1s ease,border-color .12s ease}
.chipw:hover{border-color:var(--brand-2)}
.chipw:active{transform:scale(.96)}
.chipw.used{opacity:.32;pointer-events:none}
.zone .chipw{background:var(--brand-soft);border-color:var(--hairline)}

.fb{margin-top:12px;border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700;line-height:1.5}
.fb.ok{background:var(--success-soft);color:var(--success)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{display:block;margin-top:5px;color:var(--ink);font-weight:800}

.btn{font:inherit;font-family:var(--font-h);font-weight:600;font-size:15.5px;border:0;border-radius:13px;
  padding:13px 18px;cursor:pointer;width:100%;margin-top:14px;transition:filter .14s ease,transform .1s ease}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;cursor:default}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover:not([disabled]){filter:brightness(1.1)}
.btn-g{background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.btn-row{display:flex;gap:9px}
.btn-row .btn{margin-top:0}

/* speak */
.model{background:var(--gold-soft);border:1px solid rgba(191,150,72,.3);border-radius:12px;
  padding:14px 16px;margin-top:14px;font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.5}
.stat{text-align:center;font-family:var(--font-h);font-weight:600;font-size:16px;color:var(--muted);
  margin-top:14px;min-height:24px}
.stat.go{color:var(--success)}
.mini{text-align:center;font-size:12.5px;color:var(--subtle);font-weight:700;margin-top:8px;line-height:1.5}

.ask{margin-bottom:16px}
.ask label{display:block;font-family:var(--font-h);font-weight:600;font-size:15px;color:var(--brand);margin-bottom:6px}
.ask label span{display:block;font-family:var(--font-b);font-weight:700;font-size:12.5px;color:var(--subtle);margin-top:2px}
.ask input{width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--canvas);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.ask input:focus{outline:none;border-color:var(--brand-2);background:var(--surface)}
.hi{color:var(--gold-deep)}
.link{background:none;border:0;font:inherit;font-weight:800;font-size:13px;color:var(--brand-2);
  cursor:pointer;padding:0;margin-left:10px;text-decoration:underline}
.mine{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle}
.done-box{text-align:center;padding:28px 18px}
.done-box .big{font-size:44px}
.done-box h2{font-family:var(--font-h);font-weight:700;color:var(--brand);font-size:24px;margin-top:10px}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* 学生资料：共用层优先，没有共用层就用这个课程自己存的 */
function readProfile() {
  if (SP) {
    const p = SP.get();
    return (p.name || p.place || p.job || p.goal) ? p : null;
  }
  return store.get("profile", null);
}

let S = {
  done:     store.get("done", {}),      // { "1": true }  哪几天完成了
  recorded: store.get("recorded", {}),  // { "1:3": true } 哪几个录音做过

                                 profile: SP ? null : S.profile, asked: S.asked });

/* =============================================================================
   把示范句换成学生自己的资料
   -----------------------------------------------------------------------------
   影片教的就是「用固定模板，换掉後面的资料」，所以练习本身也应该是关于他自己的。
   开始前问四个问题（名字／地方／工作／目标），之後 DAY 1、2、7、19、20 的示范句
   会自动换成他的答案 —— 那几天正好是自我介绍与目标，印象最深的地方。

   ⚠️ 一定要「长的先换」：DAY 7 有「I am from Penang, Malaysia.」，
      如果先换掉 Penang 再换 Malaysia，会变成「Johor, Johor」。
============================================================================= */
function jobPhrase(raw) {
  const j = String(raw || "").trim().replace(/^(an?)\s+/i, "");
  if (!j) return "";
  return (/^[aeiou]/i.test(j) ? "an " : "a ") + j;
}

function replacements() {
  const p = S.profile;
  if (!p) return [];
  const r = [];
  if (p.place) {                                   // 长的先，短的後
    r.push([/\bPenang,\s*Malaysia\b/gi, p.place], [/\bYong Peng,\s*Malaysia\b/gi, p.place],
           [/\bPenang\b/gi, p.place], [/\bMalaysia\b/gi, p.place]);
  }
  if (p.job) {
    const j = jobPhrase(p.job);
    r.push([/\ban admin executive\b/gi, j], [/\ban admin assistant\b/gi, j],
           [/\ba teacher\b/gi, j], [/\ba doctor\b/gi, j]);
  }
  if (p.name) r.push([/\bWesley\b/g, p.name], [/\bSarah\b/g, p.name]);
  return r;
}

/* 把一段文字换成学生的资料。没填资料就原样回传。 */
function me(text) {
  if (!text) return text;
  let out = String(text);
  for (const [re, val] of replacements()) out = out.replace(re, val);
  return out;
}
const isMine = (text) => S.profile && me(text) !== text;

/* slot 名称 → 学生资料的哪个栏位 */
const SLOT_FIELD = { "name": "name", "place": "place", "place?": "place",
                     "job": "job", "goal": "goal", "future goal": "goal" };

const $  = (id) => document.getElementById(id);
const app = () => $("app");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => String(s).toLowerCase().replace(/[.,!?;:'"]/g, "").replace(/\s+/g, " ").trim();
const addXP = (n) => { S.xp += n; save(); const c = $("xp"); if (c) c.textContent = S.xp; };

/* ---------- 顶栏 ---------- */
function topBar() {

    </span>

}

/* ---------- 开始前：问四个问题 ---------- */
/* 问题本身用学生的解释语言；例子留英文 —— 他要填的就是英文的答案 */
const ASK = [
  { k: "name",  t: "qName",  ph: "e.g. Marco" },
  { k: "place", t: "qPlace", ph: "e.g. Penang" },

];

function renderAsk(isEdit) {
  const p = S.profile || {};
  redraw = () => renderAsk(isEdit);
  app().innerHTML = `${topBar()}
    <h1>${esc(L_(isEdit ? "askTitleEdit" : "askTitleNew"))}</h1>
    <p class="sub">${L_(isEdit ? "askSubEdit" : "askSubNew")}</p>
    <div class="card">
      ${ASK.map((a) => `<div class="ask">
        <label for="f_${a.k}">${esc(L_(a.t))}</label>
        <input id="f_${a.k}" type="text" autocomplete="off" placeholder="${esc(a.ph)}" value="${esc(p[a.k] || "")}">
      </div>`).join("")}
      <button class="btn btn-p" id="okb">${isEdit ? "Save" : "Start"}</button>
      <button class="btn btn-g" id="skipb">${isEdit ? "Cancel" : esc(L_("skipLater"))}</button>
    </div>`;

  $("okb").onclick = () => {
    const p2 = {};
    ASK.forEach((a) => { const v = $("f_" + a.k).value.trim(); if (v) p2[a.k] = v; });
    if (SP) { SP.set(p2); SP.markAsked(); }

    S.asked = true; save(); renderHome();
  };
  $("skipb").onclick = () => { if (SP) SP.markAsked(); S.asked = true; save(); renderHome(); };
  window.scrollTo(0, 0);
}

/* ---------- 首页 ---------- */
function renderHome() {
  rec.stopAll();
  redraw = renderHome;
  if (!S.asked) return renderAsk(false);
  const n = Object.keys(S.done).length;
  const pct = DAYS.length ? Math.round((n / DAYS.length) * 100) : 0;
  app().innerHTML = `${topBar()}
    <h1>Speaking Bonus${S.profile && S.profile.name ? `<span class="hi">, ${esc(S.profile.name)}</span>` : ""}</h1>
    <p class="sub">${esc(L_("homeSub"))}</p>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="barnote">${n} of ${DAYS.length} days complete · ${pct}%
      <button class="link" id="edit">${esc(L_(S.profile ? "myInfo" : "addInfo"))}</button></div>
    <div class="days" id="days"></div>`;

  $("days").innerHTML = DAYS.map((d) => {
    const cls = ["day", S.done[d.day] ? "done" : "", d.review ? "rev" : ""].filter(Boolean).join(" ");
    return `<button class="${cls}" data-d="${d.day}">
      <span class="n">${d.review ? "Review · " : ""}Day ${d.day}</span>
      <span class="t">${esc(d.title)}</span>

  window.scrollTo(0, 0);
}

/* 换语言时要把「现在这一屏」重画一次 —— 每个进入点自己登记怎么重画 */
let redraw = () => renderHome();

/* ---------- 单日 ---------- */
let D = null, idx = 0;

function openDay(dayNo) {
  D = DAYS.find((x) => x.day === dayNo);
  if (!D) return renderHome();
  idx = 0;
  renderDay();
}

function dayShell(inner) {
  return `${topBar()}
    <button class="back" id="back">‹ All days</button>
    <span class="lbl">${D.review ? "Review · " : ""}Day ${D.day}${D.tagline ? " · " + esc(D.tagline) : ""}</span>
    <h1 style="font-size:clamp(22px,4.6vw,29px);margin-top:4px">${esc(D.title)}</h1>
    ${inner}`;
}

function renderDay() {
  rec.stopAll();
  /* 第一屏：影片 */
  if (idx === 0) {
    const v = D.video;
    app().innerHTML = dayShell(`
      ${v ? `<div class="video"><iframe src="https://www.youtube.com/embed/${esc(v)}"
              title="${esc(D.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen></iframe></div>
             <p class="note">Video not loading? <a href="https://www.youtube.com/watch?v=${esc(v)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a></p>`
            : `<div class="card"><p class="hint">${esc(L_("noVideo"))}</p></div>`}
      ${D.covers && D.covers.length ? `<div class="card">
        <span class="lbl">In this video</span>
        <div class="wl">${D.covers.slice(0, 8).map((c) => `<span>${esc(c)}</span>`).join("")}</div></div>` : ""}
      <button class="btn btn-p" id="go">Start practising →</button>`);
    $("back").onclick = renderHome;
    $("go").onclick = () => { idx = 1; renderDay(); };
    window.scrollTo(0, 0);
    return;
  }

  redraw = renderDay;
  const steps = D.steps || [];
  const si = idx - 1;

  /* 最後一屏：完整目标句录音 + 完成 */
  if (si >= steps.length) return renderFinal();

  const st = steps[si];
  const pos = `Step ${si + 1} / ${steps.length + (D.finalSpeak ? 1 : 0)}`;
  const box = document.createElement("div");

  if (st.k === "patterns")  renderPatterns(box, st, pos);
  else if (st.k === "order") renderOrder(box, st, pos);
  else if (st.k === "subst") renderSubst(box, st, pos);
  else if (st.k === "speak") renderSpeak(box, st.model, pos, `${D.day}:${si}`, st.head);
  else { idx++; return renderDay(); }

  app().innerHTML = dayShell("");
  app().appendChild(box);
  $("back").onclick = renderHome;
  window.scrollTo(0, 0);
}

const next = () => { idx++; renderDay(); };

/* 看：句型卡 */
function renderPatterns(box, st, pos) {
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSee"))}</span>
    <div class="h2">Sentence pattern</div>
    <p class="hint">${esc(L_("patHint"))}${isMine(st.examples ? st.examples.join(" ") : "") ? `<span class="mine">${esc(L_("tagMine"))}</span>` : ""}</p>
    <div class="pat">
      <div class="tp">${esc(st.head).replace(/\+/g, "<b>+</b>")}</div>
      ${st.desc ? `<div class="nt">${esc(st.desc)}</div>` : ""}
      ${st.examples && st.examples.length ? `<div class="ex">${st.examples.map((e) => `<span>${esc(me(e))}</span>`).join("")}</div>` : ""}
      ${st.words && st.words.length ? `<div class="wl">${st.words.map((w) => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
    </div>
    <button class="btn btn-p" id="go">Continue</button></div>`;
  setTimeout(() => { $("go").onclick = () => { addXP(2); next(); }; }, 0);
}

/* 拼：拆句重组 —— 记忆点在这里 */
function renderOrder(box, st, pos) {
  /* 换成他自己的句子；但换完太长的话（例如工作名称很长）就退回原句，
     不然字块会多到不好玩。 */
  let answer = st.words, display = st.display || st.words.join(" ");
  const mineTxt = me(display);
  if (mineTxt !== display) {
    const w = mineTxt.replace(/[.,!?;:]/g, "").split(" ").filter(Boolean);
    if (w.length <= 10) { answer = w; display = mineTxt; }
  }
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stBuild"))}</span>
    <div class="h2">Build the sentence</div>
    <p class="hint">${esc(L_("ordHint"))}</p>
    <div class="zone" id="zone" data-ph="${esc(L_("ordPh"))}"></div>
    <div class="bank" id="bank">${shuffle(answer).map((w, i) =>
      `<button class="chipw" data-i="${i}" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <div id="fb"></div>
    <button class="btn btn-p" id="go" disabled>Check</button></div>`;

  setTimeout(() => {
    const placed = [];
    const zone = $("zone"), bank = $("bank"), go = $("go");
    let locked = false;          // 按过 Check 之後就锁住，不然学生再动字块会把 Continue 变回 disabled 卡死

    const sync = () => {
      zone.innerHTML = placed.map((p, i) => `<button class="chipw" data-p="${i}">${esc(p.v)}</button>`).join("");
      if (!locked) {
        zone.querySelectorAll("[data-p]").forEach((b) => {
          b.onclick = () => { const p = placed.splice(parseInt(b.dataset.p, 10), 1)[0];
            bank.querySelector(`[data-i="${p.i}"]`).classList.remove("used"); sync(); };
        });
        go.disabled = placed.length !== answer.length;
      }
    };

    bank.querySelectorAll(".chipw").forEach((b) => {
      /* 也要在处理函式里挡掉 —— CSS 的 pointer-events 挡不住程式点击，
         触控装置上连点两下也可能重复触发。 */
      b.onclick = () => {
        if (locked || b.classList.contains("used")) return;
        b.classList.add("used"); placed.push({ i: b.dataset.i, v: b.dataset.v }); sync();
      };
    });

    go.onclick = () => {
      const got = placed.map((p) => p.v).join(" ");
      const ok = norm(got) === norm(answer.join(" "));
      locked = true;
      sync();                      // 重画一次，把区块里字块的 onclick 拿掉
      $("fb").innerHTML = ok
        ? `<div class="fb ok">${esc(L_("ordOK"))}</div>`
        : `<div class="fb no">${esc(L_("ordNo"))}<span class="ans">${esc(display)}</span></div>`;
      if (ok) addXP(5);
      go.disabled = false; go.textContent = "Continue"; go.onclick = next;
    };
    sync();
  }, 0);
}

/* 换：替换练习 —— 同一个模板，换成自己的资料 */
function renderSubst(box, st, pos) {
  /* 如果这个 slot 正好是开始前问过的（名字／地方／工作／目标），
     就把他自己的答案放在第一个 —— 练的是关于自己的句子。 */
  const field = SLOT_FIELD[String(st.slot || "").toLowerCase()];
  const own = field && S.profile && S.profile[field]
              ? (field === "job" ? jobPhrase(S.profile[field]) : S.profile[field]) : "";
  const bank = own ? [own, ...st.bank.filter((b) => b.toLowerCase() !== own.toLowerCase())] : null;
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSwap"))}</span>
    <div class="h2">Make it yours</div>
    <p class="hint">${esc(L_("subHint"))}${own ? `<span class="mine">${esc(L_("tagFirst"))}</span>` : ""}</p>
    <div class="pat"><div class="tp" id="tpl">${esc(st.tpl).replace(/___/g, "<b>___</b>")}</div></div>
    <div class="bank" id="bank">${(bank || shuffle(st.bank)).map((w) =>
      `<button class="chipw" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <button class="btn btn-p" id="go" disabled>Continue</button></div>`;

  setTimeout(() => {
    let picked = false;
    $("bank").querySelectorAll(".chipw").forEach((b) => {
      b.onclick = () => {
        $("tpl").innerHTML = esc(st.tpl).replace(/___/g, `<b>${esc(b.dataset.v)}</b>`);
        if (!picked) { picked = true; addXP(3); $("go").disabled = false; }
      };
    });
    $("go").onclick = next;
  }, 0);
}

/* 说：录音 */
function renderSpeak(box, model, pos, key, head, opts) {
  const can = rec.available;
  const mine = isMine(model);
  model = me(model);
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSay"))}</span>
    <div class="h2">Now say it</div>
    ${head ? `<p class="hint">${esc(head)}</p>` : ""}
    <div class="model">${esc(model)}${mine ? `<span class="mine">${esc(L_("tagYours"))}</span>` : ""}</div>
    ${can ? `
      <div class="stat" id="stat"></div>
      <div class="btn-row">
        <button class="btn btn-p" id="recb">● Record</button>
        <button class="btn btn-p hidden" id="stopb">■ Stop</button>
        <button class="btn btn-g" id="playb" disabled>▶ Play back</button>
      </div>
      <p class="mini" id="mini">${esc(L_("micNote"))}</p>`
    : `<p class="mini">${esc(L_("noRec"))}</p>`}
    <button class="btn ${opts && opts.goClass ? opts.goClass : "btn-g"}" id="go">${esc((opts && opts.goText) || "Continue")}</button></div>`;

  setTimeout(() => {
    $("go").onclick = (opts && opts.onGo) || next;
    if (!can) return;

    const stat = $("stat"), recb = $("recb"), stopb = $("stopb"), playb = $("playb");
    let blob = null, session = null;

    const idle = () => {
      recb.classList.remove("hidden"); stopb.classList.add("hidden"); stopb.disabled = false;
      recb.textContent = blob ? "↻ Record again" : "● Record";
      playb.disabled = !blob; stat.textContent = ""; stat.classList.remove("go");
    };

    rec.load(key).then((b) => { if (b && !blob) { blob = b; $("mini").textContent = L_("hadRec"); idle(); } });

    recb.onclick = () => {
      recb.classList.add("hidden"); playb.disabled = true;
      session = rec.capture({
        saveAs: key,
        onCountdown: (n) => { stat.classList.remove("go"); stat.textContent = "Get ready… " + n; },
        onSpeakNow: () => { stat.classList.add("go"); stat.textContent = "🟢 Speak now"; stopb.classList.remove("hidden"); },
        onSaving:   () => { stat.classList.remove("go"); stat.textContent = "Saving…"; stopb.disabled = true; },
        onDone: (b) => {
          blob = b;
          if (!S.recorded[key]) { S.recorded[key] = true; addXP(5); }
          save();
          $("mini").textContent = L_("gotRec");
          idle();
        },
        onDenied: () => { stat.textContent = ""; $("mini").textContent = L_("noMic"); idle(); }
      });
    };
    stopb.onclick = () => { if (session) session.stop(); };
    playb.onclick = () => { if (blob) rec.play(blob); };
    idle();
  }, 0);
}

/* ---------- 最後：完整目标句 + 完成 ---------- */
function renderFinal() {
  if (D.finalSpeak && !S.done[D.day]) {
    const box = document.createElement("div");
    /* 「Finish this day」一定要透过 opts 交给 renderSpeak 自己接。
       renderSpeak 是在 setTimeout(…, 0) 里接 #go 的 —— 从外面先设
       go.onclick，会被那个 setTimeout 盖成 next()，按下去等於按 Continue，
       画面原地重画一次，看起来就像「按了没反应」。 */
    renderSpeak(box, D.finalSpeak, "Final", `${D.day}:final`, L_("finalHint"), {
      goText : "Finish this day ✓",
      goClass: "btn-p",
      onGo   : () => { S.done[D.day] = true; addXP(10); save(); renderDone(); }
    });
    app().innerHTML = dayShell("");
    app().appendChild(box);
    $("back").onclick = renderHome;
    window.scrollTo(0, 0);
    return;
  }
  S.done[D.day] = true; save();
  renderDone();
}

function renderDone() {
  const nextDay = DAYS.find((x) => x.day > D.day);
  app().innerHTML = dayShell(`<div class="card done-box">
      <div class="big">🎉</div>
      <h2>Day ${D.day} complete</h2>
      <p class="hint">${esc(me(D.outcome) || L_("doneMsg"))}</p>
      ${nextDay ? `<button class="btn btn-p" id="nx">Next: Day ${nextDay.day} →</button>` : ""}
      <button class="btn btn-g" id="home">All days</button>
    </div>`);
  $("back").onclick = renderHome;
  $("home").onclick = renderHome;
  if (nextDay) $("nx").onclick = () => openDay(nextDay.day);
  window.scrollTo(0, 0);
}

/* ---------- 语言切换 ----------
   topBar() 每次 render 都重新产生，所以不逐个接 onclick，改用事件委派接在
   document 上一次就好。 */
if (SP) {
  document.addEventListener("click", (e) => {
    const b = e.target.closest ? e.target.closest("[data-lang]") : null;
    if (!b) return;
    if (SP.setLang(b.dataset.lang)) redraw();
  });
}

/* ---------- go ---------- */
renderHome();
</script>
