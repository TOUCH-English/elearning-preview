<style>
:root{
  --canvas: var(--te-canvas, #F5F7FA); --surface: var(--te-surface, #FFFFFF);
  --ink: var(--te-ink, #16202E); --muted: var(--te-muted, #5C6675); --subtle: var(--te-subtle, #98A2B3);
  --line: var(--te-line, #DCE3EC); --brand: var(--te-brand, #15357B); --brand-d: var(--te-brand-d, #112C68);
  --brand-2: var(--te-brand-2, #2A5BD7); --brand-soft: var(--te-brand-soft, #EAF0FB);
  --success: var(--te-success, #4FAE8A); --success-soft: var(--te-success-soft, #E6F4EE);
  --bad: var(--te-bad, #C0405C); --bad-soft: var(--te-bad-soft, #F6E4E8);
  --gold: var(--te-gold, #D9B56B); --gold-deep: var(--te-gold-deep, #BE9648); --gold-soft: var(--te-gold-soft, #F8EFDB);
  --hairline: var(--te-hairline, rgba(21,53,123,.08)); --radius: var(--te-radius, 18px);
  --sh-sm: var(--te-sh-sm, 0 1px 2px rgba(27,36,51,.05),0 3px 8px rgba(27,36,51,.07));
  --sh-md: var(--te-sh-md, 0 1px 2px rgba(27,36,51,.05),0 8px 22px rgba(27,36,51,.10));
  --font-h: var(--te-font-display, 'Fredoka','Nunito',sans-serif);
  --font-b: var(--te-font-body, 'Nunito',-apple-system,'Segoe UI',sans-serif);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--canvas);color:var(--ink);font-family:var(--font-b);min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:clamp(16px,4vw,32px) clamp(14px,4vw,24px) 64px}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{height:34px;width:auto;display:block}   /* 平台的字样 logo（原本是文字 TOUCH English） */
.chips{margin-left:auto;display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-h);font-weight:600;font-size:12.5px;
  padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--brand-2)}
.chip b{color:var(--brand);font-weight:700}
.ltog{display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:2px}
.ltog button{border:0;background:transparent;cursor:pointer;font-family:var(--font-h);font-weight:600;
  font-size:11px;color:var(--muted);padding:5px 8px;border-radius:7px}
.ltog button.on{background:var(--brand);color:#fff}
/* 390px 的手机上「中文」会被挤成两行、「✓ 3 /30」也会断开 */
.chip,.ltog button{white-space:nowrap}
@media (max-width:380px){ .chips{gap:6px} .ltog button{padding:5px 6px;font-size:10.5px} }
/* 不换行之後，XP 到三、四位数、完成数 30/30 时顶栏会比 390px 宽 —— 窄萤幕上整排收小一点 */
@media (max-width:430px){ .top{gap:8px} .logo{height:28px} .chips{gap:5px}
  .chip{padding:5px 8px;font-size:12px;gap:3px} .ltog button{padding:5px 6px} }

/* ---------- home ---------- */
/* 首页的版面（进度卡、继续卡、路线图）由 shared/course-home.js 画，这里只剩问题页用的标题 */
h1{font-family:var(--font-h);font-weight:700;color:var(--brand);font-size:clamp(26px,5.5vw,36px);line-height:1.15}
.sub{margin-top:8px;color:var(--muted);font-size:15px;font-weight:600;line-height:1.5}
/* 路线图上方那一行：怎么练 + 「我的资料」 */
.sb-info{margin-top:14px;font-size:13px;color:var(--muted);font-weight:700;line-height:1.5}
.sb-info .link{margin-left:6px}

/* ---------- day view ---------- */
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;font:inherit;font-weight:700;
  color:var(--brand-2);cursor:pointer;padding:6px 0;margin-bottom:10px;font-size:14px}
.video{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--sh-md);background:var(--brand-dd,#0D2253);margin:14px 0}
.video iframe{width:100%;height:100%;border:0;display:block}
.note{text-align:center;font-size:12.5px;color:var(--subtle);margin-top:10px;font-weight:700}
.note a{color:var(--brand-2);text-decoration:none;border-bottom:1px solid transparent}
.note a:hover{border-bottom-color:currentColor}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 18px;box-shadow:var(--sh-sm);margin-top:14px}
.lbl{font-family:var(--font-h);font-weight:600;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--subtle)}
.h2{font-family:var(--font-h);font-weight:600;font-size:19px;color:var(--brand);margin-top:5px;line-height:1.25}
.hint{margin-top:5px;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.5}

.pat{background:var(--brand-soft);border:1px solid var(--hairline);border-radius:12px;padding:13px 15px;margin-top:12px}
.pat .tp{font-family:var(--font-h);font-weight:600;font-size:16px;color:var(--brand)}
.pat .tp b{color:var(--gold-deep)}
.pat .nt{margin-top:4px;font-size:13px;color:var(--muted);font-weight:600;line-height:1.5;white-space:pre-line}
.pat .ex{margin-top:8px;font-size:14.5px;color:var(--ink);font-weight:700;line-height:1.55}
.pat .ex span{display:block;padding-left:16px;position:relative}
.pat .ex span::before{content:"›";position:absolute;left:0;color:var(--brand-2);font-weight:800}
.wl{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.wl span{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13.5px;font-weight:700}

/* build / bank chips */
.zone{min-height:56px;display:flex;flex-wrap:wrap;gap:7px;align-items:flex-start;
  background:var(--canvas);border:2px dashed var(--line);border-radius:12px;padding:11px;margin-top:14px}
.zone:empty::before{content:attr(data-ph);color:var(--subtle);font-size:13.5px;font-weight:700}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chipw{font:inherit;font-weight:700;font-size:14.5px;background:var(--surface);color:var(--ink);
  border:1px solid var(--line);border-radius:10px;padding:8px 13px;cursor:pointer;box-shadow:var(--sh-sm);
  transition:transform .1s ease,border-color .12s ease}
.chipw:hover{border-color:var(--brand-2)}
.chipw:active{transform:scale(.96)}
.chipw.used{opacity:.32;pointer-events:none}
.zone .chipw{background:var(--brand-soft);border-color:var(--hairline)}

.fb{margin-top:12px;border-radius:11px;padding:11px 13px;font-size:14px;font-weight:700;line-height:1.5}
.fb.ok{background:var(--success-soft);color:var(--success)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb .ans{display:block;margin-top:5px;color:var(--ink);font-weight:800}

.btn{font:inherit;font-family:var(--font-h);font-weight:600;font-size:15.5px;border:0;border-radius:13px;
  padding:13px 18px;cursor:pointer;width:100%;margin-top:14px;transition:filter .14s ease,transform .1s ease}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.42;cursor:default}
.btn-p{background:var(--brand);color:#fff}
.btn-p:hover:not([disabled]){filter:brightness(1.1)}
.btn-g{background:var(--surface);color:var(--brand);border:1px solid var(--line)}
.btn-row{display:flex;gap:9px}
.btn-row .btn{margin-top:0}

/* speak */
.qline{margin-top:12px;font-size:14px;font-weight:700;color:var(--muted)}
.qline b{color:var(--brand)}
.enote{margin-top:6px;font-size:12.5px;font-weight:700;color:var(--gold-deep)}
.model{background:var(--gold-soft);border:1px solid rgba(191,150,72,.3);border-radius:12px;
  padding:14px 16px;margin-top:14px;font-size:16.5px;font-weight:700;color:var(--ink);line-height:1.5}
.stat{text-align:center;font-family:var(--font-h);font-weight:600;font-size:16px;color:var(--muted);
  margin-top:14px;min-height:24px}
.stat.go{color:var(--success)}
.mini{text-align:center;font-size:12.5px;color:var(--subtle);font-weight:700;margin-top:8px;line-height:1.5}

.ask{margin-bottom:16px}
.ask label{display:block;font-family:var(--font-h);font-weight:600;font-size:15px;color:var(--brand);margin-bottom:6px}
.ask label span{display:block;font-family:var(--font-b);font-weight:700;font-size:12.5px;color:var(--subtle);margin-top:2px}
.ask input{width:100%;font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--canvas);
  border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.ask input:focus{outline:none;border-color:var(--brand-2);background:var(--surface)}
.link{background:none;border:0;font:inherit;font-weight:800;font-size:13px;color:var(--brand-2);
  cursor:pointer;padding:0;margin-left:10px;text-decoration:underline}
.mine{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-deep);background:var(--gold-soft);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:middle}
.done-box{text-align:center;padding:28px 18px}
.done-box .big{font-size:44px}
.done-box h2{font-family:var(--font-h);font-weight:700;color:var(--brand);font-size:24px;margin-top:10px}
.hidden{display:none !important}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>

<script>
/* PERSONAL:START */
/* =============================================================================
   把学生的资料接进句子 —— 纯函式，不碰画面、不碰存档
   -----------------------------------------------------------------------------
   独立成一段，是为了让 tools/check-content.mjs 能把它和 DAYS 一起拿去跑：
   每个模板 × 每个选项、加上各种学生会打的答案，都实际组一次句子检查。
============================================================================= */

/* 只接受拉丁字母的答案。学生打「老师」「槟城」时，换进英文句子会变成
   「I work as a 老师.」—— 这种就不换，保留原句，表单上请他用英文填。 */
const isLatin = (s) => /^[A-Za-zÀ-ɏ0-9\s.,'’&()\/-]+$/.test(String(s || "").trim());

/* 名字、地名：每个字第一个字母大写（「marco」→「Marco」、「kuala lumpur」→「Kuala Lumpur」）。
   只动第一个字母，其余照他打的（McDonald、KL 不会被改坏）；马来名字的 bin／binti 维持小写。 */
const NAME_PARTICLE = /^(bin|binti|bte|bt|a\/l|a\/p|s\/o|d\/o|of|and|al|van|von|de)$/i;
function capWords(s) {
  return String(s || "").trim().replace(/\s+/g, " ").split(" ").map((w, i) =>
    i > 0 && NAME_PARTICLE.test(w) ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}

/* a／an 看「音」不看字母：an hour、an MBA student、a university student、a European company。 */
function article(phrase) {
  const w = String(phrase).split(/[\s-]/)[0];
  if (/^[A-Z][A-Z&]+$/.test(w)) return /^[AEFHILMNORSX]/.test(w) ? "an" : "a";   // 缩写照字母念：an HR…、a UX…、an F&B…
  if (/^(hour|honest|honou?r|heir)/i.test(w)) return "an";
  if (/^(uni|use|usu|uti|uro|eu|one\b|once)/i.test(w)) return "a";
  return /^[aeiou]/i.test(w) ? "an" : "a";
}

/* 「不是一份工作」的答案：I work as a retired 不通，要说 I am retired／I am a student。 */
const PROPER_ADJ = /^(English|Chinese|Malay|Mandarin|Tamil|Indian|European|Asian|Japanese|Korean|Islamic|Muslim|Christian|Hindu)\b/;
const JOB_ADJ  = /^(retired|unemployed|self[- ]employed|jobless|between jobs|not working|currently not working)$/i;
/* 结尾允许「at／in …」：student at USM、housewife in Ipoh */
const JOB_BEING = /(student|retiree|housewife|homemaker|househusband|stay[- ]at[- ]home \w+|full[- ]time (mum|mom|mother|dad|father|parent)|freelancer|business owner|entrepreneur)(\s+\b(at|in)\b.*)?$/i;
/* 填的是「行业／部门」不是职称：I work as a sales 不通，要说 I work in sales */
const JOB_FIELD = /^(sales|marketing|IT|HR|admin|accounts?|accounting|finance|banking|education|customer service|logistics|F&B)$/i;

/* 学生填的工作 → { phrase: 放进选项的那一段, sentence: 完整的一句（不含句点） }。
   去掉他自己打的开头（I am／I'm／I work as／my job is／a／an），再依种类组句。
   不是拉丁字母就回传 null（不换）。 */
function jobInfo(raw) {
  let j = String(raw || "").trim().replace(/\s+/g, " ").replace(/[.!]+$/, "");
  if (!j || !isLatin(j)) return null;
  j = j.replace(/^my (job|work) is\s+/i, "")
       .replace(/^i\s*(am|['’]?m)\s+/i, "")
       .replace(/^(i\s+)?(work|working)\s+as\s+/i, "");
  const at = j.match(/^(?:i\s+)?(?:work|working)\s+(in|at|for)\s+(.+)$/i);
  if (at) return { phrase: `${at[1].toLowerCase()} ${at[2]}`, sentence: `I work ${at[1].toLowerCase()} ${at[2]}`, kind: "at" };
  j = j.replace(/^(an?|the)\s+/i, "");
  if (!j) return null;
  /* Teacher → teacher；MBA、IT 不动；English teacher、European… 这种专有形容词也不动 */
  if (/^[A-Z][a-z]/.test(j) && !PROPER_ADJ.test(j)) j = j.charAt(0).toLowerCase() + j.slice(1);
  if (JOB_ADJ.test(j)) return { phrase: j, sentence: `I am ${j}`, kind: "am" };
  if (JOB_FIELD.test(j)) return { phrase: `in ${j}`, sentence: `I work in ${j}`, kind: "at" };
  const np = `${article(j)} ${j}`;
  if (JOB_BEING.test(j)) return { phrase: np, sentence: `I am ${np}`, kind: "am" };
  return { phrase: np, sentence: `I work as ${np}`, kind: "work" };
}

/* 目标：去掉「I want to／to」这些他可能自己打的开头，留下动词片语。 */
/* 句子是「I want to ___」，所以目标一定要是动词开头。认不出来的（名词、-ing、
   「I want a better job」这种没有 to 的）就回传 ""，保留原本的示范句 ——
   宁可不换，也不要组出「I want to IELTS band 7」。 */
const GOAL_NOUN = /^(a|an|the|my|more|better|good|English|IELTS|MUET|SPM|fluency|confidence|promotion|grammar|vocabulary|pronunciation)\b/i;
function goalPhrase(raw) {
  let g = String(raw || "").trim().replace(/\s+/g, " ").replace(/[.!]+$/, "");
  if (!g || !isLatin(g)) return "";
  g = g.replace(/^(i\s+)?(want|would like|wish|hope|plan|need)\s+to\s+/i, "").replace(/^to\s+/i, "");
  if (/^i\s+(want|wish|would like|hope|need)\b/i.test(g)) return "";        // I want a better job：没有 to
  g = g.replace(/^(can|could|be able to)\s+/i, "");
  const w = g.split(" ")[0];
  if (!w || (/ing$/i.test(w) && !/^(bring|sing|ring|swing|sting)$/i.test(w)) || /^[A-Z][A-Z0-9&]+$/.test(w) || GOAL_NOUN.test(g) || PROPER_ADJ.test(g)) return "";
  if (/^[A-Z][a-z]/.test(g) && !/^I\b/.test(g)) g = g.charAt(0).toLowerCase() + g.slice(1);
  return g;
}

/* 学生资料里「可以用」的部分（非拉丁字母的栏位视为没填） */
function ownValues(p) {
  p = p || {};
  const job = jobInfo(p.job);
  const goal = goalPhrase(p.goal);
  return {
    /* 去掉他自己打的开头：「I am Ali」「My name is Ali」「from Ipoh」，不然会变成「I am I Am Ali.」 */
    name:  p.name && isLatin(p.name) ? capWords(String(p.name).trim().replace(/^(hi,?\s*)?(my name is|i am|i['’]?m)\s+/i, "")) : "",
    place: p.place && isLatin(p.place) ? capWords(String(p.place).trim().replace(/^(i\s*(am|['’]?m)\s+)?from\s+/i, "")) : "",
    job, goal,
    goalTo: goal ? "to " + goal : ""
  };
}

/* 把示范句换成学生的资料 —— 一次替换，不是一条接一条。
   ⚠️ 2026-09-24 以前是逐条 replace：学生叫「Sarah Lee」，先把 Wesley 换成 Sarah Lee，
      下一条又把里面的 Sarah 换一次 →「I am Sarah Lee Lee.」；「Penang, Malaysia」也会
      被後面的 Penang 规则再吃一次。现在所有规则合成一个正规式、由长到短排，每个位置
      只被换一次，学生自己的字不会再被重新比对。
   规则都带着句型开头（I am／I am from／I work as），课程里其他地方出现的
   Penang（「Are you from Penang?」）不会被换掉。
   goalFrom：这一天目标句里「想做到的事」那一段（DAYS 的 finalGoal），只在那一句换。 */
function personalise(text, p, goalFrom) {
  if (!text || !p) return text;
  const v = ownValues(p);
  const map = {};
  if (v.name) ["Wesley", "Sarah"].forEach((n) => { map[`I am ${n}`] = `I am ${v.name}`; });
  if (v.place) ["Penang, Malaysia", "Yong Peng, Malaysia", "Penang", "Malaysia"]
    .forEach((pl) => { map[`I am from ${pl}`] = `I am from ${v.place}`; });
  if (v.job) ["an admin executive", "an admin assistant", "a teacher", "a doctor"]
    .forEach((j) => { map[`I work as ${j}`] = v.job.sentence; });
  if (v.goal && goalFrom) map[`I want to ${goalFrom}`] = `I want to ${v.goal}`;
  const keys = Object.keys(map).sort((a, b) => b.length - a.length);
  if (!keys.length) return text;
  const lower = {}; keys.forEach((k) => { lower[k.toLowerCase()] = map[k]; });
  const re = new RegExp(`\\b(?:${keys.map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|")})(?![\\w])`, "gi");
  return String(text).replace(re, (m) => lower[m.toLowerCase()]);
}

/* 模板填空。选项本身以「a.m.」结尾时不要再多一个句点。 */
const fillTpl = (tpl, v) => String(tpl).replace("___", v).replace(/\.\.$/, ".");

/* 「换」的一个选项组成的句子。学生自己的工作如果不是「work as」那种
   （退休、学生、家庭主妇、work in a bank），整句换成他的说法。 */
function substSentence(st, value, isOwn, p) {
  if (isOwn && st.field === "job") {
    const j = ownValues(p).job;
    if (j && j.kind !== "work") return j.sentence + ".";
  }
  return fillTpl(st.tpl, value);
}

/* 「拼」的字块 —— 跟 tools/build-content.mjs 的 wordsOf() 同一个规则：
   只拿掉头尾标点，a.m.／Mr. 这类缩写的点留着（「7:00」「a.m.」才拼得回原句）。 */
function chipsOf(s) {
  const ABBR = /^(?:[a-z]\.){2,}$|^(?:Mr|Mrs|Ms|Dr)\.$/i;
  return String(s).replace(/\s+/g, " ").trim().split(" ").map((w) => {
    w = w.replace(/^[“"(]+/, "").replace(/[”")]+$/, "");
    return ABBR.test(w) ? w : w.replace(/[.,!?;:]+$/, "");
  }).filter(Boolean);
}
/* PERSONAL:END */

  };
  $("skipb").onclick = () => { if (SP) SP.markAsked(); S.asked = true; save(); renderHome(); };
  window.scrollTo(0, 0);
}

/* ---------- 首页 ----------
   ✅ Marco 2026-09-24：每个课程都用同一个首页 —— 课程进度、一张「继续」卡、
   路线图（一个单元一条色带、一天一颗圆、复习日当 BOSS 放最後）。版面在
   shared/course-home.js；这里只决定内容：哪几天是一个单元、下一天是哪天。

   单元 = 到复习日为止（DAY 7／13／20 本来就是复习日，当该单元的 BOSS）。
   21–30 没有复习日，按主题切成「简报与面试」（21–26）和「日常情境」（27–30），
   这两个单元没有 BOSS。每一天都一直开着（跟以前的格子一样，不锁）。

   SHORT 是圆圈底下的短标题（圆圈宽 116px，DAY 的完整标题太长）。完整标题照旧
   从 DAYS（Sheet）来，显示在「继续」卡和那一天的页面上。Sheet 改了某一天的主题，
   这里的短标题要跟着改 —— 没有对应的就退回完整标题。 */
const UNITS = [
  { from: 1,  to: 7,  icon: "👋", t: { en: "You and your daily life", zh: "介绍自己和日常生活", ms: "Diri anda & kehidupan harian" } },
  { from: 8,  to: 13, icon: "🙋", t: { en: "Asking and explaining", zh: "提问和解释", ms: "Bertanya & menerangkan" } },
  { from: 14, to: 20, icon: "💬", t: { en: "Opinions, past and future", zh: "表达意见、过去和未来", ms: "Pendapat, masa lalu & masa depan" } },
  { from: 21, to: 26, icon: "🎤", t: { en: "Presentations and interviews", zh: "简报和面试", ms: "Pembentangan & temu duga" } },
  { from: 27, to: 30, icon: "🗺️", t: { en: "Everyday situations", zh: "日常生活情境", ms: "Situasi harian" } }
];
const SHORT = {
  1: "Introduce yourself", 2: "Daily routine", 3: "What you like", 4: "What you don't like",
  5: "What you want", 6: "What you need", 7: "Your introduction",
  8: "Simple questions", 9: "Yes / No questions", 10: "Giving reasons", 11: "Giving examples",
  12: "Connectors", 13: "Review 8–12",
  14: "Your opinion", 15: "Explaining", 16: "Opinion + example", 17: "Your past",
  18: "Right now", 19: "Your future", 20: "Review 14–19",
  21: "Starting a talk", 22: "Main points", 23: "Explaining ideas", 24: "Longer answers",
  25: "Short paragraphs", 26: "Interview answers",
  27: "Adjectives", 28: "Directions", 29: "Appointments", 30: "Reservations"
};

function renderHome() {
  rec.stopAll();
  redraw = renderHome;
  if (!S.asked) return renderAsk(false);
  const n = Object.keys(S.done).length;
  const total = DAYS.length;
  const pct = total ? Math.round((n / total) * 100) : 0;
  /* 下一天 = 第一个还没完成的（练习过但没及格的也算没完成）。跟完成页的「Next: Day …」同一个意思 */
  const nx = DAYS.find((d) => !S.done[d.day]) || null;
  const unitOf = (day) => UNITS.findIndex((u) => day >= u.from && day <= u.to);
  const started = n > 0 || Object.keys(S.practised).length > 0;

  app().innerHTML = `${topBar()}
    ${window.TouchNav ? TouchNav.html() : ""}
    <div id="homemap"></div>`;

  /* 怎么练 + 「我的资料」：放在卡片底下、路线图上面 */
  const info = document.createElement("p");
  info.className = "sb-info";
  info.innerHTML = `${esc(L_("homeSub"))}<button class="link" id="edit">${esc(L_(S.profile ? "myInfo" : "addInfo"))}</button>`;
  info.querySelector("#edit").onclick = () => renderAsk(true);

  let cont;
  if (nx) {
    const ui = unitOf(nx.day);
    cont = {
      icon: nx.review ? "👑" : (UNITS[ui] ? UNITS[ui].icon : "🎤"),
      kicker: started ? "RESUME" : "START",
      title: nx.title,
      sub: `${nx.review ? "Review · " : ""}Day ${nx.day}${ui >= 0 ? ` · Unit ${ui + 1}` : ""}`,
      onClick: () => openDay(nx.day)
    };
  } else {
    cont = { icon: "🏆", kicker: "★", title: L_("courseDoneT"), sub: L_("courseDone"), go: "🎉" };
  }

  TouchHome.render($("homemap"), {
    progress: {
      label: "Course Progress",
      pct,
      sub: `Speaking Bonus · ${total} days`,
      stats: [
        { v: `${n}/${total}`, l: "Days" },
        { v: S.xp, l: "XP" },
        { v: Object.keys(S.recorded).length, l: "Recordings" }
      ]
    },
    cont,
    before: info,
    sections: UNITS.map((u, ui) => {
      const days = DAYS.filter((d) => d.day >= u.from && d.day <= u.to);
      const dn = days.filter((d) => S.done[d.day]).length;
      return {
        kicker: `Unit ${ui + 1} · Days ${u.from}–${u.to} · ${dn}/${days.length}`,
        title: tx(u.t),
        icon: u.icon,
        nodes: days.map((d) => {
          const done = !!S.done[d.day];
          const prac = !done && d.day in S.practised;
          const isNext = nx && nx.day === d.day;
          return {
            label: `Day ${d.day} · ${SHORT[d.day] || d.title}`,
            state: done ? "done" : isNext ? "go" : "avail",
            boss: !!d.review,
            practised: prac,
            tag: prac ? L_("pracTag") : undefined,
            flag: isNext ? "START HERE" : undefined,
            onClick: () => openDay(d.day)
          };
        })
      };
    })
  });
  window.scrollTo(0, 0);
}

/* 换语言时要把「现在这一屏」重画一次 —— 每个进入点自己登记怎么重画 */
let redraw = () => renderHome();

/* ---------- 单日 ---------- */
let D = null, idx = 0;
let freshRun = true;   // 打开时这一天还没完成 → 这一趟的步骤可以拿 XP（earnOnce）
let builds = {};       // 这一趟「拼」的结果 { 步骤序号: 第一次就对? }，用来算及格线
let picks = {};        // 这一趟「换」选的句子 { 项目序号: 句子 }，接下来的「说」就说这一句

function openDay(dayNo) {
  D = DAYS.find((x) => x.day === dayNo);
  if (!D) return renderHome();
  idx = 0; freshRun = !S.done[D.day]; builds = {}; picks = {};
  renderDay();
}

function dayShell(inner) {
  return `${topBar()}
    <button class="back" id="back">‹ All days</button>
    <span class="lbl">${D.review ? "Review · " : ""}Day ${D.day}${D.tagline ? " · " + esc(D.tagline) : ""}</span>
    <h1 style="font-size:clamp(22px,4.6vw,29px);margin-top:4px">${esc(D.title)}</h1>
    ${inner}`;
}

function renderDay() {
  rec.stopAll();
  /* 影片那一屏也要登记 —— 以前只有练习步骤登记，在影片页换语言会跳回首页 */
  redraw = renderDay;
  /* 第一屏：影片 */
  if (idx === 0) {
    const v = D.video;
    app().innerHTML = dayShell(`
      ${v ? `<div class="video"><iframe src="https://www.youtube.com/embed/${esc(v)}"
              title="${esc(D.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen></iframe></div>
             <p class="note">Video not loading? <a href="https://www.youtube.com/watch?v=${esc(v)}" target="_blank" rel="noopener noreferrer">Open on YouTube</a></p>`
            : `<div class="card"><p class="hint">${esc(L_("noVideo"))}</p></div>`}
      ${D.covers && D.covers.length ? `<div class="card">
        <span class="lbl">${esc(L_("inVideo"))}</span>
        <div class="wl">${D.covers.slice(0, 8).map((c) => `<span>${esc(tx(c))}</span>`).join("")}</div></div>` : ""}
      <button class="btn btn-p" id="go">Start practising →</button>`);
    $("back").onclick = renderHome;
    $("go").onclick = () => { idx = 1; renderDay(); };
    window.scrollTo(0, 0);
    return;
  }

  const steps = D.steps || [];
  const si = idx - 1;

  /* 最後一屏：完整目标句录音 + 完成 */
  if (si >= steps.length) return renderFinal();

  const st = steps[si];
  const pos = `Step ${si + 1} / ${steps.length + (D.finalSpeak ? 1 : 0)}`;
  const box = document.createElement("div");

  if (st.k === "patterns")  renderPatterns(box, st, pos);
  else if (st.k === "order") renderOrder(box, st, pos);
  else if (st.k === "subst") renderSubst(box, st, pos);
  else if (st.k === "speak") {
    /* 刚才「换」选了自己的句子，就说、录他自己那一句 */
    const own = st.item != null && picks[st.item];
    renderSpeak(box, own || st.model, pos, `${D.day}:${si}`, st.head, { q: st.q, raw: !!own });
  }
  else { idx++; return renderDay(); }

  app().innerHTML = dayShell("");
  app().appendChild(box);
  $("back").onclick = renderHome;
  window.scrollTo(0, 0);
}

const next = () => { idx++; renderDay(); };

/* 看：句型卡 */
function renderPatterns(box, st, pos) {
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSee"))}</span>
    <div class="h2">Sentence pattern</div>
    <p class="hint">${esc(L_("patHint"))}${isMine(st.examples ? st.examples.join(" ") : "") ? `<span class="mine">${esc(L_("tagMine"))}</span>` : ""}</p>
    <div class="pat">
      <div class="tp">${esc(st.head).replace(/\+/g, "<b>+</b>")}</div>
      ${st.desc ? `<div class="nt">${esc(tx(st.descT || st.desc))}</div>` : ""}
      ${st.q ? `<p class="qline">${esc(L_("question"))}: <b>${esc(st.q)}</b></p>` : ""}
      ${st.examples && st.examples.length ? `<div class="ex">${st.examples.map((e) => `<span>${esc(me(e))}</span>`).join("")}</div>` : ""}
      ${st.words && st.words.length ? `<div class="wl">${st.words.map((w) => `<span>${esc(w)}</span>`).join("")}</div>` : ""}
    </div>
    <button class="btn btn-p" id="go">Continue</button></div>`;
  setTimeout(() => { if (!box.isConnected) return; $("go").onclick = () => { earnOnce(`${D.day}:${idx - 1}`, 2); next(); }; }, 0);
}

/* 拼：拆句重组 —— 记忆点在这里 */
function renderOrder(box, st, pos) {
  /* 换成他自己的句子；但换完太长的话（例如工作名称很长）就退回原句，
     不然字块会多到不好玩。 */
  let answer = st.words, display = st.display || st.words.join(" ");
  let alts = st.alt || [];
  const mineTxt = me(display);
  if (mineTxt !== display) {
    const w = chipsOf(mineTxt);
    if (w.length <= 10) { answer = w; display = mineTxt; alts = alts.map((a) => me(a)); }
  }
  /* 有些句子不只一种正确语序（「I was very shy in the past.」），都算对 */
  const accepted = [display, ...alts].map(norm);
  const si = idx - 1;
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stBuild"))}</span>
    <div class="h2">Build the sentence</div>
    <p class="hint">${esc(L_("ordHint"))}</p>
    <div class="zone" id="zone" data-ph="${esc(L_("ordPh"))}"></div>
    <div class="bank" id="bank">${shuffle(answer).map((w, i) =>
      `<button class="chipw" data-i="${i}" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <div id="fb"></div>
    <button class="btn btn-p" id="go" disabled>Check</button></div>`;

  setTimeout(() => {
    if (!box.isConnected) return;
    const placed = [];
    const zone = $("zone"), bank = $("bank"), go = $("go");
    let locked = false;          // 按过 Check 之後就锁住，不然学生再动字块会把 Continue 变回 disabled 卡死

    const sync = () => {
      zone.innerHTML = placed.map((p, i) => `<button class="chipw" data-p="${i}">${esc(p.v)}</button>`).join("");
      if (!locked) {
        zone.querySelectorAll("[data-p]").forEach((b) => {
          b.onclick = () => { const p = placed.splice(parseInt(b.dataset.p, 10), 1)[0];
            bank.querySelector(`[data-i="${p.i}"]`).classList.remove("used"); sync(); };
        });
        go.disabled = placed.length !== answer.length;
      }
    };

    bank.querySelectorAll(".chipw").forEach((b) => {
      /* 也要在处理函式里挡掉 —— CSS 的 pointer-events 挡不住程式点击，
         触控装置上连点两下也可能重复触发。 */
      b.onclick = () => {
        if (locked || b.classList.contains("used")) return;
        b.classList.add("used"); placed.push({ i: b.dataset.i, v: b.dataset.v }); sync();
      };
    });

    /* 拼错可以再试一次（先不给答案，他才会自己再想一次）；第二次还错才给正确顺序。
       及格线只看第一次 —— 第二次是练习，不是分数。 */
    let tries = 0;
    const check = () => {
      const got = placed.map((p) => p.v).join(" ");
      const ok = accepted.includes(norm(got));
      tries++;
      if (!(si in builds)) builds[si] = ok;
      if (!ok && tries === 1) {
        $("fb").innerHTML = `<div class="fb no">${esc(L_("ordRetry"))}</div>`;
        placed.length = 0;
        bank.querySelectorAll(".chipw").forEach((b) => b.classList.remove("used"));
        sync();
        return;
      }
      locked = true;
      sync();                      // 重画一次，把区块里字块的 onclick 拿掉
      $("fb").innerHTML = ok
        ? `<div class="fb ok">${esc(L_("ordOK"))}</div>`
        : `<div class="fb no">${esc(L_("ordNo"))}<span class="ans">${esc(display)}</span></div>`;
      if (ok && tries === 1) earnOnce(`${D.day}:${si}`, 5);
      go.disabled = false; go.textContent = "Continue"; go.onclick = next;
    };
    go.onclick = check;
    sync();
  }, 0);
}

/* 换：替换练习 —— 同一个模板，换成自己的资料 */
function renderSubst(box, st, pos) {
  /* 如果这个空格正好是开始前问过的（名字／地方／工作／目标），
     就把他自己的答案放在第一个 —— 练的是关于自己的句子。 */
  const vals = ownValues(S.profile);
  const f = st.field;
  const own = !f ? "" : f === "job" ? (vals.job ? vals.job.phrase : "") : (vals[f] || "");
  const bank = own ? [own, ...st.bank.filter((b) => b.toLowerCase() !== own.toLowerCase())] : null;
  const si = idx - 1;
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSwap"))}</span>
    <div class="h2">Make it yours</div>
    <p class="hint">${esc(L_("subHint"))}${own ? `<span class="mine">${esc(L_("tagFirst"))}</span>` : ""}</p>
    <div class="pat"><div class="tp" id="tpl">${esc(st.tpl).replace(/___/g, "<b>___</b>")}</div></div>
    <div class="bank" id="bank">${(bank || shuffle(st.bank)).map((w) =>
      `<button class="chipw" data-v="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <button class="btn btn-p" id="go" disabled>Continue</button></div>`;

  setTimeout(() => {
    if (!box.isConnected) return;
    let picked = false;
    $("bank").querySelectorAll(".chipw").forEach((b) => {
      b.onclick = () => {
        const v = b.dataset.v, isOwn = !!own && v === own;
        const sentence = substSentence(st, v, isOwn, S.profile);
        /* 显示整句、把换进去的那段标出来；整句换掉的（I am retired.）就整句标 */
        const at = sentence.indexOf(v);
        $("tpl").innerHTML = at >= 0
          ? esc(sentence.slice(0, at)) + `<b>${esc(v)}</b>` + esc(sentence.slice(at + v.length))
          : `<b>${esc(sentence)}</b>`;
        if (st.item != null) picks[st.item] = sentence;
        if (!picked) { picked = true; earnOnce(`${D.day}:${si}`, 3); $("go").disabled = false; }
      };
    });
    $("go").onclick = next;
  }, 0);
}

/* 说：录音 */
function renderSpeak(box, model, pos, key, head, opts) {
  const can = rec.available;
  opts = opts || {};
  /* raw：句子已经是学生自己组的（「换」选的），不再套 personalise */
  const mine = opts.raw || isMine(model, opts.goalFrom);
  model = opts.raw ? model : me(model, opts.goalFrom);
  box.innerHTML = `<div class="card">
    <span class="lbl">${pos} · ${esc(L_("stSay"))}</span>
    <div class="h2">Now say it</div>
    ${head ? `<p class="hint">${esc(head)}</p>` : ""}
    ${opts.q ? `<p class="qline">${esc(L_("question"))}: <b>${esc(opts.q)}</b></p>` : ""}
    <div class="model">${esc(model)}${mine ? `<span class="mine">${esc(L_("tagYours"))}</span>` : ""}</div>
    ${can ? `
      <div class="stat" id="stat"></div>
      <div class="btn-row">
        <button class="btn btn-p" id="recb">● Record</button>
        <button class="btn btn-p hidden" id="stopb">■ Stop</button>
        <button class="btn btn-g" id="playb" disabled>▶ Play back</button>
      </div>
      <p class="mini" id="mini">${esc(L_("micNote"))}</p>`
    : `<p class="mini">${esc(L_("noRec"))}</p>`}
    <button class="btn ${opts && opts.goClass ? opts.goClass : "btn-g"}" id="go">${esc((opts && opts.goText) || "Continue")}</button></div>`;

  setTimeout(() => {
    /* 这一屏在接线之前就被换掉了（例如快速换语言）→ 不要把按钮接到下一屏去 */
    if (!box.isConnected) return;
    $("go").onclick = (opts && opts.onGo) || next;
    if (!can) return;

    const stat = $("stat"), recb = $("recb"), stopb = $("stopb"), playb = $("playb");
    let blob = null, session = null;

    const idle = () => {
      recb.classList.remove("hidden"); stopb.classList.add("hidden"); stopb.disabled = false;
      recb.textContent = blob ? "↻ Record again" : "● Record";
      playb.disabled = !blob; stat.textContent = ""; stat.classList.remove("go");
    };

    rec.load(key).then((b) => { if (b && !blob) { blob = b; $("mini").textContent = L_("hadRec"); idle(); } });

    recb.onclick = () => {
      recb.classList.add("hidden"); playb.disabled = true;
      session = rec.capture({
        saveAs: key,
        onCountdown: (n) => { stat.classList.remove("go"); stat.textContent = "Get ready… " + n; },
        onSpeakNow: () => { stat.classList.add("go"); stat.textContent = "🟢 Speak now"; stopb.classList.remove("hidden"); },
        onSaving:   () => { stat.classList.remove("go"); stat.textContent = "Saving…"; stopb.disabled = true; },
        onDone: (b) => {
          blob = b;
          if (!S.recorded[key]) { S.recorded[key] = true; if (freshRun) addXP(5); }
          save();
          $("mini").textContent = L_("gotRec");
          idle();
        },
        onDenied: () => { stat.textContent = ""; $("mini").textContent = L_("noMic"); idle(); }
      });
    };
    stopb.onclick = () => { if (session) session.stop(); };
    playb.onclick = () => { if (blob) rec.play(blob); };
    idle();
  }, 0);
}

/* ---------- 最後：完整目标句 + 完成 ---------- */
/* 这一趟「拼」的成绩：{ n: 第一次就对的题数, t: 题数 }。没有「拼」的天 t = 0，直接算过。 */
function dayScore() {
  const t = (D.steps || []).filter((x) => x.k === "order").length;
  const n = Object.values(builds).filter(Boolean).length;
  return { n, t, pass: t === 0 || n / t >= PASS };
}

function finishDay() {
  const sc = dayScore();
  if (sc.pass) {
    if (!S.done[D.day]) earnOnce(`${D.day}:done`, 10);
    S.done[D.day] = true; delete S.practised[D.day];
  } else if (!S.done[D.day]) {
    /* 没到及格线：记成「练习过」，不算完成；已经完成过的天不会因为重做没及格被取消 */
    S.practised[D.day] = Math.round((sc.n / sc.t) * 100) / 100;
  }
  save();
  renderDone(sc);
}

function renderFinal() {
  /* 重做已完成的天也要能录最後这一句 —— 以前完成过就直接跳到完成页 */
  if (D.finalSpeak) {
    const box = document.createElement("div");
    /* 「Finish this day」一定要透过 opts 交给 renderSpeak 自己接。
       renderSpeak 是在 setTimeout(…, 0) 里接 #go 的 —— 从外面先设
       go.onclick，会被那个 setTimeout 盖成 next()，按下去等於按 Continue，
       画面原地重画一次，看起来就像「按了没反应」。 */
    renderSpeak(box, D.finalSpeak, "Final", `${D.day}:final`, L_("finalHint"), {
      goText : "Finish this day ✓",
      goClass: "btn-p",
      q      : D.finalQ,
      goalFrom: D.finalGoal,          // DAY 7／19／20：目标句换成学生自己的目标
      onGo   : finishDay
    });
    app().innerHTML = dayShell("");
    app().appendChild(box);
    $("back").onclick = renderHome;
    window.scrollTo(0, 0);
    return;
  }
  finishDay();
}

function renderDone(sc) {
  sc = sc || dayScore();
  const passed = !!S.done[D.day] && sc.pass;
  const nextDay = DAYS.find((x) => x.day > D.day);
  const left = DAYS.length - Object.keys(S.done).length;
  let msg;
  if (!passed) msg = fmt(L_("pracMsg"), sc);
  else if (!nextDay) msg = left === 0 ? L_("courseDone") : left === 1 ? L_("lastDayLeft1") : fmt(L_("lastDayLeft"), { n: left });
  else msg = me(D.outcome, D.finalGoal) || L_("doneMsg");
  app().innerHTML = dayShell(`<div class="card done-box">
      <div class="big">${passed ? (nextDay || left ? "🎉" : "🏆") : "💪"}</div>
      <h2>${passed ? (!nextDay && left === 0 ? esc(L_("courseDoneT")) : `Day ${D.day} complete`) : esc(L_("pracTitle"))}</h2>
      ${passed && sc.t ? `<p class="hint">${esc(fmt(L_("passMsg"), sc))}</p>` : ""}
      <p class="hint">${esc(msg)}</p>
      ${!passed ? `<button class="btn btn-p" id="redo">${esc(L_("redo"))}</button>` : ""}
      ${passed && nextDay ? `<button class="btn btn-p" id="nx">Next: Day ${nextDay.day} →</button>` : ""}
      <button class="btn btn-g" id="home">All days</button>
    </div>`);
  redraw = () => renderDone(sc);
  $("back").onclick = renderHome;
  $("home").onclick = renderHome;
  if ($("nx")) $("nx").onclick = () => openDay(nextDay.day);
  if ($("redo")) $("redo").onclick = () => openDay(D.day);
  window.scrollTo(0, 0);
}

/* ---------- 语言切换 ----------
   topBar() 每次 render 都重新产生，所以不逐个接 onclick，改用事件委派接在
   document 上一次就好。 */
if (SP) {
  document.addEventListener("click", (e) => {
    const b = e.target.closest ? e.target.closest("[data-lang]") : null;
    if (!b) return;
    if (SP.setLang(b.dataset.lang)) redraw();
  });
}

/* ---------- go ---------- */
renderHome();
</script>
</body>
</html>
