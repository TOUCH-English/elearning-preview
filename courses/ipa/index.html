<!-- TOUCH English — IPA Pronunciation Course
     A data-driven, gamified learning engine.
     ARCHITECTURE OVERVIEW (see JS sections):
       1. CONTENT MODEL .... pure data: stages + exercises (the only thing you edit to add content)
       2. PERSISTENCE ...... saves/loads progress (browser localStorage + in-memory fallback)
       3. STATE STORE ...... single source of truth for the learner
       4. XP / LEVEL SYSTEM
       5. BADGE SYSTEM
       6. PROGRESSION SYSTEM (locking / unlocking)
       7. FEEDBACK SYSTEM (encouragement + hints + sound + confetti)
       8. REWARD SYSTEM (stage payouts)
       9. EXERCISE ENGINE (one reusable renderer for every question type)
      10. SCREEN ROUTER + STAGE TEMPLATE (Video → Learn → Exercises → Reward)
-->
<meta charset="utf-8">
<title>Touch English — IPA Pronunciation</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../shared/theme.css">
<style>
:root{
  /* ===== Touch English Booking System theme =====
     Variable NAMES are unchanged so every existing rule re-themes automatically.
     teal* = Navy (primary/active) · coral* = Maroon (secondary) ·
     sun*  = Gold (premium/XP)     · good*  = Green (completed) */
  --cream: var(--te-canvas, #F5F7FA); --cream-2:#E9EEF5; --ink: var(--te-ink, #16202E); --ink-soft: var(--te-muted, #5C6675);
  --line: var(--te-line, #DCE3EC);
  --teal: var(--te-brand, #15357B); --teal-d: var(--te-brand-d, #112C68); --teal-dd: var(--te-brand-dd, #0D2253);          /* Navy (primary) */
  --coral: var(--te-danger, #8B1E3F); --coral-d: var(--te-danger-d, #6F1730);                            /* Maroon (secondary) */
  --sun: var(--te-gold, #D9B56B); --sun-d: var(--te-gold-deep, #BE9648);                                /* Premium Gold */
  --sky:#3E6FA0; --sky-d:#2C5480;                                /* muted navy-blue accent */
  --plum: var(--te-danger, #8B1E3F); --plum-d: var(--te-danger-d, #6F1730);                              /* fold accent into maroon */
  --good: var(--te-success, #4FAE8A); --good-d: var(--te-success-d, #3C8E6F);                              /* Success green (completed) */
  --bad: var(--te-bad, #C0405C); --bad-d: var(--te-bad-d, #9E2E47);                                /* soft maroon-red for "try again" */
  --white: var(--te-surface, #FFFFFF);
  /* Apple-inspired elevation: soft, diffuse, low-contrast (never chunky) */
  --shadow:0 6px 0;
  --soft:0 1px 1px rgba(27,36,51,.04), 0 6px 18px rgba(27,36,51,.07);
  --soft-lg:0 1px 2px rgba(27,36,51,.05), 0 14px 38px rgba(27,36,51,.11);
  --soft-sm:0 1px 1px rgba(27,36,51,.04), 0 2px 8px rgba(27,36,51,.06);
  --hair:rgba(27,36,51,.08);            /* hairline border */
  --r:22px; --r-lg:20px; --r-md:16px; --r-sm:12px;
  font-family:var(--te-font-body,'Nunito',-apple-system,'Segoe UI','Noto Sans',sans-serif);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(120% 90% at 0% -10%, #FBFCFE 0%, rgba(251,252,254,0) 45%),
    radial-gradient(120% 90% at 100% 0%, #E9EEF5 0%, rgba(233,238,245,0) 50%),
    var(--cream);
  color:var(--ink);
  display:flex;justify-content:center;
  font-size:16px;-webkit-font-smoothing:antialiased;
}
/* phone frame on desktop, edge-to-edge on mobile */
#app{
  width:100%;max-width:470px;min-height:100vh;position:relative;
  display:flex;flex-direction:column;
  /* 透明：露出平台的底（shared/theme.css），跟其他课程一样。原本是白底加手机外框。 */
  background:transparent;
  overflow:visible;            /* let the page scroll vertically (iOS Safari fix) */
  overflow-x:clip;             /* still hide any horizontal overspill */
}
@media(min-width:520px){ #app{margin:0 0;border-radius:0} body{align-items:stretch} }

h1,h2,h3,.disp{font-family:var(--te-font-display,'Fredoka',sans-serif);font-weight:700;letter-spacing:.2px;margin:0}
.ipa{font-family:var(--te-font-body,'Nunito','Segoe UI','Noto Sans',sans-serif);font-weight:800;letter-spacing:.5px}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:30;
  padding:12px 16px 10px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.hud-row{display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;
  padding:6px 11px;border-radius:999px;background:var(--white);
  border:1px solid var(--line);box-shadow:var(--soft-sm);
}
.chip .ic{font-size:15px;line-height:1}
.chip.streak{color:var(--coral-d)} .chip.xp{color:var(--sun-d)}
.lvl{
  display:flex;align-items:center;gap:9px;margin-left:auto;
}
.lvl .ring{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--teal) var(--p,0deg), #E4E9F0 0deg);
  flex:none;
}
.lvl .ring i{width:26px;height:26px;border-radius:50%;background:var(--white);display:grid;place-items:center;
  font-family:var(--te-font-display,'Fredoka');font-weight:700;font-size:13px;color:var(--teal-dd);font-style:normal}
.xpbar{height:10px;border-radius:99px;background:#E4E9F0;margin-top:9px;overflow:hidden;border:1px solid var(--line)}
.xpbar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sun),var(--sun-d));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xptxt{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:4px;text-align:right}
.sound-btn{margin-left:6px;background:none;border:none;font-size:17px;cursor:pointer;opacity:.7}

/* ---------- generic ---------- */
#screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:18px 18px 28px}
/* ===== TOUCH Button System v1.0 — 3D candy buttons ===== */
.btn{--bb:#16314F;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:var(--te-font-display,'Fredoka');font-weight:700;font-size:16px;letter-spacing:.3px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  padding:15px 20px;border:none;border-radius:16px;
  background:linear-gradient(180deg,#3A6094 0%,#1E4296 55%,var(--teal) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(20,38,64,.22);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s cubic-bezier(.34,1.56,.64,1), filter .15s;
  -webkit-tap-highlight-color:transparent}
.btn::before{content:"";position:absolute;left:5%;right:5%;top:3px;height:46%;border-radius:14px 14px 18px 18px/14px 14px 30px 30px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05) 85%,rgba(255,255,255,0));pointer-events:none}
.btn::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-80%;width:45%;transform:skewX(-22deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5) 50%,rgba(255,255,255,0));
  animation:btnshine 3s linear infinite;pointer-events:none}
@keyframes btnshine{0%,72%{left:-80%}92%,100%{left:160%}}
.btn:active,.btn.pressed{transform:translateY(4px) scale(1.015,.96);box-shadow:0 1px 0 var(--bb),0 4px 8px rgba(20,38,64,.18)}
.btn.coral{--bb:#6F1730;background:linear-gradient(180deg,#B23A5A 0%,#9B2A4A 55%,var(--coral) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(111,23,48,.26)}
.btn.bad{--bb:#9E2E47;background:linear-gradient(180deg,#D46078 0%,#C9536C 55%,var(--bad) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(158,46,71,.26)}
.btn.sun{--bb:#9A7836;background:linear-gradient(180deg,#F0D89B 0%,#E2C27E 50%,var(--sun) 100%);color:#5A3A1E;
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(190,150,72,.26);animation:btnbreathe 2.4s ease-in-out infinite}
.btn.sun:active,.btn.sun.pressed{animation:none}
@keyframes btnbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn.ghost{--bb:#CBD6E4;background:linear-gradient(180deg,#FFFFFF,#F3F6FA);color:var(--teal);border:1.5px solid var(--line);
  box-shadow:0 4px 0 var(--bb),0 8px 14px rgba(27,36,51,.08)}
.btn.ghost::after{display:none}
.btn.ghost:active,.btn.ghost.pressed{transform:translateY(3px) scale(1.01,.97);box-shadow:0 1px 0 var(--bb)}
.btn[disabled]{filter:grayscale(.5) opacity(.45);pointer-events:none;animation:none}
.btn[disabled]::after{display:none}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 7px 0 var(--bb),0 16px 26px rgba(20,38,64,.26)}
  .btn.sun:hover{animation:none}
  .btn:hover:active{transform:translateY(4px) scale(1.015,.96);filter:brightness(1);box-shadow:0 1px 0 var(--bb),0 4px 8px rgba(20,38,64,.18)}
  .btn.ghost:hover{box-shadow:0 6px 0 var(--bb),0 12px 18px rgba(27,36,51,.10);transform:translateY(-2px)}}

.card{background:var(--white);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--soft)}

/* ---------- STAGE MAP ---------- */
.hero{padding:22px 18px 6px;text-align:center}
.hero .logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--te-font-display,'Fredoka');font-weight:700;
  font-size:13px;letter-spacing:2px;color:var(--teal-dd);text-transform:uppercase;
  background:#EAF0FB;border:1px solid #C5D2E2;padding:5px 12px;border-radius:99px}
.hero h1{font-size:27px;margin:12px 0 4px;line-height:1.1}
.hero p{color:var(--ink-soft);font-weight:600;margin:0;font-size:14px}
/* course home: drawn by ../../shared/course-home.js (TouchHome); renderMap() sets its sticky offset */

/* ---------- STAGE INTRO / SECTIONS ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:20px;cursor:pointer;flex:none;box-shadow:var(--soft-sm)}
.iconbtn:active{transform:translateY(1px);box-shadow:var(--soft-sm)}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:8px;flex:1;border-radius:9px;background:#E4E9F0}
.steps i.on{background:var(--teal)} .steps i.cur{background:var(--coral)}
.sec-label{display:inline-flex;align-items:center;gap:7px;font-family:var(--te-font-display,'Fredoka');font-weight:700;
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral-d);
  background:#F3E1E6;border:1px solid #E3C4CD;padding:5px 12px;border-radius:99px}
.sec-h{font-size:23px;margin:12px 0 6px;line-height:1.15}
.sec-p{color:var(--ink-soft);font-weight:600;line-height:1.5;font-size:15px}

/* video */
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:linear-gradient(135deg,#1f2937,#0b1220);display:grid;place-items:center;color:#fff;
  border:1px solid var(--line);box-shadow:var(--soft);margin-top:14px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:24px;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.video .vmeta{position:absolute;left:14px;bottom:12px;right:14px;text-align:left}
.video .vmeta b{font-family:var(--te-font-display,'Fredoka');display:block;font-size:15px}
.video .vmeta span{font-size:12px;opacity:.8}
.video .tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);font-size:11px;
  padding:4px 9px;border-radius:99px;font-weight:700}
.video.as-link{text-decoration:none;background-size:cover;background-position:center;cursor:pointer}
.video.as-link::after{content:"";position:absolute;inset:0;background:rgba(10,15,25,.42)}
.video.as-link .play,.video.as-link .tag,.video.as-link .vmeta{position:relative;z-index:1}
.video.as-link .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.placeholder-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px;font-weight:600}
.placeholder-note a{color:var(--sky-d);font-weight:800}

/* learn blocks */
.block{margin-top:14px;padding:16px}
.block h3{font-size:16px;margin-bottom:10px;color:var(--ink)}
.ipa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ipa-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:14px 6px 11px;border-radius:var(--r-md);background:linear-gradient(180deg,#FFFFFF,#FAFBFD);border:1px solid var(--hair);
  box-shadow:var(--soft-sm);cursor:pointer;transition:transform .18s cubic-bezier(.33,1,.68,1), box-shadow .18s}
.ipa-pill:hover{transform:translateY(-1px);box-shadow:var(--soft)}
.ipa-pill:active{transform:translateY(0);box-shadow:var(--soft-sm)}
.ipa-pill b{font-size:22px;color:var(--coral);line-height:1.1;letter-spacing:-.3px} .ipa-pill .w{font-size:13px;color:var(--ink);font-weight:800}
.ipa-pill .sp{font-size:12px;color:var(--sky-d);opacity:.7;margin-top:2px}
.ipa-pill.voiced b{color:var(--plum-d)} .ipa-pill.voiceless b{color:var(--sky-d)}
@media (max-width:380px){ .ipa-grid{grid-template-columns:repeat(3,1fr)} }
.note{margin-top:12px;background:#F8EFDB;border:1px solid #E9D4A3;border-radius:14px;padding:12px 14px;
  font-size:14px;font-weight:700;color:#6F4A12;display:flex;gap:9px;align-items:flex-start}
.quote{margin-top:16px;text-align:center;font-family:var(--te-font-display,'Fredoka');font-weight:600;font-size:20px;color:var(--teal-dd);
  padding:16px;background:#E6F4EE;border:1px dashed var(--teal);border-radius:18px}
.quote small{display:block;font-family:var(--te-font-body,'Nunito');font-weight:700;font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ---------- EXERCISE ENGINE ---------- */
.q-kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
/* language picker (first run) */
.lang-pick{text-align:center;padding-top:48px}
.lang-logo{font-family:var(--te-font-display,'Fredoka');font-weight:700;color:var(--coral);letter-spacing:1px;font-size:14px;margin-bottom:24px}
.lang-title{font-family:var(--te-font-display,'Fredoka');font-weight:700;color:var(--ink);font-size:26px;margin:0 0 6px}
.lang-sub{color:var(--ink-soft);font-weight:600;margin:0 0 28px}
.lang-list{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:0 auto}
.btn.lang-opt{justify-content:flex-start;gap:14px;font-size:18px;padding:18px 22px}
.name-wrap{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:0 auto}
.name-input{font-family:var(--te-font-display,'Fredoka');font-size:18px;font-weight:600;color:var(--ink);text-align:center;
  padding:16px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:none;transition:border-color .15s}
.name-input:focus{border-color:var(--coral)}
.name-input::placeholder{color:#AEB8C6;font-weight:500}
/* top-right switcher + dropdown */
.lang-btn{margin-left:2px}
#langMenu{position:relative;z-index:50}
.lang-menu-backdrop{position:fixed;inset:0;z-index:49}
.lang-menu{position:absolute;right:14px;top:2px;z-index:50;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(27,36,51,.20);padding:6px;min-width:190px}
.lang-menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  font-family:var(--te-font-display,'Fredoka');font-weight:600;font-size:15px;color:var(--ink);padding:11px 12px;border-radius:10px;text-align:left}
.lang-menu-item:hover{background:#F1F5FA}
.lang-menu-item.on{color:var(--coral)}
.q-lvl{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;font-size:10px;letter-spacing:.5px;color:#fff;vertical-align:middle}
.q-lvl.easy{background:#4FAE8A}.q-lvl.medium{background:#3E6FA0}.q-lvl.hard{background:#8B1E3F}
.q-prompt{text-align:center;margin:14px 0 4px}
.q-prompt .big{font-family:var(--te-font-display,'Fredoka');font-weight:700;font-size:34px;line-height:1.1}
.q-prompt .big.ipaword{color:var(--teal-dd)}
.q-sub{text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:4px}
.q-blank{display:inline-block;min-width:34px;border-bottom:4px solid var(--coral);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.opts.wrap{flex-direction:row;flex-wrap:wrap;justify-content:center}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;
  box-shadow:var(--soft-sm);transition:transform .08s,border-color .12s,box-shadow .08s;
  font-weight:800;font-size:18px;color:var(--ink);
}
.opt:active{transform:translateY(1px);box-shadow:var(--soft-sm)}
.opt .key{width:30px;height:30px;border-radius:9px;background:var(--cream);border:1px solid var(--line);
  display:grid;place-items:center;font-family:var(--te-font-display,'Fredoka');font-size:14px;color:var(--ink-soft);flex:none}
.opt.sel{border-color:var(--sky);box-shadow:0 1px 4px rgba(62,111,160,.28);background:#E6EDF5}
.opt.sel .key{background:var(--sky);color:#fff;border-color:var(--sky-d)}
.opt.correct{border-color:var(--good);box-shadow:0 1px 4px rgba(79,174,138,.30);background:#E6F4EE;animation:correctPop .4s cubic-bezier(.2,.7,.3,1)}
.opt.correct .key{background:var(--good);color:#fff;border-color:var(--good-d)}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.wrong{border-color:var(--bad);box-shadow:0 1px 4px rgba(192,64,92,.28);background:#F6E4E8}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad-d)}
.opt.chipopt{width:auto;flex:0 0 auto;font-size:20px;justify-content:center}
.opt.chipopt .key{display:none}
.opt.shake{animation:shake .4s}
/* after answering: option body is settled (default cursor, no press lift),
   but the speaker button inside stays fully tappable so learners can replay
   and compare both sounds freely. */
.opt.answered{cursor:default}
.opt.answered:active{transform:none}
.opt.answered .opt-spk{cursor:pointer}
.opt.answered .opt-spk .spk{filter:none;opacity:1}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.combo{position:absolute;top:54px;left:50%;transform:translateX(-50%);font-family:var(--te-font-display,'Fredoka');font-weight:700;
  color:var(--coral-d);font-size:14px;opacity:0;pointer-events:none}
.combo.show{animation:comboPop 1s ease}
@keyframes comboPop{0%{opacity:0;transform:translateX(-50%) scale(.6)}25%{opacity:1;transform:translateX(-50%) scale(1.1)}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

/* feedback footer */
#feedback{position:sticky;bottom:0;z-index:20;transform:translateY(110%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#feedback.show{transform:none;z-index:26}   /* above #nav: on a page taller than the screen both stick to the bottom, and Continue must win */
.fb-inner{padding:16px 18px calc(18px + env(safe-area-inset-bottom));border-top:1px solid;}
#feedback.ok .fb-inner{background:#E6F4EE;border-color:#C2E2D4}
#feedback.no .fb-inner{background:#F6E4E8;border-color:#E6C2CB}
.fb-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.fb-head .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff;flex:none}
#feedback.ok .fb-head .ic{background:var(--good)} #feedback.no .fb-head .ic{background:var(--bad)}
.fb-head b{font-family:var(--te-font-display,'Fredoka');font-size:18px}
#feedback.ok .fb-head b{color:var(--good-d)} #feedback.no .fb-head b{color:var(--bad-d)}
.fb-head .xpgain{margin-left:auto;font-family:var(--te-font-display,'Fredoka');font-weight:700;color:var(--sun-d);font-size:15px}
.fb-hint{font-size:14px;font-weight:700;color:#8B1E3F;margin-bottom:10px}
#feedback.ok .btn{background:var(--good);box-shadow:var(--shadow) var(--good-d)}

// Teacher: paste real YouTube links here to embed them automatically.
// Per-language video links. zh = Chinese versions (existing); en = English.
// Malay and English UI both use the English video (en). Chinese UI uses zh.
// welcome has no video yet → that stage simply shows no video.
const VIDEOS = {
  welcome:     { zh:"https://youtu.be/UuZCxCoH3ro",  en:"" },
  lesson1:     { zh:"https://youtu.be/ZuSuf3wM4Zg",  en:"https://youtu.be/Da5VesM66v0" },
  diphthongs:  { zh:"https://youtu.be/tf2Udtfs7Ec",  en:"https://youtu.be/VGn47X6erdg" },
  consonants:  { zh:"https://youtu.be/hgpqpdPf46I",  en:"https://youtu.be/bICTwGLTtg8" },
  bonus:       { zh:"https://youtu.be/XkjAZ-JA8eE",  en:"https://youtu.be/ORS_XUlAick" }
};
// resolve the right video URL for the current language.
// zh → Chinese slot; en & ms → English slot. Empty slot = that stage shows no video.
function videoUrl(key){
  const v = VIDEOS[key] || {};
  return (LANG==="zh") ? (v.zh||"") : (v.en||"");
}

// helper builders ----------------------------------------------------
const opt = (label, correct=false) => ({label, correct});
/* 说明文字三语（hint、答对的话、题目说明）。课程资料在脚本载入时就建好，那时 LANG
   还没决定（L() 会碰到 TDZ），而且答错的题会整题 JSON 存进「今天的复习」——
   所以这里存成 {en,zh,ms} 物件，显示时才用 tx() 挑语言。旧存档里的纯英文字串 tx() 照样显示。 */
const T = (en, zh, ms) => ({en, zh, ms});
function tx(v){
  if(v == null) return "";
  if(typeof v === "string") return v;
  return L(v.en, v.zh, v.ms);
}
// choose-IPA-for-word  | ipa-to-word | identify | fill-blank
function ex(o){ return Object.assign({hint:T("Listen for the vowel length, and watch the mouth shape.","注意听元音的长短，也看看嘴型。","Dengar panjang pendek vokal dan perhatikan bentuk mulut.")}, o); }

// IPA units that must be treated as ONE symbol so a target like /ɪ/ is not
// matched inside a diphthong like /eɪ/. Declared up here (not next to the
// sound card) because the question generators below run while the script
// loads and need it.
const IPA_UNITS = ["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə","iː","ɑː","ɔː","uː","ɜː","tʃ","dʒ"];
// "/kəˈlekt/" → ["k","ə","l","e","k","t"]  (stress marks dropped, ascii g → ɡ)
function ipaTokens(tr){
  const body = String(tr||"").replace(/[\/ˈˌ\s]/g,"").replace(/g/g,"ɡ");
  const out=[];
  for(let i=0;i<body.length;){
    const two=body.substr(i,2);
    if(IPA_UNITS.includes(two)){ out.push(two); i+=2; } else { out.push(body[i]); i+=1; }
  }
  return out;
}
// Where do two minimal-pair transcriptions differ? → {pos:"first|middle|last", a, b}
// The old hint said "the sound in the middle" for every pair, which is wrong
// for light/right, they/day (first sound) and leaf/leave, bag/back (last sound).
function pairDiff(ia, ib){
  const A=ipaTokens(ia), B=ipaTokens(ib);
  if(A.length!==B.length) return null;
  const idx=[]; A.forEach((t,i)=>{ if(t!==B[i]) idx.push(i); });
  if(idx.length!==1) return null;
  const i=idx[0];
  return { pos: i===0 ? "first" : (i===A.length-1 ? "last" : "middle"), a:A[i], b:B[i] };
}
const POS_TEXT = {
  first:  T("first","第一个","pertama"),
  middle: T("middle","中间的","di tengah"),
  last:   T("last","最后一个","terakhir")
};
// One word is the other plus a sound at the end (go / goat, walk / walked) —
// the "dropped final consonant" pairs of the Final Consonants stage.
// → {long, short, extra} or null
function extraEnding(p){
  const A=ipaTokens(p.ia), B=ipaTokens(p.ib);
  const aShort = A.length<B.length, S = aShort?A:B, Lg = aShort?B:A;
  if(S.length===Lg.length || !S.every((t,i)=>t===Lg[i])) return null;
  return { short: aShort?p.a:p.b, long: aShort?p.b:p.a, extra: Lg.slice(S.length).join("") };
}
// voiceless → voiced partner. Declared here (not with VOICE_PAIRS further down)
// because pairHint runs while the course data is being built.
const VOICED_OF = {p:"b",t:"d",k:"ɡ",f:"v",θ:"ð",s:"z",ʃ:"ʒ",tʃ:"dʒ"};
function pairHint(p){
  const d = pairDiff(p.ia, p.ib);
  const base = [`“${p.a}” = ${p.ia}`, `“${p.b}” = ${p.ib}`];
  const x = d ? null : extraEnding(p);
  if(x) return T(`${base[0]} and ${base[1]}. “${x.long}” ends with /${x.extra}/; “${x.short}” stops before it. Say that last sound clearly — don't drop it.`,
                 `${base[0]}，${base[1]}。“${x.long}” 结尾多了 /${x.extra}/，“${x.short}” 在它前面就停了。最后那个音要念出来 —— 不要吞掉。`,
                 `${base[0]} dan ${base[1]}. “${x.long}” berakhir dengan /${x.extra}/; “${x.short}” berhenti sebelum itu. Sebut bunyi akhir itu dengan jelas — jangan gugurkan.`);
  if(!d) return T(`${base[0]} and ${base[1]}. Compare them sound by sound.`,
                  `${base[0]}，${base[1]}。一个音一个音比一比。`,
                  `${base[0]} dan ${base[1]}. Bandingkan bunyi demi bunyi.`);
  const P = POS_TEXT[d.pos];
  // a voiceless/voiced ending (bat/bad, rice/rise): the vowel length is the other clue
  const v = d.pos==="last" ? (VOICED_OF[d.a]===d.b ? d.b : VOICED_OF[d.b]===d.a ? d.a : "") : "";
  const len = v ? T(` The vowel before a voiced final sound (/${v}/) is held a little longer — listen for that too.`,
                    ` 在有声的尾音（/${v}/）前面，元音会拉长一点 —— 这也是分辨的线索。`,
                    ` Vokal sebelum bunyi akhir bersuara (/${v}/) disebut sedikit lebih panjang — dengar itu juga.`) : T("","","");
  return T(`${base[0]} and ${base[1]}. Only the ${P.en} sound changes: /${d.a}/ in “${p.a}”, /${d.b}/ in “${p.b}”.${len.en}`,
           `${base[0]}，${base[1]}。只差在${P.zh}音：“${p.a}” 是 /${d.a}/，“${p.b}” 是 /${d.b}/。${len.zh}`,
           `${base[0]} dan ${base[1]}. Hanya bunyi ${P.ms} yang berbeza: /${d.a}/ dalam “${p.a}”, /${d.b}/ dalam “${p.b}”.${len.ms}`);
}

// generators: each returns an array of exercise objects -------------------
function genListen(pairs){                       // listening: hear word → choose it
  return pairs.map(p=>{
    const target = Math.random()<0.5 ? {w:p.a,o:p.b} : {w:p.b,o:p.a};
    const d = pairDiff(p.ia, p.ib), x = d ? null : extraEnding(p);
    const where = d ? T(` — only the ${POS_TEXT[d.pos].en} sound changes (/${d.a}/ vs /${d.b}/)`,
                        ` —— 只差在${POS_TEXT[d.pos].zh}音（/${d.a}/ 和 /${d.b}/）`,
                        ` — hanya bunyi ${POS_TEXT[d.pos].ms} berbeza (/${d.a}/ dan /${d.b}/)`)
                : x ? T(` — “${x.long}” has one more sound at the end: /${x.extra}/`,
                        ` —— “${x.long}” 结尾多了一个音：/${x.extra}/`,
                        ` — “${x.long}” ada satu bunyi lagi di hujung: /${x.extra}/`) : T("","","");
    return ex({kind:"Listen & choose", variant:"listen", word:target.w, sub:"Which word did you hear?",
      options:[opt(target.w,true),opt(target.o)], fam:p.f, gen:true, pair:[p.a,p.b], rpOnly:!!p.rp,
      hint:T(`These two sound close: “${p.a}” and “${p.b}”${where.en}. Tap 🔊 and listen for it.`,
             `“${p.a}” 和 “${p.b}” 听起来很像${where.zh}。点 🔊 再听一次。`,
             `“${p.a}” dan “${p.b}” bunyinya hampir sama${where.ms}. Ketik 🔊 dan dengar sekali lagi.`)});
  });
}
function genPairIPA(pairs){                       // choose correct IPA for one word of the pair
  return pairs.map(p=>{
    const pickA = Math.random()<0.5;
    const w = pickA?p.a:p.b, right = pickA?p.ia:p.ib, wrong = pickA?p.ib:p.ia;
    return ex({kind:"Choose the IPA", prompt:w, options:[opt(right,true),opt(wrong)], fam:p.f, gen:true,
      pair:[p.a,p.b], hint:pairHint(p)});
  });
}
function genReadPair(pairs){                       // IPA → word (minimal-pair confusion)
  return pairs.map(p=>{
    const pickA = Math.random()<0.5;
    const ipa = pickA?p.ia:p.ib, right = pickA?p.a:p.b, wrong = pickA?p.b:p.a, wIpa = pickA?p.ib:p.ia;
    return ex({kind:"Read the IPA", variant:"word", prompt:ipa, options:[opt(right,true),opt(wrong)], fam:p.f, gen:true,

// vocab read/listen: the wrong option is the word's hand-picked confuser (CONFUSE).
// A word with no confuser is skipped rather than given a made-up one.
function vocabRead(list){
  return list.filter(([w])=>confuserOf(w)).map(([w,ipa])=>{
    const [c,cIpa] = confuserOf(w);
    return ex({kind:"Read the IPA", variant:"word", prompt:ipa, options:[opt(w,true),opt(c)], gen:true, vocab:true,
      hint:`${ipa} → “${w}” · ${cIpa} → “${c}”`});
  });
}
function vocabListen(list){
  return list.filter(([w])=>confuserOf(w)).map(([w,ipa])=>{
    const [c,cIpa] = confuserOf(w);
    return ex({kind:"Listen & choose", variant:"listen", word:w, sub:"Which word did you hear?",
      options:[opt(w,true),opt(c)], gen:true, vocab:true,
      hint:T(`“${w}” — ${ipa}. “${c}” sounds different: ${cIpa}. Tap 🔊 to replay.`,
             `“${w}” —— ${ipa}。“${c}” 念成 ${cIpa}，不一样。点 🔊 再听一次。`,
             `“${w}” — ${ipa}. “${c}” berbunyi ${cIpa}, lain sedikit. Ketik 🔊 untuk dengar semula.`)});
  });

function distractors(correct, pool, n){
  const others = pool.filter(x=>x!==correct);
  const out=[]; while(out.length<n && others.length){ out.push(others.splice(Math.floor(Math.random()*others.length),1)[0]); }
  return out;
}
function genDiphIdentify(){

    // a glide that ALSO occurs in the word (download = /aʊ/ + /əʊ/, idea = /aɪ/ + /ɪə/)
    // would be a second correct answer, so it can never be a distractor
    const inWord = ipaTokens(ipa);

function genEndings(list, kind){
  return list.map(([w, ipa, end])=>{
    const body = ipa.slice(0, -(end.length+1));           // "/ˈwɒnt" for "/ˈwɒntɪd/"

      ? { t:T(`the verb ends in a voiceless sound (/${last}/), so -ed is a quiet /t/ — no extra syllable.`,
              `动词结尾是无声的 /${last}/，所以 -ed 念成轻轻的 /t/ —— 不多一个音节。`,
              `kata kerja berakhir dengan bunyi tidak bersuara (/${last}/), jadi -ed ialah /t/ yang perlahan — tiada suku kata tambahan.`),

              `动词结尾是有声的 /${last}/，所以 -ed 念成 /d/ —— 不多一个音节。`,
              `kata kerja berakhir dengan bunyi bersuara (/${last}/), jadi -ed ialah /d/ — tiada suku kata tambahan.`),
          "ɪd":T(`the verb already ends in /${last}/, so -ed adds a syllable: /ɪd/.`,

              `kata kerja sudah berakhir dengan /${last}/, jadi -ed menambah satu suku kata: /ɪd/.`) }[end]
      : { s:T(`the noun ends in a voiceless sound (/${last}/), so -s is /s/.`,
              `名词结尾是无声的 /${last}/，所以 -s 念成 /s/。`,
              `kata nama berakhir dengan bunyi tidak bersuara (/${last}/), jadi -s ialah /s/.`),
          z:T(`the noun ends in a voiced sound (/${last}/), so -s buzzes: /z/.`,
              `名词结尾是有声的 /${last}/，所以 -s 要震：/z/。`,
              `kata nama berakhir dengan bunyi bersuara (/${last}/), jadi -s berdengung: /z/.`),
          "ɪz":T(`the noun ends in a hissing sound (/${last}/), so -s adds a syllable: /ɪz/.`,
              `名词结尾是嘶嘶的 /${last}/，所以 -s 要多一个音节：/ɪz/。`,
              `kata nama berakhir dengan bunyi desis (/${last}/), jadi -s menambah satu suku kata: /ɪz/.`) }[end];
    return ex({kind:"Fill the ending", variant:"fill", word:w, prompt:`${base}__/`, answer:end,

      fam: kind==="ed" ? "-ed ending" : "plural -s ending", gen:true, full:ipa,
      okMsg:T(`Yes! “${w}” = ${ipa}`,`对！“${w}” = ${ipa}`,`Betul! “${w}” = ${ipa}`),
      hint:T(`“${w}” = ${ipa}: ${R.en}`, `“${w}” = ${ipa}：${R.zh}`, `“${w}” = ${ipa}: ${R.ms}`)});
  });
}

// pho·TOG·ra·phy
function stressCaps(chunks, i){ return chunks.map((c,j)=>j===i?c.toUpperCase():c.toLowerCase()).join("·"); }
function stressItem(word, syl, idx, ipa, fam, extra, more){
  const ch = syl.split("|");
  const caps = stressCaps(ch, idx);
  const add = tjoin(extra || T("","",""), ipa.includes("ˌ")
    ? T(" The low mark ˌ shows a lighter second stress."," 下面的 ˌ 表示比较轻的次重音。"," Tanda bawah ˌ menunjukkan tekanan kedua yang lebih ringan.")
    : T("","",""));
  return ex(Object.assign({kind:"Find the stress", variant:"stress", word, sub:"Tap the stressed syllable",
    options:ch.map((c,j)=>opt(c, j===idx)), ordered:true, fam, gen:true, ipa,
    okMsg:T(`Yes! ${caps} ${ipa}`,`对！${caps} ${ipa}`,`Betul! ${caps} ${ipa}`),
    hint:T(`The stress is on “${ch[idx]}”: ${caps} ${ipa}. In IPA the mark ˈ comes just before the stressed syllable.${add.en}`,
           `重音在 “${ch[idx]}”：${caps} ${ipa}。IPA 里的 ˈ 就放在重读音节的前面。${add.zh}`,
           `Tekanan pada “${ch[idx]}”: ${caps} ${ipa}. Dalam IPA, tanda ˈ diletakkan betul-betul sebelum suku kata yang ditekan.${add.ms}`)}, more||{}));
}
const tjoin = (a,b)=>T((a.en||"")+(b.en||""),(a.zh||"")+(b.zh||""),(a.ms||"")+(b.ms||""));
function genStress2(){ return STRESS_2.map(([w,s,i,ipa,r])=>stressItem(w,s,i,ipa,"stress: 2 syllables", tjoin(STRESS_RULE[r]||T("","",""), STRESS_NOTE[w]||T("","","")))); }
function genStressLong(){ return STRESS_LONG.map(([w,s,i,ipa])=>stressItem(w,s,i,ipa,"stress: long words", STRESS_NOTE[w])); }
function genStressNV(){
  return STRESS_NV.map(([w,pos,s,i,ipa,phrase])=>
    stressItem(w,s,i,ipa,"stress: noun or verb", STRESS_RULE[pos], {pos, phrase, say:phrase}));
}

{
  id:"s5", title:"Final Consonants", short:"Finals", icon:"🏁", color:"coral", isNew:true,
  learn:{
    heading:T("Finish Every Word","把每个字念完整","Sebut Setiap Perkataan Hingga Habis"),
    intro:T("In English the <b>last sound</b> often carries the meaning: <b>bat, bad, back</b> are three different words, and <b>go</b> is not <b>goat</b>. Don't drop the final sound or swallow it — close it clearly. Before a <b>voiced</b> ending (/b d ɡ z v/) the vowel is held a little <b>longer</b>. And don't cut the word off in your throat: bat and back must sound different.",
            "英文里<b>最后一个音</b>常常决定意思：<b>bat、bad、back</b> 是三个不同的字，<b>go</b> 也不是 <b>goat</b>。字尾的音不要省掉、不要吞掉 —— 要清楚地收好。在<b>有声</b>的尾音（/b d ɡ z v/）前面，元音会拉<b>长</b>一点。也不要在喉咙里一卡就停：bat 和 back 听起来一定要不一样。",
            "Dalam bahasa Inggeris, <b>bunyi terakhir</b> selalunya membawa makna: <b>bat, bad, back</b> ialah tiga perkataan berbeza, dan <b>go</b> bukan <b>goat</b>. Jangan gugurkan atau telan bunyi akhir — tutup dengan jelas. Sebelum hujung yang <b>bersuara</b> (/b d ɡ z v/), vokal ditahan sedikit <b>lebih lama</b>. Jangan juga putuskan bunyi di kerongkong: bat dan back mesti berbunyi berbeza."),
    groups:[
      {title:T("Stops at the end","字尾的塞音","Bunyi henti di hujung"), cls:"", items:[["t","bat"],["d","bad"],["k","back"],["p","cap"],["b","cab"],["ɡ","bag"]]},
      {title:T("Hiss or buzz at the end","字尾：嘶嘶还是嗡嗡","Desis atau dengung di hujung"), cls:"", items:[["s","rice"],["z","rise"],["f","safe"],["v","save"]]}
    ],
    cards:[
      {title:T("-ed endings: /t/, /d/ or /ɪd/","-ed 的三种念法：/t/、/d/、/ɪd/","Hujung -ed: /t/, /d/ atau /ɪd/"),
       html:T("<b>/t/</b> after a voiceless sound: walked, stopped, washed<br><b>/d/</b> after a voiced sound (vowels too): played, cleaned, lived<br><b>/ɪd/</b> after /t/ or /d/: wanted, needed — one extra syllable",
              "<b>/t/</b>：前面是无声的音 —— walked、stopped、washed<br><b>/d/</b>：前面是有声的音（元音也算）—— played、cleaned、lived<br><b>/ɪd/</b>：前面是 /t/ 或 /d/ —— wanted、needed，多一个音节",
              "<b>/t/</b> selepas bunyi tidak bersuara: walked, stopped, washed<br><b>/d/</b> selepas bunyi bersuara (termasuk vokal): played, cleaned, lived<br><b>/ɪd/</b> selepas /t/ atau /d/: wanted, needed — satu suku kata tambahan")},
      {title:T("Plural -s: /s/, /z/ or /ɪz/","复数 -s 的三种念法：/s/、/z/、/ɪz/","Jamak -s: /s/, /z/ atau /ɪz/"),
       html:T("<b>/s/</b> after a voiceless sound: cats, books, cups<br><b>/z/</b> after a voiced sound (vowels too): dogs, bags, days<br><b>/ɪz/</b> after a hissing sound (/s z ʃ ʒ tʃ dʒ/): buses, watches, pages — one extra syllable",
              "<b>/s/</b>：前面是无声的音 —— cats、books、cups<br><b>/z/</b>：前面是有声的音（元音也算）—— dogs、bags、days<br><b>/ɪz/</b>：前面是嘶嘶的音（/s z ʃ ʒ tʃ dʒ/）—— buses、watches、pages，多一个音节",
              "<b>/s/</b> selepas bunyi tidak bersuara: cats, books, cups<br><b>/z/</b> selepas bunyi bersuara (termasuk vokal): dogs, bags, days<br><b>/ɪz/</b> selepas bunyi desis (/s z ʃ ʒ tʃ dʒ/): buses, watches, pages — satu suku kata tambahan")}

{
  id:"s6", title:"Word Stress", short:"Stress", icon:"🥁", color:"sky", isNew:true,
  learn:{
    heading:T("The Beat of a Word","单词的节奏","Rentak Perkataan"),
    intro:T("Every English word with two or more syllables has <b>one stressed syllable</b>: it is <b>longer, louder and a little higher</b>. The other syllables get weaker, often to /ə/. In IPA the mark <b>ˈ</b> goes just <b>before</b> the stressed syllable: /fəˈtɒɡrəfi/ = pho-TOG-ra-phy. Long words can also have a lighter second stress, marked ˌ: /ˌedʒuˈkeɪʃn/.",
            "英文里两个音节以上的字，都有<b>一个重读的音节</b>：它念得<b>比较长、比较大声、音调也高一点</b>。其他音节会变弱，常常弱成 /ə/。在 IPA 里，<b>ˈ</b> 这个符号放在重读音节的<b>前面</b>：/fəˈtɒɡrəfi/ = pho-TOG-ra-phy。长的字还可能有一个比较轻的次重音，用 ˌ 表示：/ˌedʒuˈkeɪʃn/。",
            "Setiap perkataan Inggeris dengan dua suku kata atau lebih ada <b>satu suku kata yang ditekan</b>: ia <b>lebih panjang, lebih kuat dan sedikit lebih tinggi</b>. Suku kata lain menjadi lemah, selalunya /ə/. Dalam IPA, tanda <b>ˈ</b> diletakkan betul-betul <b>sebelum</b> suku kata yang ditekan: /fəˈtɒɡrəfi/ = pho-TOG-ra-phy. Perkataan panjang boleh ada tekanan kedua yang lebih ringan, ditanda ˌ: /ˌedʒuˈkeɪʃn/."),
    cards:[
      {title:T("Two syllables: noun or verb?","两个音节：名词还是动词？","Dua suku kata: kata nama atau kata kerja?"),
       html:T("Most two-syllable <b>nouns and adjectives</b> stress the <b>first</b> syllable: <b>DOC</b>tor, <b>HAP</b>py.<br>Most two-syllable <b>verbs</b> stress the <b>second</b>: be<b>GIN</b>, re<b>LAX</b>.<br>Some words change with their job: a <b>PRES</b>ent → to pre<b>SENT</b>, a <b>REC</b>ord → to re<b>CORD</b>.",
              "大部分两个音节的<b>名词和形容词</b>，重音在<b>第一个</b>音节：<b>DOC</b>tor、<b>HAP</b>py。<br>大部分两个音节的<b>动词</b>，重音在<b>第二个</b>音节：be<b>GIN</b>、re<b>LAX</b>。<br>有些字的重音会跟着词性改变：a <b>PRES</b>ent（礼物）→ to pre<b>SENT</b>（介绍、呈交），a <b>REC</b>ord（纪录）→ to re<b>CORD</b>（录下来）。",
              "Kebanyakan <b>kata nama dan kata sifat</b> dua suku kata ditekan pada suku kata <b>pertama</b>: <b>DOC</b>tor, <b>HAP</b>py.<br>Kebanyakan <b>kata kerja</b> dua suku kata ditekan pada suku kata <b>kedua</b>: be<b>GIN</b>, re<b>LAX</b>.<br>Sesetengah perkataan berubah mengikut fungsinya: a <b>PRES</b>ent (hadiah) → to pre<b>SENT</b> (membentangkan), a <b>REC</b>ord (rekod) → to re<b>CORD</b> (merakam).")},
      {title:T("Longer words: learn them by ear","比较长的字：用耳朵记","Perkataan panjang: belajar melalui pendengaran"),
       html:T("<b>COM</b>fortable (not comFORtable) · de<b>VEL</b>op · <b>PHO</b>tograph → pho<b>TOG</b>raphy → photo<b>GRAPH</b>ic · <b>MAN</b>ager · po<b>LICE</b> · ho<b>TEL</b>",
              "<b>COM</b>fortable（不是 comFORtable）· de<b>VEL</b>op · <b>PHO</b>tograph → pho<b>TOG</b>raphy → photo<b>GRAPH</b>ic · <b>MAN</b>ager · po<b>LICE</b> · ho<b>TEL</b>",
              "<b>COM</b>fortable (bukan comFORtable) · de<b>VEL</b>op · <b>PHO</b>tograph → pho<b>TOG</b>raphy → photo<b>GRAPH</b>ic · <b>MAN</b>ager · po<b>LICE</b> · ho<b>TEL</b>")}
    ],
    note:T("Tip: tap the table on the stressed syllable while you say the word — one strong tap, the rest soft.",
           "小提示：一边念一边在重读的音节上拍一下桌子 —— 重的拍一下，其他轻轻带过。",
           "Petua: ketuk meja pada suku kata yang ditekan sambil menyebut perkataan — satu ketukan kuat, yang lain perlahan.")

    // which transcription has the stress in the right place

      hint:T("pho-TOG-ra-phy: /fəˈtɒɡrəfi/. The ˈ sits before “tog”, and the first syllable weakens to /fə/. PHOtograph moves the stress to the front.","pho-TOG-ra-phy：/fəˈtɒɡrəfi/。ˈ 在 “tog” 前面，第一个音节弱成 /fə/。PHOtograph 的重音才在最前面。","pho-TOG-ra-phy: /fəˈtɒɡrəfi/. Tanda ˈ sebelum “tog”, dan suku kata pertama menjadi lemah /fə/. PHOtograph pula ditekan di hadapan.")}),
    ex({kind:"Choose the IPA", prompt:"comfortable", fam:"stress: long words", options:[opt("/ˈkʌmftəbl/",true),opt("/kʌmˈfɔːtəbl/")],
      hint:T("COMF-tə-bl: /ˈkʌmftəbl/. The stress is on the first syllable and the “for” almost disappears. comFORtable is a very common mistake.","COMF-tə-bl：/ˈkʌmftəbl/。重音在第一个音节，“for” 几乎听不到。念成 comFORtable 是很常见的错误。","COMF-tə-bl: /ˈkʌmftəbl/. Tekanan pada suku kata pertama dan “for” hampir hilang. comFORtable ialah kesilapan yang sangat biasa.")}),
    ex({kind:"Choose the IPA", prompt:"develop", fam:"stress: long words", options:[opt("/dɪˈveləp/",true),opt("/ˈdevələp/")],

    ex({kind:"Choose the IPA", prompt:"hotel", fam:"stress: 2 syllables", options:[opt("/həʊˈtel/",true),opt("/ˈhəʊtel/")],
      hint:T("ho-TEL: /həʊˈtel/. A noun, but the stress is on the second syllable — an exception to the usual rule.","ho-TEL：/həʊˈtel/。是名词，但重音在第二个音节 —— 一般规则的例外。","ho-TEL: /həʊˈtel/. Kata nama, tetapi tekanan pada suku kata kedua — pengecualian kepada peraturan biasa.")}),
    ex({kind:"Choose the IPA", prompt:"manager", fam:"stress: long words", options:[opt("/ˈmænɪdʒə/",true),opt("/məˈnædʒə/")],
      hint:T("MAN-a-ger: /ˈmænɪdʒə/. The stress is on the first syllable, not maNAger.","MAN-a-ger：/ˈmænɪdʒə/。重音在第一个音节，不是 maNAger。","MAN-a-ger: /ˈmænɪdʒə/. Tekanan pada suku kata pertama, bukan maNAger.")}),
    ex({kind:"Choose the IPA", prompt:"police", fam:"stress: 2 syllables", options:[opt("/pəˈliːs/",true),opt("/ˈpəʊliːs/")],
      hint:T("po-LICE: /pəˈliːs/. The first syllable is a weak /pə/; the long /iː/ carries the stress.","po-LICE：/pəˈliːs/。第一个音节是弱的 /pə/，重音在长的 /iː/。","po-LICE: /pəˈliːs/. Suku kata pertama ialah /pə/ yang lemah; /iː/ yang panjang membawa tekanan.")}),
    // noun or verb: the prompt says which, the 🔊 says it in a phrase

      options:[opt("/rɪˈkɔːd/",true),opt("/ˈrekɔːd/")],
      hint:T("The verb is re-CORD /rɪˈkɔːd/ (to record a video). The noun is REC-ord /ˈrekɔːd/ (a world record).","动词是 re-CORD /rɪˈkɔːd/（to record a video）。名词是 REC-ord /ˈrekɔːd/（a world record）。","Kata kerja ialah re-CORD /rɪˈkɔːd/ (to record a video). Kata nama ialah REC-ord /ˈrekɔːd/ (a world record).")}),
    ex({kind:"Choose the IPA", prompt:"present", promptText:T("present (noun)","present（名词）","present (kata nama)"), say:"a birthday present", fam:"stress: noun or verb",
      options:[opt("/ˈpreznt/",true),opt("/prɪˈzent/")],
      hint:T("The noun is PRES-ent /ˈpreznt/ (a birthday present). The verb is pre-SENT /prɪˈzent/ (to present a report).","名词是 PRES-ent /ˈpreznt/（a birthday present）。动词是 pre-SENT /prɪˈzent/（to present a report）。","Kata nama ialah PRES-ent /ˈpreznt/ (a birthday present). Kata kerja ialah pre-SENT /prɪˈzent/ (to present a report).")}),

function touchStreak(){
  const today = new Date().toDateString();

    const d = dayDiff(S.lastActive, today);
    S.streak = d===1 ? S.streak+1 : 1;
    S.lastActive = today;
  }
}

/* =====================================================================
   4. XP & LEVEL SYSTEM
   ===================================================================== */
/* 升到第 n 级要累积的 XP：第 1 级从 0 开始，150 升第 2 级，450 升第 3 级……
   原本是 75*n*(n+1)，第 1 级的起点变成 150，0 XP 的学生看到「-150 / 300 XP」（2026-09-24 修） */
function levelThreshold(n){ return 75*n*(n-1); }
function levelInfo(xp){
  let lvl=1; while(xp >= levelThreshold(lvl+1)) lvl++;
  const cur = levelThreshold(lvl), next = levelThreshold(lvl+1);
  return {lvl, into:xp-cur, span:next-cur, pct:Math.min(1,(xp-cur)/(next-cur))};
}
function awardXP(amount, atEl){
  const before = levelInfo(S.xp).lvl;
  S.xp += amount;
  touchDaily();
  S.todayXP += amount;                         // PRIORITY 3: daily goal progress
  const after = levelInfo(S.xp).lvl;
  if(atEl) xpFloat(amount, atEl);
  renderHUD();
  if(after>before) levelUp(after);
  if(!S.goalHitToday && S.todayXP>=S.dailyGoal){
    S.goalHitToday=true; setTimeout(goalReached, 600);
  }
}
function goalReached(){
  confetti(70); sfx("reward");
  const d=document.createElement("div"); d.className="lvlup"; d.style.background="var(--sun)"; d.style.color="#5A3A1E";
  d.innerHTML="🎯 "+L("Daily goal reached!","今天的目标达成了！","Matlamat harian tercapai!"); document.getElementById("fx").appendChild(d);
  setTimeout(()=>d.remove(),1700);
}

function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, t0, dur, type="sine", vol=.13){
  const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const now=c.currentTime+t0; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+.02);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur); o.start(now); o.stop(now+dur+.02);
}
function sfx(kind){
  if(!SOUND) return;
  if(kind==="ok"){ tone(660,0,.12,"triangle"); tone(990,.09,.16,"triangle"); }
  else if(kind==="no"){ tone(200,0,.18,"sawtooth",.09); }
  else if(kind==="reward"){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.25,"triangle",.12)); }
  else if(kind==="tap"){ tone(440,0,.05,"sine",.05); }
}

/* =====================================================================
   PRONUNCIATION AUDIO ENGINE  (MVP)
   ---------------------------------------------------------------------
   NOTE: This is NOT real human-recorded pronunciation. It uses the
   browser's built-in SpeechSynthesis to READ WORDS CLEARLY so beginners
   can train their ears. Each playable item carries an optional `src`
   (an MP3 URL). When a teacher later drops in real recordings:
        playAudio("sheep", "audio/sheep.mp3")
   the MP3 plays; otherwise we fall back to SpeechSynthesis automatically.
   Raw IPA symbols are never spoken — we always speak the EXAMPLE WORD.
   ===================================================================== */
const Audio$ = {
  ready:false, voice:null, current:null,
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = ()=>{
      const vs = speechSynthesis.getVoices();
      if(!vs.length) return;
      // Every transcription in this course is British RP, so a British voice
      // first; then other non-American English (AU/NZ/IE/IN/ZA keep more of the
      // RP vowel contrasts); American last, because it merges cot/caught and
      // says heart/car with an r. Android reports "en_GB", hence [-_].
      // Until pre-recorded mp3s replace TTS (shared/voice.js), the voice is
      // whatever the learner's phone has — buildQueue() skips the listening
      // items for RP-only contrasts when this is not an en-GB voice.
      const en = re => vs.find(v=>re.test(v.lang));
      this.voice =
        vs.find(v=>/en[-_]GB/i.test(v.lang) && /google|natural|female/i.test(v.name)) ||
        en(/en[-_]GB/i) || en(/en[-_](AU|NZ|IE)/i) || en(/en[-_](IN|ZA)/i) ||
        vs.find(v=>/^en/i.test(v.lang) && !/en[-_]US/i.test(v.lang)) ||
        en(/en[-_]US/i) || vs[0];
      this.ready = true;
    };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  // true only when TTS will speak with a British voice (see the order above)
  isBritish(){ return !!(this.voice && /en[-_]GB/i.test(this.voice.lang)); },
  // word: text to speak | src: optional MP3 URL (future teacher audio)
  play(word, src){
    this._seq = {};                            // invalidate any pending phoneme→word timers
    if(src){                                   // real audio file takes priority
      try{
        const a = new Audio(src);
        a.play().catch(()=>this.speak(word));   // network/format issue → fallback
        return;
      }catch(e){ /* fall through to TTS */ }
    }
    this.speak(word);
  },
  speak(word){
    if(!word || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();                 // stop overlaps, allow rapid replay
      const u = new SpeechSynthesisUtterance(String(word));
      if(this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || "en-GB";
      u.rate = 0.78;                            // slower, beginner-friendly
      u.pitch = 1.0; u.volume = 1.0;
      this.current = u; speechSynthesis.speak(u);
    }catch(e){}
  },
  // speak several parts in order with a clear PAUSE between them
  // (e.g. phoneme sound → beat of silence → the word).
  // onDone (optional): called once after the last part has been spoken — the
  // Say it step uses it to play the learner's own recording right after the model
  speakSeq(parts, gapMs, onDone){
    const list = (parts||[]).filter(Boolean);
    if(!("speechSynthesis" in window) || !list.length){ if(onDone) onDone(); return; }
    const gap = gapMs==null ? 450 : gapMs;
    try{
      speechSynthesis.cancel();
      // speak + resume() — Chrome/Android can stay paused after cancel()
      // and silently drop the utterance; resume() unsticks it.
      const speakSynthSafe = (u)=>{ speechSynthesis.speak(u); try{ speechSynthesis.resume(); }catch(e){} };
      const mk = (text, rate)=>{
        const u = new SpeechSynthesisUtterance(String(text));
        if(this.voice) u.voice = this.voice;
        u.lang = (this.voice && this.voice.lang) || "en-GB";
        u.rate = rate; u.pitch = 1.0; u.volume = 1.0;
        return u;
      };
      const seq = this._seq = {}; // token: a newer tap invalidates pending timers
      const speakAt = (i)=>{
        if(this._seq!==seq || i>=list.length) return;
        // each part may be a plain string or [text, rate]
        const part = list[i];
        const text = Array.isArray(part) ? part[0] : part;
        const rate = Array.isArray(part) ? part[1] : (i===0?0.7:0.78);
        const u = mk(text, rate);
        let advanced = false;
        const next = ()=>{ if(advanced) return; advanced=true;
          if(i+1<list.length) setTimeout(()=>speakAt(i+1), gap);
          else if(onDone && this._seq===seq) setTimeout(onDone, 250); };
        u.onend = next;
        // fallback: if onend never fires (some engines), advance after an estimate
        setTimeout(next, 1200 + String(text).length*90);
        speakSynthSafe(u);
      };
      // KEY FIX: Chrome drops an utterance queued in the same tick as cancel()
      // (the phoneme was being swallowed). A short beat lets cancel settle.
      setTimeout(()=>speakAt(0), 80);
    }catch(e){}
  }
};

// letter names). Synthesize them as filtered noise — physically what /s/ is.
const NOISE_SAY = {
  "s": {type:"highpass", freq:5200, dur:0.5, vol:0.5}    // bright hiss, no voicing

function playNoise(spec){
  const ctx = ac(); if(!ctx) return spec.dur*1000;
  try{
    const n = Math.floor(ctx.sampleRate * spec.dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;       // white noise
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = spec.type; filt.frequency.value = spec.freq;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(spec.vol, t+0.04);     // soft attack
    g.gain.setValueAtTime(spec.vol, t+spec.dur-0.12);
    g.gain.linearRampToValueAtTime(0.0001, t+spec.dur);   // soft release
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+spec.dur);
  }catch(e){}
  return spec.dur*1000;
}

function playWord(word, src, el, ipa){
  sfx("tap");

    const anchor = PHONEME_SAY[ipa];          // [text, rate]
    const sameWord = anchor[0].toLowerCase() === String(word||"").toLowerCase();
    // anchor word demonstrates the target sound; if the tile's example word is
    // different, play it second (anchor → pause → example). If identical, the
    // single clear anchor play IS the demonstration (no robotic double-read).
    if(sameWord || !word){
      Audio$.speakSeq([anchor]);
    } else {
      Audio$.speakSeq([anchor, word]);
    }
  } else {
    Audio$.play(word, src);
  }
  if(el){ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}

  "uː":"IPA Chart - /uː/.mp3", "ɜː":"IPA Chart - /ɜː/.mp3",
  // diphthongs
  "eɪ":"IPA Chart - /eɪ/.mp3", "aɪ":"IPA Chart - /aɪ/.mp3", "ɔɪ":"IPA Chart - /ɔɪ/.mp3",
  "aʊ":"IPA Chart - /aʊ/.mp3", "əʊ":"IPA Chart - /əʊ/.mp3", "ɪə":"IPA Chart - /ɪə/.mp3",
  "eə":"IPA Chart - /eə/.mp3", "ʊə":"IPA Chart - /ʊə/.mp3",
  // voiceless consonants
  "p":"IPA Chart - /p/.mp3", "t":"IPA Chart - /t/.mp3", "k":"IPA Chart - /k/.mp3",
  "f":"IPA Chart - /f/.mp3", "θ":"IPA Chart - /θ/.mp3", "s":"IPA Chart - /s/.mp3",
  "ʃ":"IPA Chart - /ʃ/.mp3", "tʃ":"IPA Chart - /tʃ/.mp3", "h":"IPA Chart - /h/.mp3",
  // voiced consonants
  "b":"IPA Chart - /b/.mp3", "d":"IPA Chart - /d/.mp3", "ɡ":"IPA Chart - /ɡ/.mp3",
  "v":"IPA Chart - /v/.mp3", "ð":"IPA Chart - /ð/.mp3", "z":"IPA Chart - /z/.mp3",
  "ʒ":"IPA Chart - /ʒ/.mp3", "dʒ":"IPA Chart - /dʒ/.mp3", "m":"IPA Chart - /m/.mp3",
  "n":"IPA Chart - /n/.mp3", "ŋ":"IPA Chart - /ŋ/.mp3", "l":"IPA Chart - /l/.mp3",
  "r":"IPA Chart - /r/.mp3", "w":"IPA Chart - /w/.mp3", "j":"IPA Chart - /j/.mp3"
};
// Set a sound's value to true (or rely on AUDIO_AVAILABLE) once its mp3 exists.
// Empty = no recording yet → TTS fallback is used. NO recordings are bundled now.
const PHONEME_AUDIO = {};
// Resolve the recording URL for a sound, or "" if none is active yet.
function phonemeAudioSrc(ipa){
  // explicit override wins (e.g. PHONEME_AUDIO["ɪ"]="custom.mp3")
  if(PHONEME_AUDIO[ipa]) return PHONEME_AUDIO[ipa];
  // otherwise use the canonical file IF a directory has been configured
  if(AUDIO_DIR && PHONEME_AUDIO_FILES[ipa]) return AUDIO_DIR + PHONEME_AUDIO_FILES[ipa];
  return "";
}
// PRIORITY RULE: human-recorded IPA audio ALWAYS wins over TTS. If browser TTS
// cannot produce a proper isolated IPA sound, the PHONEME_AUDIO hook lets us
// drop in human recordings later without changing the system.
/* The isolated-sound TTS cues (PHONEME_ISO) were removed 2026-09-24: browser TTS
   cannot say a bare phoneme, and the spellings it was fed came out wrong —
   /ɪ/ as "ee", /ʌ/ and /ɑː/ both "ah", /ə/ and /ɜː/ both "err", /ð/ "dher".
   A learner copying those learns the wrong vowel. Until real recordings exist
   the Listen button plays the sound's anchor WORD (PHONEME_SAY, e.g. /ɪ/ →
   "ship"), which TTS does say correctly. Recordings go in the reserved
   PHONEME_AUDIO / AUDIO_DIR slots above (planned: pre-generated mp3s through
   shared/voice.js) and win automatically once present. */
function playPhoneme(ipa){
  sfx("tap");
  const src = phonemeAudioSrc(ipa);
  if(src){ Audio$.play(null, src); return; }     // human recording ALWAYS wins
  const anchor = PHONEME_SAY[ipa];
  if(anchor) Audio$.speakSeq([anchor]);          // the example word, never a fake bare sound
}
// clean SVG speaker glyph (replaces plain emoji for a more tappable look)
const SPK_SVG = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 4 15 8 15 13 19 13 5 8 9" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
// small reusable speaker control (a SPAN so it can live inside .opt buttons)
function speaker(word, src, extra){
  if(!word) return "";
  const s = src ? ` data-src="${src}"` : "";
  return `<span class="spk ${extra||''}" role="button" data-action="speak" data-word="${word}"${s} aria-label="Play ${word}">${SPK_SVG}</span>`;
}

/* ---------- SOUND REFERENCE CARD ----------
   Teaching principle: the learner ALWAYS hears the target sound first, then
   sees how that sound appears in common English words. This is a reference
   card, not a quiz — no auto-advance, no click limit, replay freely.        */
// IPA_UNITS (two-character symbols) is declared with the content model at the top.
// normalise look-alike glyphs (script-ɡ U+0261 vs ascii g) so matching works
function ipaNorm(ch){ return ch==="ɡ" ? "g" : ch; }
// Wrap the FIRST occurrence of the target sound inside a transcription with a
// highlight span, so learners see exactly where the sound appears in the word.
function ipaHighlight(tr, target){
  if(!tr || !target) return tr||"";
  const hasSlash = tr.startsWith("/");
  const body = tr.replace(/^\/|\/$/g,"");
  const tgt = Array.from(target).map(ipaNorm).join("");
  // tokenise into IPA units (2-char units first), keeping stress/length marks
  const toks=[];
  for(let i=0;i<body.length;){
    const two=body.substr(i,2);
    if(IPA_UNITS.includes(two)){ toks.push(two); i+=2; }
    else { toks.push(body[i]); i+=1; }
  }
  let done=false;
  const out=toks.map(t=>{
    const tn = Array.from(t).map(ipaNorm).join("");
    if(!done && tn===tgt){ done=true; return `<span class="tgt">${t}</span>`; }
    return t;
  }).join("");
  return (hasSlash?"/":"")+out+(hasSlash?"/":"");
}

// The course home is drawn by the shared layout (../../shared/course-home.js,
// Marco 2026-09-24: every course opens on Pre-Beginner's layout). This function
// only decides IPA's content — which stage is next, what a tap opens — and hands
// the layout translated strings.
//
// Band = a stage, in the course's display order. Coin = a step of that stage as
// the stage flow runs it (Watch → Learn → Exercises); the exercises are the
// stage's test, so they are the BOSS coin. Watch appears only when the stage has
// a video in the current language (the same test startStage() uses). Progress is
// saved per stage, not per step, so a step's state is read from the stage:
// completed → every step done; practised (a run below the pass mark) → Watch and
// Learn done, the exercises still to pass.
// The coin's icon says the kind of step. Say it is not a coin: its speaking
// items are slotted inside the Exercises run (withSayIt), not a step of their own.
function stageSteps(s){
  const steps = [];
  if(s.video && ytId(videoUrl(s.video.key))) steps.push({step:"video", icon:"play", label:L("Watch","看影片","Tonton")});
  if(s.learn) steps.push({step:"learn", icon:"book", label:L("Learn","学","Belajar")});
  steps.push({step:"quiz", icon:"trophy", label:L("Exercises","练习","Latihan"), boss:true});
  return steps;
}
// The unit's Guide (the shared layout's guidebook sheet), built only from what
// the stage already teaches — nothing written for it:
//   phrases = the Learn page's sound grid (symbol + example word), a few from
//             each group in turn up to 10, the line under each being the
//             symbol and its short description (SOUND_DESC, the wording the
//             exercise feedback uses); a stage with no grid (Word Stress) uses
//             its Say it words and their IPA instead
//   tips    = the Learn page's note and rule cards, or the mindset bullets for
//             Welcome, then the Say it mouth instructions, 5 at most
// Sound goes through playWord(), the same call as the Learn page's pills.
const GUIDE_PHRASES = 10, GUIDE_TIPS = 5;
const plainText = h => String(h||"").replace(/<br\s*\/?>/gi," · ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim();
function stageGuide(s){
  const LN = s.learn || {};
  let phrases = [];
  if(LN.groups){
    const lists = LN.groups.map(g=>g.items.slice());
    while(phrases.length<GUIDE_PHRASES && lists.some(l=>l.length)){
      for(const l of lists){ if(l.length && phrases.length<GUIDE_PHRASES) phrases.push(l.shift()); }
    }
    phrases = phrases.map(([sym, word])=>{
      // SOUND_DESC ends with its own example "(ship)"; the word is already the headline
      const d = soundDesc(sym).replace(/\s*[（(][^()（）]*[)）]\s*$/, "");
      return { en:word, tr:`/${sym}/${d ? " · "+d : ""}`, say:()=>playWord(word, "", null, sym) };
    });
  } else {
    phrases = (s.say||[]).filter(p=>p.w.length && s.id!=="s0").slice(0, GUIDE_PHRASES).map(p=>({
      en:p.w.join(" · "), tr:p.ipa.join(" · "), say:()=>{ sfx("tap"); Audio$.speakSeq(p.tts || p.w); }
    }));
  }
  let tips = [];
  if(LN.bullets) tips.push(...LN.bullets.map(b=>plainText(trLearn(b[1]))));
  if(LN.note) tips.push(plainText(tl(LN.note)));
  if(LN.cards) tips.push(...LN.cards.map(c=>`${plainText(tl(c.title))}: ${plainText(tl(c.html))}`));
  if(s.id!=="s0") tips.push(...(s.say||[]).map(p=>tx(p.tip)));
  tips = tips.filter(Boolean).slice(0, GUIDE_TIPS);
  return { phrases, tips };
}
// open a stage at one of its steps; "video" (or the first step) is the ordinary entry
function openStageAt(id, step){
  startStage(id);
  if(!session || session.stageId!==id) return;
  if(step==="learn" && session.step==="video"){ session.step="learn"; render(); window.scrollTo(0,0); }
  else if(step==="quiz" && session.step!=="quiz"){ session.step="quiz"; session.qi=0; S.combo=0; renderHUD(); render(); window.scrollTo(0,0); }
}

function cycleGoal(){ const order=[20,50,100]; S.dailyGoal = order[(order.indexOf(S.dailyGoal)+1)%order.length]; save(); renderHUD(); renderMap(); }
function renderMap(){
  const hadOldProgress = ["s1","s2","s3","s4"].some(id=>S.stages[id]?.completed);
  const goalPct = Math.min(100, Math.round((S.todayXP/Math.max(1,S.dailyGoal))*100));
  // COURSE PROGRESS — computed from completed stages (display only, no logic change)
  const totalStages = COURSE.length;
  const doneStages = COURSE.filter(s=>S.stages[s.id]?.completed).length;
  const coursePct = Math.round((doneStages/totalStages)*100);
  // next stage to continue = first unlocked-but-not-completed stage
  const nextStage = COURSE.find(s=>isUnlocked(s.id) && !S.stages[s.id]?.completed)
                 || COURSE.find(s=>!S.stages[s.id]?.completed) || COURSE[COURSE.length-1];
  const allDone = doneStages===totalStages;

  const sections = COURSE.map((s,i)=>{
    const st = S.stages[s.id]||{};
    const steps = stageSteps(s);
    const isNext = !allDone && nextStage.id===s.id;
    // the step to start from: the exercises once the stage has been practised, else the first step
    const goIdx = isNext ? (st.practised ? steps.length-1 : 0) : -1;
    // a unit added after this learner had already passed stages of the old course
    const fresh = s.isNew && !st.completed && hadOldProgress;
    const where = i===0 ? L("Start here","从这里开始","Mula di sini") : L(`Stage ${i}`,`第 ${i} 关`,`Peringkat ${i}`);
    const nodes = steps.map((x,j)=>{
      const done = st.completed || (st.practised && !x.boss);
      const practised = x.boss && !st.completed && !!st.practised;
      // the popover line; it also carries what the old continue card used to say
      let sub = `${where} · ${L(`Step ${j+1} of ${steps.length}`,`第 ${j+1} 步，共 ${steps.length} 步`,`Langkah ${j+1} daripada ${steps.length}`)}`;

      return {
        label:x.label, sub, icon:x.icon, boss:!!x.boss,
        state: done ? "done" : (j===goIdx ? "go" : "avail"),   // adult system: no locked state
        practised,
        flag: j===goIdx ? L("START","从这里","MULA") : "",
        tag: fresh && j===0 ? L("NEW","新","BARU") : "",
        onClick: ()=>openStageAt(s.id, x.step)
      };
    });
    const n = nodes.filter(x=>x.state==="done").length;
    const g = stageGuide(s);
    return { kicker:`${where} · ${n}/${nodes.length}`, title:trStage(s.title), nodes,
             guide:(g.phrases.length || g.tips.length) ? g : undefined };
  });

  const reviewCount = reviewPoolCount();
  $screen().innerHTML = `
    <div class="hero">
      ${window.TouchNav && !TouchNav.embedded ? `<div style="text-align:left">${TouchNav.html()}</div>` : ""}
      <span class="logo">✦ TOUCH ENGLISH</span>
      <h1>IPA Pronunciation Course</h1>
      <p>${L("Speak clearly. Learn by playing. One sound at a time.","把音发清楚。玩着学。一次一个音。","Sebut dengan jelas. Belajar sambil bermain. Satu bunyi pada satu masa.")}</p>
    </div>
    <div class="pad" id="ipaHome"></div>`;
  const home = document.getElementById("ipaHome");
  const root = TouchHome.render(home, {
    progress:{ label:`${L("Course Progress","课程进度","Kemajuan Kursus")} · ${doneStages}/${totalStages}`, pct:coursePct },
    streak:S.streak,
    goal:{
      pct:goalPct,
      label:`${L("Daily Goal","每日目标","Matlamat Harian")} · ${S.dailyGoal} XP`,
      value:`${S.todayXP}/${S.dailyGoal} XP`,
      onClick:cycleGoal            // 20 → 50 → 100, as before

    // the ↻ button shows only when there is something to review

      title:L(`Today’s Review · ${reviewCount} question${reviewCount>1?"s":""}`,`今天的复习 · ${reviewCount} 题`,`Ulang Kaji Hari Ini · ${reviewCount} soalan`),
      count:reviewCount,
      onClick:startReview
    } : null,
    labels:{
      start:L("START","开始","MULA"), again:L("PRACTISE AGAIN","再练一次","BERLATIH LAGI"),
      guide:L("Guide","指南","Panduan"), back:L("Back","返回","Kembali"),
      keyPhrases:L("Key sounds","重点音","Bunyi utama"), tips:L("Tips","小提醒","Petua")
    },
    sections,
    after:`${allDone ? `<div class="fineprint">${L("You finished every stage — replay anytime.","每一关都过了 —— 想重玩随时可以。","Anda tamatkan semua peringkat — main semula bila-bila masa.")}</div>` : ""}
      <div class="fineprint">${L("Progress saves automatically","进度会自动存起来","Kemajuan disimpan secara automatik")}</div>`
  });
  // the unit bands stick just under the HUD (standalone) or the platform's course bar (HUD hidden, 60px)
  const hud = document.getElementById("hud");
  root.style.setProperty("--th-sticky", ((hud && hud.offsetHeight) ? hud.offsetHeight + 4 : 62) + "px");
}

/* ---------- 10b. STAGE FLOW (Video → Learn → Exercises → Reward) ---------- */
// Keep a single session short & satisfying even though the bank is large.
const STAGE_QUESTION_CAP = 16;
// The hand-written exercises are the teacher's best items (fill-the-sound, spot
// the sound, tricky words). The old queue put every item without a `fam` tag
// LAST, and the 16-question cap was always reached first, so 0 of the 54 / 30 /
// 49 / 46 hand-written items in S1–S4 ever reached a learner. Now each run
// reserves HAND_SHARE of its 16 for them (fixed 2026-09-24).
const HAND_SHARE = 6;
// the generated vocabulary items (water, colleague…) are the easy filler — cap them
const VOCAB_MAX = 3;
// the words a question is "about", so one run never asks the same word twice
function qWords(q){
  const w = [];
  if(q.word) w.push(q.word);
  if(q.prompt && isWordLabel(q.prompt)) w.push(q.prompt);
  if(q.pair) w.push(...q.pair);
  const c = (q.options||[]).find(o=>o.correct);
  if(c && isWordLabel(c.label)) w.push(c.label);
  return [...new Set(w.map(x=>String(x).toLowerCase()))];
}
// SOFT GROUPED SEQUENCING: questions on the same contrast (`fam`) sit together,
// so the learner gets repeated exposure to one sound before moving on.
function buildQueue(s){
  const all = s.exercises.slice();
  if(s.id==="s0") return all;                 // welcome = its single check

  // an RP-only contrast (cot/caught) cannot be heard in an American voice
  const rpOK = Audio$.isBritish();
  const usable = all.filter(q=>!(q.rpOnly && !rpOK));
  const hand = shuffle(usable.filter(q=>!q.gen));
  const gen  = shuffle(usable.filter(q=>q.gen));
  const picked = [], used = new Set();
  const take = q=>{
    if(picked.length>=STAGE_QUESTION_CAP || picked.includes(q)) return false;
    const ws = qWords(q);
    if(ws.some(w=>used.has(w))) return false;
    ws.forEach(w=>used.add(w)); picked.push(q); return true;
  };
  // 1. the hand-written share
  for(const q of hand){ if(picked.length>=HAND_SHARE) break; take(q); }
  // 2. the stage's key contrasts (s.must) — topped up from anything in the stage
  for(const m of (s.must||[])){
    let have = picked.filter(q=>m.any.includes(q.fam)).length;
    for(const q of shuffle(usable)){
      if(have>=m.n) break;
      if(m.any.includes(q.fam) && take(q)) have++;
    }
  }
  // 3. fill up with generated items, a few per family in turn, vocabulary capped
  const fams = new Map();
  for(const q of gen){
    const k = q.vocab ? "_vocab" : (q.fam || "_misc");
    if(!fams.has(k)) fams.set(k, []);
    fams.get(k).push(q);
  }
  let vocab = picked.filter(q=>q.vocab).length, progress = true;
  const keys = shuffle([...fams.keys()]);
  while(picked.length<STAGE_QUESTION_CAP && progress){
    progress = false;
    for(const k of keys){
      const pool = fams.get(k);
      let n = 2 + Math.floor(Math.random()*2);          // 2–3 from this family
      while(n>0 && pool.length && picked.length<STAGE_QUESTION_CAP){
        const q = pool.shift();
        if(q.vocab && vocab>=VOCAB_MAX){ pool.length = 0; break; }
        if(take(q)){ n--; progress = true; if(q.vocab) vocab++; }
      }
    }
  }
  // 4. order: families in random order, each family's questions together
  const groups = new Map();
  for(const q of picked){
    const k = q.fam || q;                              // no family → its own slot
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(q);
  }
  return shuffle([...groups.values()]).flat();
}
// Say it: SAY_PER_RUN speaking steps are slotted between the scored questions of
// a stage run (after about 1/3 and 2/3 of them). They are not scored — the pass
// mark is counted over the questions only — but recording one earns SAY_XP.
const SAY_PER_RUN = 2, SAY_XP = 5;
function withSayIt(s, queue){
  const picks = shuffle(s.say||[]).slice(0, SAY_PER_RUN);
  const out = queue.slice();
  picks.forEach((p,i)=>{
    const at = Math.min(out.length, Math.round(queue.length*(i+1)/(picks.length+1)) + i);
    out.splice(at, 0, Object.assign({kind:"Say it", variant:"say"}, p));
  });
  return out;
}
const isSay = q => q && q.variant==="say";
function startStage(id){
  const s = COURSE.find(x=>x.id===id);
  const queue = withSayIt(s, buildQueue(s));
  // If this stage has no video in the current language (e.g. Welcome has no
  // English video), skip the Watch step and open straight into Learn.
  const hasVideo = s.video && ytId(videoUrl(s.video.key));
  session = { stageId:id, step: hasVideo ? "video" : "learn", qi:0, correct:0,
              total:queue.filter(q=>!isSay(q)).length, earned:0,
              perfect:true, comboStart:S.combo, queue, said:0, sayTotal:queue.filter(isSay).length, saidIds:{} };
  go({name:"stage"});
}
// accessor: the active question list (session queue, or full bank as fallback)
function sessionExercises(s){ return (session && session.queue) ? session.queue : s.exercises; }

const REVIEW_STAGE = { id:"review", title:"Today's Review", short:"Review", icon:"🔁", color:"coral",
  exercises:[], reward:{ xp:0, title:"Review complete!", line:"" } };
function findStage(id){ return id==="review" ? REVIEW_STAGE : id==="soundpx" ? SOUND_STAGE : COURSE.find(x=>x.id===id); }
// gather a few extra questions that drill the learner's weakest sounds.
// Deterministic (no randomness) so the count and the actual session agree.
function weakSoundQuestions(){
  const weakTokens = Object.entries(S.weak).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  if(!weakTokens.length) return [];
  const strip = t => t.replace(/\//g,"");
  const out=[];
  for(const p of PAIRS){
    const ia=strip(p.ia), ib=strip(p.ib), f=strip(p.f);
    if(weakTokens.some(t=>{ const s=strip(t); return ia.includes(s)||ib.includes(s)||f.includes(s); })){
      out.push(ex({kind:"Choose the IPA", prompt:p.a, options:[opt(p.ia,true),opt(p.ib)], fam:p.f,
        hint:`${p.f}. ${cap(p.a)} = ${p.ia}, ${cap(p.b)} = ${p.ib}.`}));
    }
    if(out.length>=6) break;
  }
  return out;
}
// the single source of truth for the review pool (deduped). Both the count
// and the session are built from this, so they can never disagree.
function buildReviewPool(){
  const seen = new Set();
  const pool = [];
  for(const q of [...S.review, ...weakSoundQuestions()]){
    const k = reviewKey(q);
    if(seen.has(k)) continue;
    seen.add(k); pool.push(q);
  }
  return pool;
}
function reviewPoolCount(){
  return Math.min(15, buildReviewPool().length);
}
function startReview(){
  const queue = shuffle(buildReviewPool()).slice(0, 15);
  if(!queue.length){ return; }
  REVIEW_STAGE.exercises = queue;
  session = { stageId:"review", step:"quiz", qi:0, correct:0, total:queue.length, earned:0,
              perfect:true, comboStart:S.combo, queue, isReview:true };

}

// Reuses the engine via a temporary stage (like REVIEW_STAGE), marked isReview
// so it gives a light wrap-up and does NOT touch course progression.
const SOUND_STAGE = { id:"soundpx", title:"Sound Practice", short:"Practice", icon:"🔊", color:"teal",
  exercises:[], reward:{ xp:0, title:"Practice complete!", line:"" } };
function soundLabel(ipa){
  const ex0 = (SOUND_WORDS[ipa]||[])[0] || "";
  return `/${ipa}/${ex0?` (${ex0})`:""}`;
}
// words that do NOT contain the target sound, avoiding its confusable partner
// ===== SOUND DISTANCE TIERS (beginner→advanced difficulty curve) =====
// Each sound belongs to a phonetic family. Distractors are graded by how FAR
// they sit from the target so beginners build a sound boundary before facing
// minimal pairs (full/fool, ship/sheep).
const SOUND_FAMILY = {
  short:["ɪ","e","æ","ʌ","ɒ","ʊ","ə"],
  long:["iː","ɑː","ɔː","uː","ɜː"],
  diph:["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə"],
  vless:["p","t","k","f","θ","s","ʃ","tʃ","h"],
  vced:["b","d","ɡ","v","ð","z","ʒ","dʒ","m","n","ŋ","l","r","w","j"]
};
function familyOf(ipa){
  for(const [fam,arr] of Object.entries(SOUND_FAMILY)) if(arr.includes(ipa)) return fam;
  return "other";
}
function nearPartners(ipa){ return [LENGTH_PAIRS[ipa], VOICE_PAIRS[ipa]].filter(Boolean); }
// pick `n` distractor WORDS at a difficulty tier:
//  "far"  → opposite macro-category (vowel↔consonant): easy
//  "mid"  → related family but NOT the minimal-pair partner: medium
//  "near" → the minimal-pair partner (length/voice): advanced
function tierWords(ipa, n, tier){
  const fam = familyOf(ipa);
  const near = new Set(nearPartners(ipa));
  const own = new Set(SOUND_WORDS[ipa]||[]);
  let allow;
  if(tier==="near"){
    allow = s => near.has(s);
  } else if(tier==="mid"){
    const sameBucket = ["short","long"].includes(fam) ? ["short","long"] : [fam];
    allow = s => s!==ipa && !near.has(s) && sameBucket.includes(familyOf(s));
  } else {
    const consonantFams=["vless","vced"], vowelFams=["short","long","diph"];
    const isVowel = vowelFams.includes(fam);
    if(isVowel){
      // far = a clearly different vowel quality: diphthongs read as very distinct
      // from plain short/long vowels, so prefer the non-adjacent vowel families.
      const farVowel = fam==="diph" ? ["short","long"] : ["diph"];
      allow = s => s!==ipa && !near.has(s) && farVowel.includes(familyOf(s));
    } else {
      allow = s => s!==ipa && !near.has(s) && vowelFams.includes(familyOf(s));
    }
  }
  const pool=[];
  for(const [s,ws] of Object.entries(SOUND_WORDS)){
    if(!allow(s)) continue;
    for(const w of ws){ if(!own.has(w)) pool.push(w); }
  }
  let picks = shuffle(pool).slice(0,n);
  if(picks.length<n) picks = picks.concat(distractorWords(ipa, n-picks.length));
  return picks.slice(0,n);
}
// generic distractor (safety fallback)
function distractorWords(ipa, n){
  const avoid = new Set([ipa, LENGTH_PAIRS[ipa], VOICE_PAIRS[ipa]].filter(Boolean));
  const own = new Set(SOUND_WORDS[ipa]||[]);
  const pool = [];
  for(const [k,ws] of Object.entries(SOUND_WORDS)){
    if(avoid.has(k)) continue;
    for(const wd of ws){ if(!own.has(wd)) pool.push(wd); }
  }
  return shuffle(pool).slice(0, n);
}
// 10 questions on a beginner→advanced curve:
//   Stage 1 (×4) EASY  — 3 options, far distractors
//   Stage 2 (×3) MEDIUM— 3 options, mid distractors (no minimal pair)
//   Stage 3 (×3) HARD  — minimal pair (2 options) if one exists, else mid odd-one-out
function buildSoundQuestions(ipa){
  const words = (SOUND_WORDS[ipa]||[]).slice();
  if(!words.length) return [];
  const qs = [];
  const hasNear = nearPartners(ipa).length>0;
  const w1 = shuffle(words.slice());
  for(let i=0;i<4 && i<w1.length;i++){
    const right=w1[i], wrongs=tierWords(ipa,2,"far");
    qs.push(ex({ kind:`Find the /${ipa}/ sound`, lvl:"Easy", prompt:`Which word has the /${ipa}/ sound?`,
      options:shuffle([opt(right,true), ...wrongs.map(x=>opt(x))]),
      hint:`“${right}” has /${ipa}/. The others sound clearly different — tap 🔊 to compare.` }));
  }
  const w2 = shuffle(words.slice());
  for(let i=0;i<3 && i<w2.length;i++){
    const right=w2[i], wrongs=tierWords(ipa,2,"mid");
    qs.push(ex({ kind:"Listen & choose", lvl:"Medium", variant:"listen", word:right, sub:"Which word did you hear?",
      options:shuffle([opt(right,true), ...wrongs.map(x=>opt(x))]),
      hint:`You heard “${right}” — it has the /${ipa}/ sound.` }));
  }
  const w3 = shuffle(words.slice());
  for(let i=0;i<3;i++){
    if(hasNear){
      const right=w3[i%w3.length], wrong=tierWords(ipa,1,"near")[0];
      qs.push(ex({ kind:"Minimal pair", lvl:"Hard", variant:"listen", word:right, sub:"Which word did you hear?",
        options:shuffle([opt(right,true), opt(wrong)]),
        hint:`Tricky pair! “${right}” has /${ipa}/. Listen for the small difference — tap 🔊 to compare.` }));
    } else {
      const keep=shuffle(words.filter(x=>x!==w3[i%w3.length])).slice(0,2);
      const odd=tierWords(ipa,1,"mid")[0] || distractorWords(ipa,1)[0] || "no";
      qs.push(ex({ kind:"Spot the odd one", lvl:"Hard", prompt:`Which word does NOT have the /${ipa}/ sound?`,
        options:shuffle([opt(odd,true), ...keep.map(x=>opt(x))]),
        hint:`“${keep.join("” and “")}” have /${ipa}/; “${odd}” does not.` }));
    }
  }
  return qs.slice(0,10);
}
function startSoundPractice(ipa){
  const qs = buildSoundQuestions(ipa);
  if(!qs.length) return;
  SOUND_STAGE.exercises = qs;
  SOUND_STAGE.title = `Practice: ${soundLabel(ipa)}`;
  session = { stageId:"soundpx", step:"quiz", qi:0, correct:0, total:qs.length, earned:0,
              perfect:true, comboStart:S.combo, queue:qs, isReview:true, soundIpa:ipa };
  S.combo=0; renderHUD(); go({name:"stage"});
}
