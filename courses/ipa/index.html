<!-- TOUCH English — IPA Pronunciation Course
     A data-driven, gamified learning engine.
     ARCHITECTURE OVERVIEW (see JS sections):
       1. CONTENT MODEL .... pure data: stages + exercises (the only thing you edit to add content)
       2. PERSISTENCE ...... saves/loads progress (browser localStorage + in-memory fallback)
       3. STATE STORE ...... single source of truth for the learner
       4. XP / LEVEL SYSTEM
       5. BADGE SYSTEM
       6. PROGRESSION SYSTEM (locking / unlocking)
       7. FEEDBACK SYSTEM (encouragement + hints + sound + confetti)
       8. REWARD SYSTEM (stage payouts)
       9. EXERCISE ENGINE (one reusable renderer for every question type)
      10. SCREEN ROUTER + STAGE TEMPLATE (Video → Learn → Exercises → Reward)
-->
<meta charset="utf-8">
<title>Touch English — IPA Pronunciation</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../shared/theme.css">
<style>
:root{
  /* ===== Touch English Booking System theme =====
     Variable NAMES are unchanged so every existing rule re-themes automatically.
     teal* = Navy (primary/active) · coral* = Maroon (secondary) ·
     sun*  = Gold (premium/XP)     · good*  = Green (completed) */
  --cream: var(--te-canvas, #F5F7FA); --cream-2:#E9EEF5; --ink: var(--te-ink, #1B2433); --ink-soft: var(--te-muted, #5C6675);
  --line: var(--te-line, #DCE3EC);
  --teal: var(--te-brand, #1F3A5F); --teal-d: var(--te-brand-d, #19314F); --teal-dd: var(--te-brand-dd, #142640);          /* Navy (primary) */
  --coral: var(--te-danger, #8B1E3F); --coral-d: var(--te-danger-d, #6F1730);                            /* Maroon (secondary) */
  --sun: var(--te-gold, #D9B56B); --sun-d: var(--te-gold-deep, #BE9648);                                /* Premium Gold */
  --sky:#3E6FA0; --sky-d:#2C5480;                                /* muted navy-blue accent */
  --plum: var(--te-danger, #8B1E3F); --plum-d: var(--te-danger-d, #6F1730);                              /* fold accent into maroon */
  --good: var(--te-success, #4FAE8A); --good-d: var(--te-success-d, #3C8E6F);                              /* Success green (completed) */
  --bad: var(--te-bad, #C0405C); --bad-d: var(--te-bad-d, #9E2E47);                                /* soft maroon-red for "try again" */
  --white: var(--te-surface, #FFFFFF);
  /* Apple-inspired elevation: soft, diffuse, low-contrast (never chunky) */
  --shadow:0 6px 0;
  --soft:0 1px 1px rgba(27,36,51,.04), 0 6px 18px rgba(27,36,51,.07);
  --soft-lg:0 1px 2px rgba(27,36,51,.05), 0 14px 38px rgba(27,36,51,.11);
  --soft-sm:0 1px 1px rgba(27,36,51,.04), 0 2px 8px rgba(27,36,51,.06);
  --hair:rgba(27,36,51,.08);            /* hairline border */
  --r:22px; --r-lg:20px; --r-md:16px; --r-sm:12px;
  font-family:'Nunito',-apple-system,'Segoe UI','Noto Sans',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background:
    radial-gradient(120% 90% at 0% -10%, #FBFCFE 0%, rgba(251,252,254,0) 45%),
    radial-gradient(120% 90% at 100% 0%, #E9EEF5 0%, rgba(233,238,245,0) 50%),
    var(--cream);
  color:var(--ink);
  display:flex;justify-content:center;
  font-size:16px;-webkit-font-smoothing:antialiased;
}
/* phone frame on desktop, edge-to-edge on mobile */
#app{
  width:100%;max-width:470px;min-height:100vh;position:relative;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg, #FFFFFF 0%, #F5F7FA 100%);
  box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(70,45,10,.16);
  overflow:visible;            /* let the page scroll vertically (iOS Safari fix) */
  overflow-x:clip;             /* still hide any horizontal overspill */
}
@media(min-width:520px){ #app{margin:0 0;border-radius:0} body{align-items:stretch} }

h1,h2,h3,.disp{font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.2px;margin:0}
.ipa{font-family:'Nunito','Segoe UI','Noto Sans',sans-serif;font-weight:800;letter-spacing:.5px}

/* ---------- HUD ---------- */
#hud{
  position:sticky;top:0;z-index:30;
  padding:12px 16px 10px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.hud-row{display:flex;align-items:center;gap:8px}
.chip{
  display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:14px;
  padding:6px 11px;border-radius:999px;background:var(--white);
  border:1px solid var(--line);box-shadow:var(--soft-sm);
}
.chip .ic{font-size:15px;line-height:1}
.chip.streak{color:var(--coral-d)} .chip.xp{color:var(--sun-d)}
.lvl{
  display:flex;align-items:center;gap:9px;margin-left:auto;
}
.lvl .ring{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--teal) var(--p,0deg), #E4E9F0 0deg);
  flex:none;
}
.lvl .ring i{width:26px;height:26px;border-radius:50%;background:var(--white);display:grid;place-items:center;
  font-family:'Fredoka';font-weight:700;font-size:13px;color:var(--teal-dd);font-style:normal}
.xpbar{height:10px;border-radius:99px;background:#E4E9F0;margin-top:9px;overflow:hidden;border:1px solid var(--line)}
.xpbar > i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--sun),var(--sun-d));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xptxt{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:4px;text-align:right}
.sound-btn{margin-left:6px;background:none;border:none;font-size:17px;cursor:pointer;opacity:.7}

/* ---------- generic ---------- */
#screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pad{padding:18px 18px 28px}
/* ===== TOUCH Button System v1.0 — 3D candy buttons ===== */
.btn{--bb:#16314F;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  font-family:'Fredoka';font-weight:700;font-size:16px;letter-spacing:.3px;color:#fff;cursor:pointer;position:relative;overflow:hidden;
  padding:15px 20px;border:none;border-radius:16px;
  background:linear-gradient(180deg,#3A6094 0%,#2A4A72 55%,var(--teal) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(20,38,64,.22);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1), box-shadow .16s cubic-bezier(.34,1.56,.64,1), filter .15s;
  -webkit-tap-highlight-color:transparent}
.btn::before{content:"";position:absolute;left:5%;right:5%;top:3px;height:46%;border-radius:14px 14px 18px 18px/14px 14px 30px 30px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.05) 85%,rgba(255,255,255,0));pointer-events:none}
.btn::after{content:"";position:absolute;top:-30%;bottom:-30%;left:-80%;width:45%;transform:skewX(-22deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.5) 50%,rgba(255,255,255,0));
  animation:btnshine 3s linear infinite;pointer-events:none}
@keyframes btnshine{0%,72%{left:-80%}92%,100%{left:160%}}
.btn:active,.btn.pressed{transform:translateY(4px) scale(1.015,.96);box-shadow:0 1px 0 var(--bb),0 4px 8px rgba(20,38,64,.18)}
.btn.coral{--bb:#6F1730;background:linear-gradient(180deg,#B23A5A 0%,#9B2A4A 55%,var(--coral) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(111,23,48,.26)}
.btn.bad{--bb:#9E2E47;background:linear-gradient(180deg,#D46078 0%,#C9536C 55%,var(--bad) 100%);
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(158,46,71,.26)}
.btn.sun{--bb:#9A7836;background:linear-gradient(180deg,#F0D89B 0%,#E2C27E 50%,var(--sun) 100%);color:#5A3A1E;
  box-shadow:0 5px 0 var(--bb),0 12px 20px rgba(190,150,72,.26);animation:btnbreathe 2.4s ease-in-out infinite}
.btn.sun:active,.btn.sun.pressed{animation:none}
@keyframes btnbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.btn.ghost{--bb:#CBD6E4;background:linear-gradient(180deg,#FFFFFF,#F3F6FA);color:var(--teal);border:1.5px solid var(--line);
  box-shadow:0 4px 0 var(--bb),0 8px 14px rgba(27,36,51,.08)}
.btn.ghost::after{display:none}
.btn.ghost:active,.btn.ghost.pressed{transform:translateY(3px) scale(1.01,.97);box-shadow:0 1px 0 var(--bb)}
.btn[disabled]{filter:grayscale(.5) opacity(.45);pointer-events:none;animation:none}
.btn[disabled]::after{display:none}
@media (hover:hover) and (pointer:fine){
  .btn:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 7px 0 var(--bb),0 16px 26px rgba(20,38,64,.26)}
  .btn.sun:hover{animation:none}
  .btn:hover:active{transform:translateY(4px) scale(1.015,.96);filter:brightness(1);box-shadow:0 1px 0 var(--bb),0 4px 8px rgba(20,38,64,.18)}
  .btn.ghost:hover{box-shadow:0 6px 0 var(--bb),0 12px 18px rgba(27,36,51,.10);transform:translateY(-2px)}}

.card{background:var(--white);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:var(--soft)}

/* ---------- STAGE MAP ---------- */
.hero{padding:22px 18px 6px;text-align:center}
.hero .logo{display:inline-flex;align-items:center;gap:8px;font-family:'Fredoka';font-weight:700;
  font-size:13px;letter-spacing:2px;color:var(--teal-dd);text-transform:uppercase;
  background:#E6ECF4;border:1px solid #C5D2E2;padding:5px 12px;border-radius:99px}
.hero h1{font-size:27px;margin:12px 0 4px;line-height:1.1}
.hero p{color:var(--ink-soft);font-weight:600;margin:0;font-size:14px}
.path{position:relative;padding:22px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px}
.node-wrap{position:relative;width:100%;display:flex;justify-content:center}
.node-wrap[data-side="l"]{justify-content:flex-start;padding-left:22%}
.node-wrap[data-side="r"]{justify-content:flex-end;padding-right:22%}
.node{
  width:96px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  text-align:center;position:relative;
}
.node .disc{
  width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:34px;position:relative;
  background:linear-gradient(160deg,#FFFFFF,#EEF3FA);border:2px solid var(--line);
  box-shadow:0 5px 0 #D6DEEA,0 10px 18px rgba(27,36,51,.14),inset 0 2px 0 rgba(255,255,255,.7);
  transition:transform .14s cubic-bezier(.34,1.56,.64,1), box-shadow .14s cubic-bezier(.34,1.56,.64,1);
}
.node:active .disc{transform:translateY(4px);box-shadow:0 1px 0 #D6DEEA,0 4px 8px rgba(27,36,51,.16),inset 0 2px 0 rgba(255,255,255,.7)}
.node.open .disc{border:none;color:#fff;
  background:linear-gradient(160deg,#3A6094 0%,#2A4A72 55%,#1F3A5F 100%);
  box-shadow:0 5px 0 #16314F,0 11px 20px rgba(31,58,95,.30),inset 0 2px 0 rgba(255,255,255,.22)}
.node.open:active .disc{transform:translateY(4px);box-shadow:0 1px 0 #16314F,0 4px 9px rgba(31,58,95,.26),inset 0 2px 0 rgba(255,255,255,.22)}
.node.done .disc{border:none;color:#fff;
  background:linear-gradient(160deg,#5BBE9B 0%,#4FAE8A 55%,#3C8E6F 100%);
  box-shadow:0 5px 0 #2E7459,0 11px 20px rgba(43,108,80,.28),inset 0 2px 0 rgba(255,255,255,.30),0 0 0 4px #D9B56B}
.node.done:active .disc{transform:translateY(4px);box-shadow:0 1px 0 #2E7459,0 4px 9px rgba(43,108,80,.24),inset 0 2px 0 rgba(255,255,255,.30),0 0 0 4px #D9B56B}
.node .nm{font-family:'Fredoka';font-weight:600;font-size:13px;line-height:1.15;color:var(--ink);margin-top:2px}
.node .badge-dot{position:absolute;top:-8px;right:-2px}
.connector{width:4px;height:30px;border-radius:9px;background:repeating-linear-gradient(180deg,var(--line) 0 6px,transparent 6px 12px)}
.start-flag{position:absolute;left:50%;transform:translateX(-50%);top:-2px;
  background:var(--teal);color:#fff;font-family:'Fredoka';font-weight:700;font-size:11px;
  padding:5px 13px;border-radius:99px;box-shadow:0 2px 6px rgba(31,58,95,.28);letter-spacing:.6px;z-index:10}

/* ---------- STAGE INTRO / SECTIONS ---------- */
.topbar{display:flex;align-items:center;gap:10px;padding:12px 16px 4px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;
  font-size:20px;cursor:pointer;flex:none;box-shadow:var(--soft-sm)}
.iconbtn:active{transform:translateY(1px);box-shadow:var(--soft-sm)}
.steps{display:flex;gap:6px;flex:1}
.steps i{height:8px;flex:1;border-radius:9px;background:#E4E9F0}
.steps i.on{background:var(--teal)} .steps i.cur{background:var(--coral)}
.sec-label{display:inline-flex;align-items:center;gap:7px;font-family:'Fredoka';font-weight:700;
  font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--coral-d);
  background:#F3E1E6;border:1px solid #E3C4CD;padding:5px 12px;border-radius:99px}
.sec-h{font-size:23px;margin:12px 0 6px;line-height:1.15}
.sec-p{color:var(--ink-soft);font-weight:600;line-height:1.5;font-size:15px}

/* video */
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;
  background:linear-gradient(135deg,#1f2937,#0b1220);display:grid;place-items:center;color:#fff;
  border:1px solid var(--line);box-shadow:var(--soft);margin-top:14px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.92);
  display:grid;place-items:center;font-size:24px;color:#111;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.video .vmeta{position:absolute;left:14px;bottom:12px;right:14px;text-align:left}
.video .vmeta b{font-family:'Fredoka';display:block;font-size:15px}
.video .vmeta span{font-size:12px;opacity:.8}
.video .tag{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.45);font-size:11px;
  padding:4px 9px;border-radius:99px;font-weight:700}
.video.as-link{text-decoration:none;background-size:cover;background-position:center;cursor:pointer}
.video.as-link::after{content:"";position:absolute;inset:0;background:rgba(10,15,25,.42)}
.video.as-link .play,.video.as-link .tag,.video.as-link .vmeta{position:relative;z-index:1}
.video.as-link .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.placeholder-note{font-size:12px;color:var(--ink-soft);text-align:center;margin-top:8px;font-weight:600}
.placeholder-note a{color:var(--sky-d);font-weight:800}

/* learn blocks */
.block{margin-top:14px;padding:16px}
.block h3{font-size:16px;margin-bottom:10px;color:var(--ink)}
.ipa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.ipa-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:14px 6px 11px;border-radius:var(--r-md);background:linear-gradient(180deg,#FFFFFF,#FAFBFD);border:1px solid var(--hair);
  box-shadow:var(--soft-sm);cursor:pointer;transition:transform .18s cubic-bezier(.33,1,.68,1), box-shadow .18s}
.ipa-pill:hover{transform:translateY(-1px);box-shadow:var(--soft)}
.ipa-pill:active{transform:translateY(0);box-shadow:var(--soft-sm)}
.ipa-pill b{font-size:22px;color:var(--coral);line-height:1.1;letter-spacing:-.3px} .ipa-pill .w{font-size:13px;color:var(--ink);font-weight:800}
.ipa-pill .sp{font-size:12px;color:var(--sky-d);opacity:.7;margin-top:2px}
.ipa-pill.voiced b{color:var(--plum-d)} .ipa-pill.voiceless b{color:var(--sky-d)}
@media (max-width:380px){ .ipa-grid{grid-template-columns:repeat(3,1fr)} }
.note{margin-top:12px;background:#F8EFDB;border:1px solid #E9D4A3;border-radius:14px;padding:12px 14px;
  font-size:14px;font-weight:700;color:#6F4A12;display:flex;gap:9px;align-items:flex-start}
.quote{margin-top:16px;text-align:center;font-family:'Fredoka';font-weight:600;font-size:20px;color:var(--teal-dd);
  padding:16px;background:#E6F4EE;border:1px dashed var(--teal);border-radius:18px}
.quote small{display:block;font-family:'Nunito';font-weight:700;font-size:12px;color:var(--ink-soft);margin-top:6px}

/* ---------- EXERCISE ENGINE ---------- */
.q-kind{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink-soft)}
/* language picker (first run) */
.lang-pick{text-align:center;padding-top:48px}
.lang-logo{font-family:'Fredoka';font-weight:700;color:var(--coral);letter-spacing:1px;font-size:14px;margin-bottom:24px}
.lang-title{font-family:'Fredoka';font-weight:700;color:var(--ink);font-size:26px;margin:0 0 6px}
.lang-sub{color:var(--ink-soft);font-weight:600;margin:0 0 28px}
.lang-list{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:0 auto}
.btn.lang-opt{justify-content:flex-start;gap:14px;font-size:18px;padding:18px 22px}
.name-wrap{display:flex;flex-direction:column;gap:14px;max-width:320px;margin:0 auto}
.name-input{font-family:'Fredoka';font-size:18px;font-weight:600;color:var(--ink);text-align:center;
  padding:16px 18px;border:2px solid var(--line);border-radius:16px;background:#fff;outline:none;transition:border-color .15s}
.name-input:focus{border-color:var(--coral)}
.name-input::placeholder{color:#AEB8C6;font-weight:500}
/* top-right switcher + dropdown */
.lang-btn{margin-left:2px}
#langMenu{position:relative;z-index:50}
.lang-menu-backdrop{position:fixed;inset:0;z-index:49}
.lang-menu{position:absolute;right:14px;top:2px;z-index:50;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(27,36,51,.20);padding:6px;min-width:190px}
.lang-menu-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  font-family:'Fredoka';font-weight:600;font-size:15px;color:var(--ink);padding:11px 12px;border-radius:10px;text-align:left}
.lang-menu-item:hover{background:#F1F5FA}
.lang-menu-item.on{color:var(--coral)}
.q-lvl{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:99px;font-size:10px;letter-spacing:.5px;color:#fff;vertical-align:middle}
.q-lvl.easy{background:#4FAE8A}.q-lvl.medium{background:#3E6FA0}.q-lvl.hard{background:#8B1E3F}
.q-prompt{text-align:center;margin:14px 0 4px}
.q-prompt .big{font-family:'Fredoka';font-weight:700;font-size:34px;line-height:1.1}
.q-prompt .big.ipaword{color:var(--teal-dd)}
.q-sub{text-align:center;color:var(--ink-soft);font-weight:700;font-size:14px;margin-bottom:4px}
.q-blank{display:inline-block;min-width:34px;border-bottom:4px solid var(--coral);margin:0 2px}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:18px}
.opts.wrap{flex-direction:row;flex-wrap:wrap;justify-content:center}
.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
  background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 16px;
  box-shadow:var(--soft-sm);transition:transform .08s,border-color .12s,box-shadow .08s;
  font-weight:800;font-size:18px;color:var(--ink);
}
.opt:active{transform:translateY(1px);box-shadow:var(--soft-sm)}
.opt .key{width:30px;height:30px;border-radius:9px;background:var(--cream);border:1px solid var(--line);
  display:grid;place-items:center;font-family:'Fredoka';font-size:14px;color:var(--ink-soft);flex:none}
.opt.sel{border-color:var(--sky);box-shadow:0 1px 4px rgba(62,111,160,.28);background:#E6EDF5}
.opt.sel .key{background:var(--sky);color:#fff;border-color:var(--sky-d)}
.opt.correct{border-color:var(--good);box-shadow:0 1px 4px rgba(79,174,138,.30);background:#E6F4EE;animation:correctPop .4s cubic-bezier(.2,.7,.3,1)}
.opt.correct .key{background:var(--good);color:#fff;border-color:var(--good-d)}
@keyframes correctPop{0%{transform:scale(1)}40%{transform:scale(1.025)}100%{transform:scale(1)}}
.opt.wrong{border-color:var(--bad);box-shadow:0 1px 4px rgba(192,64,92,.28);background:#F6E4E8}
.opt.wrong .key{background:var(--bad);color:#fff;border-color:var(--bad-d)}
.opt.chipopt{width:auto;flex:0 0 auto;font-size:20px;justify-content:center}
.opt.chipopt .key{display:none}
.opt.shake{animation:shake .4s}
/* after answering: option body is settled (default cursor, no press lift),

}

  };
}
let S = freshState();

function dayDiff(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function touchStreak(){
  const today = new Date().toDateString();
  if(S.lastActive!==today){
    const d = dayDiff(S.lastActive, today);
    S.streak = d===1 ? S.streak+1 : 1;
    S.lastActive = today;
  }
}
function touchDaily(){            // reset the daily counter when a new day starts
  const today = new Date().toDateString();
  if(S.today!==today){ S.today=today; S.todayXP=0; S.goalHitToday=false; }
}
function save(){ Persist.save(S); }

/* =====================================================================
   4. XP & LEVEL SYSTEM
   ===================================================================== */
function levelThreshold(n){ return 75*n*(n+1); } // cumulative XP needed to REACH level n (n>=1 => 150,450,900...)
function levelInfo(xp){
  let lvl=1; while(xp >= levelThreshold(lvl+1)) lvl++;
  const cur = levelThreshold(lvl), next = levelThreshold(lvl+1);
  return {lvl, into:xp-cur, span:next-cur, pct:Math.min(1,(xp-cur)/(next-cur))};
}
function awardXP(amount, atEl){
  const before = levelInfo(S.xp).lvl;
  S.xp += amount;
  touchDaily();
  S.todayXP += amount;                         // PRIORITY 3: daily goal progress
  const after = levelInfo(S.xp).lvl;
  if(atEl) xpFloat(amount, atEl);
  renderHUD();
  if(after>before) levelUp(after);
  if(!S.goalHitToday && S.todayXP>=S.dailyGoal){
    S.goalHitToday=true; setTimeout(goalReached, 600);
  }
}
function goalReached(){
  confetti(70); sfx("reward");
  const d=document.createElement("div"); d.className="lvlup"; d.style.background="var(--sun)"; d.style.color="#5A3A1E";
  d.innerHTML="🎯 Daily goal reached!"; document.getElementById("fx").appendChild(d);
  setTimeout(()=>d.remove(),1700);
}

function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(freq, t0, dur, type="sine", vol=.13){
  const c=ac(); if(!c) return; const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.value=freq; o.connect(g); g.connect(c.destination);
  const now=c.currentTime+t0; g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol,now+.02);
  g.gain.exponentialRampToValueAtTime(.0001,now+dur); o.start(now); o.stop(now+dur+.02);
}
function sfx(kind){
  if(!SOUND) return;
  if(kind==="ok"){ tone(660,0,.12,"triangle"); tone(990,.09,.16,"triangle"); }
  else if(kind==="no"){ tone(200,0,.18,"sawtooth",.09); }
  else if(kind==="reward"){ [523,659,784,1046].forEach((f,i)=>tone(f,i*.1,.25,"triangle",.12)); }
  else if(kind==="tap"){ tone(440,0,.05,"sine",.05); }
}

/* =====================================================================
   PRONUNCIATION AUDIO ENGINE  (MVP)
   ---------------------------------------------------------------------
   NOTE: This is NOT real human-recorded pronunciation. It uses the
   browser's built-in SpeechSynthesis to READ WORDS CLEARLY so beginners
   can train their ears. Each playable item carries an optional `src`
   (an MP3 URL). When a teacher later drops in real recordings:
        playAudio("sheep", "audio/sheep.mp3")
   the MP3 plays; otherwise we fall back to SpeechSynthesis automatically.
   Raw IPA symbols are never spoken — we always speak the EXAMPLE WORD.
   ===================================================================== */
const Audio$ = {
  ready:false, voice:null, current:null,
  init(){
    if(!("speechSynthesis" in window)) return;
    const load = ()=>{
      const vs = speechSynthesis.getVoices();
      if(!vs.length) return;
      // prefer a natural en-GB / en-US voice
      this.voice =
        vs.find(v=>/en-GB/i.test(v.lang) && /google|natural|female/i.test(v.name)) ||
        vs.find(v=>/en-GB/i.test(v.lang)) ||
        vs.find(v=>/en-US/i.test(v.lang)) ||
        vs.find(v=>/^en/i.test(v.lang)) || vs[0];
      this.ready = true;
    };
    load(); speechSynthesis.onvoiceschanged = load;
  },
  // word: text to speak | src: optional MP3 URL (future teacher audio)
  play(word, src){
    this._seq = {};                            // invalidate any pending phoneme→word timers
    if(src){                                   // real audio file takes priority
      try{
        const a = new Audio(src);
        a.play().catch(()=>this.speak(word));   // network/format issue → fallback
        return;
      }catch(e){ /* fall through to TTS */ }
    }
    this.speak(word);
  },
  speak(word){
    if(!word || !("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();                 // stop overlaps, allow rapid replay
      const u = new SpeechSynthesisUtterance(String(word));
      if(this.voice) u.voice = this.voice;
      u.lang = (this.voice && this.voice.lang) || "en-GB";
      u.rate = 0.78;                            // slower, beginner-friendly
      u.pitch = 1.0; u.volume = 1.0;
      this.current = u; speechSynthesis.speak(u);
    }catch(e){}
  },
  // speak several parts in order with a clear PAUSE between them
  // (e.g. phoneme sound → beat of silence → the word).
  speakSeq(parts, gapMs){
    if(!("speechSynthesis" in window)) return;
    const list = (parts||[]).filter(Boolean);
    if(!list.length) return;
    const gap = gapMs==null ? 450 : gapMs;
    try{
      speechSynthesis.cancel();
      // speak + resume() — Chrome/Android can stay paused after cancel()
      // and silently drop the utterance; resume() unsticks it.
      const speakSynthSafe = (u)=>{ speechSynthesis.speak(u); try{ speechSynthesis.resume(); }catch(e){} };
      const mk = (text, rate)=>{
        const u = new SpeechSynthesisUtterance(String(text));
        if(this.voice) u.voice = this.voice;
        u.lang = (this.voice && this.voice.lang) || "en-GB";
        u.rate = rate; u.pitch = 1.0; u.volume = 1.0;
        return u;
      };
      const seq = this._seq = {}; // token: a newer tap invalidates pending timers
      const speakAt = (i)=>{
        if(this._seq!==seq || i>=list.length) return;
        // each part may be a plain string or [text, rate]
        const part = list[i];
        const text = Array.isArray(part) ? part[0] : part;
        const rate = Array.isArray(part) ? part[1] : (i===0?0.7:0.78);
        const u = mk(text, rate);
        let advanced = false;
        const next = ()=>{ if(advanced) return; advanced=true;
          if(i+1<list.length) setTimeout(()=>speakAt(i+1), gap); };
        u.onend = next;
        // fallback: if onend never fires (some engines), advance after an estimate
        setTimeout(next, 1200 + String(text).length*90);
        speakSynthSafe(u);
      };
      // KEY FIX: Chrome drops an utterance queued in the same tick as cancel()
      // (the phoneme was being swallowed). A short beat lets cancel settle.
      setTimeout(()=>speakAt(0), 80);
    }catch(e){}
  }
};
// TEACHING NOTE: anchors are REAL words TTS pronounces correctly, and each
// anchor matches the example word shown on its tile (what you see = what you
// hear). Collisions avoided: no two sounds share an anchor word, so a tap is
// never ambiguous. Long vowels play slower (stretched) so the length contrast
// vs the short partner is audible.
const PHONEME_SAY = {
  // short vowels
  "ɪ":["ship",1.0],"e":["bed",1.0],"æ":["cat",1.0],"ʌ":["cup",1.0],
  "ɒ":["hot",1.0],"ʊ":["book",1.0],"ə":["about",1.05],   // "about" gives a real schwa; "a" alone reads as /eɪ/
  // long vowels — stretched
  "iː":["sheep",0.75],"ɑː":["car",0.75],"ɔː":["door",0.75],"uː":["food",0.75],"ɜː":["bird",0.75],
  // diphthongs — gliding
  "eɪ":["day",0.85],"aɪ":["my",0.85],"ɔɪ":["boy",0.85],"aʊ":["now",0.85],"əʊ":["go",0.85],
  "ɪə":["here",0.85],"eə":["hair",0.85],"ʊə":["tour",0.85],
  // voiceless consonants — anchor == tile word
  "p":["pen",1.05],"t":["ten",1.05],"k":["key",1.05],"f":["fan",1.05],
  "θ":["think",1.0],"s":["sun",1.05],"ʃ":["she",1.0],"tʃ":["chair",1.0],"h":["hat",1.05],
  // voiced consonants — anchor == tile word (NB: /d/≠day, /g/≠go to avoid
  // colliding with the /eɪ/ and /əʊ/ diphthongs)
  "b":["boot",1.0],"d":["dog",1.0],"g":["good",1.0],"v":["van",1.0],
  "ð":["this",1.0],"z":["zoo",1.0],"ʒ":["vision",0.95],"dʒ":["jump",1.0],
  "m":["man",1.0],"n":["no",1.0],"ŋ":["sing",0.95],
  "l":["leg",1.0],"r":["red",1.0],"w":["we",1.0],"j":["yes",1.0]
};
// SOUND LIBRARY — the complete 44-sound inventory for the Sounds tab.
// Each item: [ipa, example word]. Tap = phoneme → pause → word.
const SOUND_LIBRARY = [
  {title:"Short vowels", items:[["ɪ","ship"],["e","bed"],["æ","cat"],["ʌ","cup"],["ɒ","hot"],["ʊ","book"],["ə","about"]]},
  {title:"Long vowels", items:[["iː","sheep"],["ɑː","car"],["ɔː","door"],["uː","food"],["ɜː","bird"]]},
  {title:"Diphthongs", items:[["eɪ","day"],["aɪ","my"],["ɔɪ","boy"],["aʊ","now"],["əʊ","go"],["ɪə","here"],["eə","hair"],["ʊə","tour"]]},
  {title:"Voiceless consonants", cls:"voiceless", items:[["p","pen"],["t","ten"],["k","key"],["f","fan"],["θ","think"],["s","sun"],["ʃ","she"],["tʃ","chair"],["h","hat"]]},
  {title:"Voiced consonants", cls:"voiced", items:[["b","boot"],["d","dog"],["g","good"],["v","van"],["ð","this"],["z","zoo"],["ʒ","vision"],["dʒ","jump"],["m","man"],["n","no"],["ŋ","sing"],["l","leg"],["r","red"],["w","we"],["j","yes"]]}
];
// Pure voiceless fricatives can't come from TTS (any spelling adds a vowel or
// letter names). Synthesize them as filtered noise — physically what /s/ is.
const NOISE_SAY = {
  "s": {type:"highpass", freq:5200, dur:0.5, vol:0.5}    // bright hiss, no voicing
};
function playNoise(spec){
  const ctx = ac(); if(!ctx) return spec.dur*1000;
  try{
    const n = Math.floor(ctx.sampleRate * spec.dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = Math.random()*2-1;       // white noise
    const src = ctx.createBufferSource(); src.buffer = buf;
    const filt = ctx.createBiquadFilter();
    filt.type = spec.type; filt.frequency.value = spec.freq;
    const g = ctx.createGain();
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(spec.vol, t+0.04);     // soft attack
    g.gain.setValueAtTime(spec.vol, t+spec.dur-0.12);
    g.gain.linearRampToValueAtTime(0.0001, t+spec.dur);   // soft release
    src.connect(filt); filt.connect(g); g.connect(ctx.destination);
    src.start(t); src.stop(t+spec.dur);
  }catch(e){}
  return spec.dur*1000;
}
// trigger a playback + pulse the clicked element.
// ipa (optional): speak the phoneme sound first, then the word.
function playWord(word, src, el, ipa){
  sfx("tap");
  if(ipa && PHONEME_SAY[ipa] && !src){
    const anchor = PHONEME_SAY[ipa];          // [text, rate]
    const sameWord = anchor[0].toLowerCase() === String(word||"").toLowerCase();
    // anchor word demonstrates the target sound; if the tile's example word is
    // different, play it second (anchor → pause → example). If identical, the
    // single clear anchor play IS the demonstration (no robotic double-read).
    if(sameWord || !word){
      Audio$.speakSeq([anchor]);
    } else {
      Audio$.speakSeq([anchor, word]);
    }
  } else {
    Audio$.play(word, src);
  }
  if(el){ el.classList.remove("pulse"); void el.offsetWidth; el.classList.add("pulse"); }
}

// ===== PURE PHONEME PLAYBACK (Sound Reference Card top button) =====
// Goal: play ONLY the target sound itself — not a letter name, not a word.
// Browser TTS cannot utter a bare phoneme, so:
//   1. If a real human recording exists (PHONEME_AUDIO[ipa]), play that.
//   2. Otherwise fall back to the closest isolated TTS approximation, spoken
//      slowly — never a full word. (Replace with recordings for true accuracy.)
// PHONEME_AUDIO is intentionally empty now: drop in MP3 URLs later, e.g.
//   "ɪ":"sounds/ipa-i.mp3"  → the top button will play the real /ɪ/ instantly.
// ===== HUMAN-RECORDED IPA AUDIO (always higher priority than TTS) =====
// Canonical filename for every sound: "IPA Chart - /xxx/.mp3", keyed by the
// FINAL IPA symbol (never ee/er/ay etc). All 44 slots are pre-reserved below.
// To activate: drop the .mp3 into AUDIO_DIR and the top button plays the real
// recording automatically; until then it falls back to the TTS cue.
let AUDIO_DIR = "";   // set to "audio/" (or a URL prefix) once your mp3s exist
const PHONEME_AUDIO_FILES = {
  // short vowels
  "ɪ":"IPA Chart - /ɪ/.mp3",  "e":"IPA Chart - /e/.mp3",  "æ":"IPA Chart - /æ/.mp3",
  "ʌ":"IPA Chart - /ʌ/.mp3",  "ɒ":"IPA Chart - /ɒ/.mp3",  "ʊ":"IPA Chart - /ʊ/.mp3",  "ə":"IPA Chart - /ə/.mp3",
  // long vowels
  "iː":"IPA Chart - /iː/.mp3", "ɑː":"IPA Chart - /ɑː/.mp3", "ɔː":"IPA Chart - /ɔː/.mp3",
  "uː":"IPA Chart - /uː/.mp3", "ɜː":"IPA Chart - /ɜː/.mp3",
  // diphthongs
  "eɪ":"IPA Chart - /eɪ/.mp3", "aɪ":"IPA Chart - /aɪ/.mp3", "ɔɪ":"IPA Chart - /ɔɪ/.mp3",
  "aʊ":"IPA Chart - /aʊ/.mp3", "əʊ":"IPA Chart - /əʊ/.mp3", "ɪə":"IPA Chart - /ɪə/.mp3",
  "eə":"IPA Chart - /eə/.mp3", "ʊə":"IPA Chart - /ʊə/.mp3",
  // voiceless consonants
  "p":"IPA Chart - /p/.mp3", "t":"IPA Chart - /t/.mp3", "k":"IPA Chart - /k/.mp3",
  "f":"IPA Chart - /f/.mp3", "θ":"IPA Chart - /θ/.mp3", "s":"IPA Chart - /s/.mp3",
  "ʃ":"IPA Chart - /ʃ/.mp3", "tʃ":"IPA Chart - /tʃ/.mp3", "h":"IPA Chart - /h/.mp3",
  // voiced consonants
  "b":"IPA Chart - /b/.mp3", "d":"IPA Chart - /d/.mp3", "g":"IPA Chart - /g/.mp3",
  "v":"IPA Chart - /v/.mp3", "ð":"IPA Chart - /ð/.mp3", "z":"IPA Chart - /z/.mp3",
  "ʒ":"IPA Chart - /ʒ/.mp3", "dʒ":"IPA Chart - /dʒ/.mp3", "m":"IPA Chart - /m/.mp3",
  "n":"IPA Chart - /n/.mp3", "ŋ":"IPA Chart - /ŋ/.mp3", "l":"IPA Chart - /l/.mp3",
  "r":"IPA Chart - /r/.mp3", "w":"IPA Chart - /w/.mp3", "j":"IPA Chart - /j/.mp3"
};
// Set a sound's value to true (or rely on AUDIO_AVAILABLE) once its mp3 exists.
// Empty = no recording yet → TTS fallback is used. NO recordings are bundled now.
const PHONEME_AUDIO = {};
// Resolve the recording URL for a sound, or "" if none is active yet.
function phonemeAudioSrc(ipa){
  // explicit override wins (e.g. PHONEME_AUDIO["ɪ"]="custom.mp3")
  if(PHONEME_AUDIO[ipa]) return PHONEME_AUDIO[ipa];
  // otherwise use the canonical file IF a directory has been configured
  if(AUDIO_DIR && PHONEME_AUDIO_FILES[ipa]) return AUDIO_DIR + PHONEME_AUDIO_FILES[ipa];
  return "";
}
// Isolated approximations per teaching spec — a near-sound CUE, never a word
// or letter name. Browser TTS cannot make a true isolated phoneme, so these are
// learner-friendly hints; human recordings (above) always take priority.
const PHONEME_ISO = {
  // ----- short vowels -----
  "ɪ":["ee",1.15],     // short "ee"
  "ə":["err",1.15],    // clearer short "er"
  "æ":["aa",1.1],      // "at" without the t
  "ʌ":["ah",1.1],      // short "ah"
  "ɒ":["o",1.1],       // short "o"
  "e":["eh",1.1],
  "ʊ":["wu",1.1],      // closer to "wu" short
  // ----- long vowels -----
  "ɜː":["err",0.6],    // clearer long "er"
  "iː":["ee",0.6],
  "ɑː":["ah",0.6],     // long "ah"
  "ɔː":["aw",0.6],"uː":["oo",0.6],
  // ----- diphthongs -----
  "eɪ":["ay",0.8],     // "ay" (not "ei")
  "ɪə":["eer",0.8],    // "eer"
  "eə":["air",0.8],    // "air"
  "ʊə":["wu er",0.8],  // "wu-er"
  "aɪ":["eye",0.8],"ɔɪ":["oy",0.8],"aʊ":["ow",0.8],"əʊ":["oh",0.8],
  // ----- voiceless consonants (light "er" support so TTS says the SOUND,
  //        not the letter name; still not a full word) -----
  "p":["per",1.0],"t":["ter",1.0],"k":["ker",1.0],"f":["fer",1.0],
  "θ":["ther",1.0],"s":["ser",1.0],"ʃ":["sher",1.0],"tʃ":["cher",1.0],"h":["her",1.0],
  // ----- voiced consonants (with -er support) -----
  "b":["bur",1.0],"d":["dur",1.0],"g":["ger",1.0],"v":["vur",1.0],
  "ð":["dher",1.0],"ʒ":["zhur",1.0],"dʒ":["jur",1.0],
  "m":["mur",1.0],"n":["nur",1.0],"ŋ":["erng",1.0],
  "l":["lur",1.0],"r":["rur",1.0],"w":["wer",1.0],"j":["yer",1.0],
  "z":["zur",1.0]
};
// PRIORITY RULE: human-recorded IPA audio ALWAYS wins over TTS. If browser TTS
// cannot produce a proper isolated IPA sound, the PHONEME_AUDIO hook lets us
// drop in human recordings later without changing the system.
function playPhoneme(ipa){
  sfx("tap");
  const src = phonemeAudioSrc(ipa);
  if(src){ Audio$.play(null, src); return; }     // human recording ALWAYS wins
  const iso = PHONEME_ISO[ipa];
  if(iso){ Audio$.speakSeq([iso]); }             // isolated cue only — never a word/letter
}
// clean SVG speaker glyph (replaces plain emoji for a more tappable look)
const SPK_SVG = '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="4 9 4 15 8 15 13 19 13 5 8 9" fill="currentColor" stroke="none"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';

  sfx("reward"); confetti();
  const d=document.createElement("div"); d.className="lvlup"; d.textContent="⭐ Level "+lvl+"!";
  document.getElementById("fx").appendChild(d); setTimeout(()=>d.remove(),1600);
}
const CONF_COLORS=["#1F3A5F","#8B1E3F","#D9B56B","#4FAE8A","#3E6FA0","#BE9648"];
function confetti(n=90){
  const fx=document.getElementById("fx");
  for(let i=0;i<n;i++){
    const c=document.createElement("div"); c.className="confetti";
    const x=Math.random()*100, rot=Math.random()*360, dur=1.6+Math.random()*1.4, delay=Math.random()*.3;
    c.style.left=x+"vw"; c.style.top="-20px"; c.style.background=pick(CONF_COLORS);
    c.style.transform="rotate("+rot+"deg)";
    c.animate([
      {transform:"translateY(0) rotate("+rot+"deg)",opacity:1},
      {transform:"translateY(110vh) rotate("+(rot+540)+"deg)",opacity:.9}
    ],{duration:dur*1000,delay:delay*1000,easing:"cubic-bezier(.3,.1,.4,1)"});
    fx.appendChild(c); setTimeout(()=>c.remove(),(dur+delay)*1000+50);
  }
}

   ROUTER + APP STATE
   ===================================================================== */
let view = {name:"map"};         // map | stage | profile | done
let session = null;              // active exercise session
const $screen = ()=>document.getElementById("screen");
function go(v){ view=v; render(); window.scrollTo(0,0); }

function render(){
  // First run: ask for a language, then the learner's name, before the app.
  if(!langChosen()){ renderNav(); return renderLangPicker(); }
  if(!nameChosen()){ renderNav(); return renderNameAsk(); }
  renderHUD(); renderNav();
  document.getElementById("feedback").className=""; document.getElementById("feedback").innerHTML="";
  if(view.name==="map") return renderMap();
  if(view.name==="sounds") return renderSounds();
  if(view.name==="soundcard") return renderSoundCard(view.ipa);
  if(view.name==="profile") return renderProfile();
  if(view.name==="stage") return renderStageFlow();
  if(view.name==="done") return renderCourseComplete();
}

}

function nameChosen(){ return !!(S.name && S.name.trim()); }

function commitName(){
  const inp=document.getElementById("nameInput");
  const val=(inp && inp.value ? inp.value : "").trim();
  if(!val) return;                 // require a name to continue
  S.name = val; save();
  go({name:"map"});
}

/* ---------- SOUND REFERENCE CARD ----------
   Teaching principle: the learner ALWAYS hears the target sound first, then
   sees how that sound appears in common English words. This is a reference
   card, not a quiz — no auto-advance, no click limit, replay freely.        */
// IPA units that must be treated as ONE symbol so a target like /ɪ/ is not
// matched inside a diphthong like /eɪ/.
const IPA_UNITS = ["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə","iː","ɑː","ɔː","uː","ɜː","tʃ","dʒ"];
// normalise look-alike glyphs (script-ɡ U+0261 vs ascii g) so matching works
function ipaNorm(ch){ return ch==="ɡ" ? "g" : ch; }
// Wrap the FIRST occurrence of the target sound inside a transcription with a
// highlight span, so learners see exactly where the sound appears in the word.
function ipaHighlight(tr, target){
  if(!tr || !target) return tr||"";
  const hasSlash = tr.startsWith("/");
  const body = tr.replace(/^\/|\/$/g,"");
  const tgt = Array.from(target).map(ipaNorm).join("");
  // tokenise into IPA units (2-char units first), keeping stress/length marks
  const toks=[];
  for(let i=0;i<body.length;){
    const two=body.substr(i,2);
    if(IPA_UNITS.includes(two)){ toks.push(two); i+=2; }
    else { toks.push(body[i]); i+=1; }
  }
  let done=false;
  const out=toks.map(t=>{
    const tn = Array.from(t).map(ipaNorm).join("");
    if(!done && tn===tgt){ done=true; return `<span class="tgt">${t}</span>`; }
    return t;
  }).join("");
  return (hasSlash?"/":"")+out+(hasSlash?"/":"");
}

/* ---------- 10b. STAGE FLOW (Video → Learn → Exercises → Reward) ---------- */
// Keep a single session short & satisfying even though the bank is large.
const STAGE_QUESTION_CAP = 16;
// SOFT GROUPED SEQUENCING (learning-flow improvement):
// instead of fully random questions, keep similar-sound questions together in
// short blocks of 4–6, then transition naturally to another sound family.
// Lightweight: just group by the internal `fam` tag, no scoring or tracking.
function buildQueue(s){
  const all = s.exercises.slice();
  if(s.id==="s0") return all;                 // welcome = its single check

  // bucket by sound family (questions without a fam tag → "general" vocab pool)
  const fams = new Map();
  for(const q of all){
    const key = q.fam || "_general";
    if(!fams.has(key)) fams.set(key, []);
    fams.get(key).push(q);
  }
  // shuffle questions inside each family, and shuffle the order families appear
  const famKeys = shuffle([...fams.keys()]);
  for(const k of famKeys) fams.set(k, shuffle(fams.get(k)));

  // emit families as blocks of 4–6 until we reach the cap, so the learner gets
  // repeated exposure to one sound before moving on. General vocab comes last.
  famKeys.sort((a,b)=> (a==="_general") - (b==="_general"));   // general → end
  const queue = [];
  for(const k of famKeys){
    if(queue.length >= STAGE_QUESTION_CAP) break;
    const pool = fams.get(k);
    const blockSize = Math.min(pool.length, 4 + Math.floor(Math.random()*3)); // 4–6
    const room = STAGE_QUESTION_CAP - queue.length;
    queue.push(...pool.slice(0, Math.min(blockSize, room)));
  }
  return queue.slice(0, STAGE_QUESTION_CAP);
}
function startStage(id){
  const s = COURSE.find(x=>x.id===id);
  const queue = buildQueue(s);
  // If this stage has no video in the current language (e.g. Welcome has no
  // English video), skip the Watch step and open straight into Learn.
  const hasVideo = s.video && ytId(videoUrl(s.video.key));
  session = { stageId:id, step: hasVideo ? "video" : "learn", qi:0, correct:0, total:queue.length, earned:0,
              perfect:true, comboStart:S.combo, queue };
  go({name:"stage"});
}

function findStage(id){ return id==="review" ? REVIEW_STAGE : id==="soundpx" ? SOUND_STAGE : COURSE.find(x=>x.id===id); }
// gather a few extra questions that drill the learner's weakest sounds.
// Deterministic (no randomness) so the count and the actual session agree.
function weakSoundQuestions(){
  const weakTokens = Object.entries(S.weak).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]).map(e=>e[0]);
  if(!weakTokens.length) return [];
  const strip = t => t.replace(/\//g,"");
  const out=[];
  for(const p of PAIRS){
    const ia=strip(p.ia), ib=strip(p.ib), f=strip(p.f);
    if(weakTokens.some(t=>{ const s=strip(t); return ia.includes(s)||ib.includes(s)||f.includes(s); })){
      out.push(ex({kind:"Choose the IPA", prompt:p.a, options:[opt(p.ia,true),opt(p.ib)], fam:p.f,
        hint:`${p.f}. ${cap(p.a)} = ${p.ia}, ${cap(p.b)} = ${p.ib}.`}));
    }
    if(out.length>=6) break;
  }
  return out;
}
// the single source of truth for the review pool (deduped). Both the count
// and the session are built from this, so they can never disagree.
function buildReviewPool(){
  const seen = new Set();
  const pool = [];
  for(const q of [...S.review, ...weakSoundQuestions()]){
    const k = reviewKey(q);
    if(seen.has(k)) continue;
    seen.add(k); pool.push(q);
  }
  return pool;
}
function reviewPoolCount(){
  return Math.min(15, buildReviewPool().length);
}
function startReview(){
  const queue = shuffle(buildReviewPool()).slice(0, 15);
  if(!queue.length){ return; }
  REVIEW_STAGE.exercises = queue;
  session = { stageId:"review", step:"quiz", qi:0, correct:0, total:queue.length, earned:0,
              perfect:true, comboStart:S.combo, queue, isReview:true };
  S.combo=0; renderHUD(); go({name:"stage"});
}

// ===== PER-SOUND PRACTICE (Sounds page → tap a sound → 10 targeted questions) =====
// Reuses the engine via a temporary stage (like REVIEW_STAGE), marked isReview
// so it gives a light wrap-up and does NOT touch course progression.
const SOUND_STAGE = { id:"soundpx", title:"Sound Practice", short:"Practice", icon:"🔊", color:"teal",
  exercises:[], reward:{ xp:0, title:"Practice complete!", line:"" } };
function soundLabel(ipa){
  const ex0 = (SOUND_WORDS[ipa]||[])[0] || "";
  return `/${ipa}/${ex0?` (${ex0})`:""}`;
}
// words that do NOT contain the target sound, avoiding its confusable partner
// ===== SOUND DISTANCE TIERS (beginner→advanced difficulty curve) =====
// Each sound belongs to a phonetic family. Distractors are graded by how FAR
// they sit from the target so beginners build a sound boundary before facing
// minimal pairs (full/fool, ship/sheep).
const SOUND_FAMILY = {
  short:["ɪ","e","æ","ʌ","ɒ","ʊ","ə"],
  long:["iː","ɑː","ɔː","uː","ɜː"],
  diph:["eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə"],
  vless:["p","t","k","f","θ","s","ʃ","tʃ","h"],
  vced:["b","d","g","v","ð","z","ʒ","dʒ","m","n","ŋ","l","r","w","j"]
};
function familyOf(ipa){
  for(const [fam,arr] of Object.entries(SOUND_FAMILY)) if(arr.includes(ipa)) return fam;
  return "other";
}
function nearPartners(ipa){ return [LENGTH_PAIRS[ipa], VOICE_PAIRS[ipa]].filter(Boolean); }
// pick `n` distractor WORDS at a difficulty tier:
//  "far"  → opposite macro-category (vowel↔consonant): easy
//  "mid"  → related family but NOT the minimal-pair partner: medium
//  "near" → the minimal-pair partner (length/voice): advanced
function tierWords(ipa, n, tier){
  const fam = familyOf(ipa);
  const near = new Set(nearPartners(ipa));
  const own = new Set(SOUND_WORDS[ipa]||[]);
  let allow;
  if(tier==="near"){
    allow = s => near.has(s);
  } else if(tier==="mid"){
    const sameBucket = ["short","long"].includes(fam) ? ["short","long"] : [fam];
    allow = s => s!==ipa && !near.has(s) && sameBucket.includes(familyOf(s));
  } else {
    const consonantFams=["vless","vced"], vowelFams=["short","long","diph"];
    const isVowel = vowelFams.includes(fam);
    if(isVowel){
      // far = a clearly different vowel quality: diphthongs read as very distinct
      // from plain short/long vowels, so prefer the non-adjacent vowel families.
      const farVowel = fam==="diph" ? ["short","long"] : ["diph"];
      allow = s => s!==ipa && !near.has(s) && farVowel.includes(familyOf(s));
    } else {
      allow = s => s!==ipa && !near.has(s) && vowelFams.includes(familyOf(s));
    }
  }
  const pool=[];
  for(const [s,ws] of Object.entries(SOUND_WORDS)){
    if(!allow(s)) continue;
    for(const w of ws){ if(!own.has(w)) pool.push(w); }
  }
  let picks = shuffle(pool).slice(0,n);
  if(picks.length<n) picks = picks.concat(distractorWords(ipa, n-picks.length));
  return picks.slice(0,n);
}
// generic distractor (safety fallback)
function distractorWords(ipa, n){
  const avoid = new Set([ipa, LENGTH_PAIRS[ipa], VOICE_PAIRS[ipa]].filter(Boolean));
  const own = new Set(SOUND_WORDS[ipa]||[]);
  const pool = [];
  for(const [k,ws] of Object.entries(SOUND_WORDS)){
    if(avoid.has(k)) continue;
    for(const wd of ws){ if(!own.has(wd)) pool.push(wd); }
  }
  return shuffle(pool).slice(0, n);
}
// 10 questions on a beginner→advanced curve:
//   Stage 1 (×4) EASY  — 3 options, far distractors
//   Stage 2 (×3) MEDIUM— 3 options, mid distractors (no minimal pair)
//   Stage 3 (×3) HARD  — minimal pair (2 options) if one exists, else mid odd-one-out
function buildSoundQuestions(ipa){
  const words = (SOUND_WORDS[ipa]||[]).slice();
  if(!words.length) return [];
  const qs = [];
  const hasNear = nearPartners(ipa).length>0;
  const w1 = shuffle(words.slice());
  for(let i=0;i<4 && i<w1.length;i++){
    const right=w1[i], wrongs=tierWords(ipa,2,"far");
    qs.push(ex({ kind:`Find the /${ipa}/ sound`, lvl:"Easy", prompt:`Which word has the /${ipa}/ sound?`,
      options:shuffle([opt(right,true), ...wrongs.map(x=>opt(x))]),
      hint:`“${right}” has /${ipa}/. The others sound clearly different — tap 🔊 to compare.` }));
  }
  const w2 = shuffle(words.slice());
  for(let i=0;i<3 && i<w2.length;i++){
    const right=w2[i], wrongs=tierWords(ipa,2,"mid");
    qs.push(ex({ kind:"Listen & choose", lvl:"Medium", variant:"listen", word:right, sub:"Which word did you hear?",
      options:shuffle([opt(right,true), ...wrongs.map(x=>opt(x))]),
      hint:`You heard “${right}” — it has the /${ipa}/ sound.` }));
  }
  const w3 = shuffle(words.slice());
  for(let i=0;i<3;i++){
    if(hasNear){
      const right=w3[i%w3.length], wrong=tierWords(ipa,1,"near")[0];
      qs.push(ex({ kind:"Minimal pair", lvl:"Hard", variant:"listen", word:right, sub:"Which word did you hear?",
        options:shuffle([opt(right,true), opt(wrong)]),
        hint:`Tricky pair! “${right}” has /${ipa}/. Listen for the small difference — tap 🔊 to compare.` }));
    } else {
      const keep=shuffle(words.filter(x=>x!==w3[i%w3.length])).slice(0,2);
      const odd=tierWords(ipa,1,"mid")[0] || distractorWords(ipa,1)[0] || "no";
      qs.push(ex({ kind:"Spot the odd one", lvl:"Hard", prompt:`Which word does NOT have the /${ipa}/ sound?`,
        options:shuffle([opt(odd,true), ...keep.map(x=>opt(x))]),
        hint:`“${keep.join("” and “")}” have /${ipa}/; “${odd}” does not.` }));
    }
  }
  return qs.slice(0,10);
}
function startSoundPractice(ipa){
  const qs = buildSoundQuestions(ipa);
  if(!qs.length) return;
  SOUND_STAGE.exercises = qs;
  SOUND_STAGE.title = `Practice: ${soundLabel(ipa)}`;
  session = { stageId:"soundpx", step:"quiz", qi:0, correct:0, total:qs.length, earned:0,
              perfect:true, comboStart:S.combo, queue:qs, isReview:true, soundIpa:ipa };
  S.combo=0; renderHUD(); go({name:"stage"});
}

function stepBar(active){ // active: 0..3
  return `<div class="steps">${[0,1,2,3].map(i=>`<i class="${i<active?'on':(i===active?'cur':'')}"></i>`).join("")}</div>`;
}
function topbar(active){
  return `<div class="topbar"><button class="iconbtn" data-action="goMap">✕</button>${stepBar(active)}</div>`;
}
function renderStageFlow(){
  const s = findStage(session.stageId);
  if(session.step==="video")  return renderVideo(s);
  if(session.step==="learn")  return renderLearn(s);
  if(session.step==="quiz")   return renderExercise(s);
  if(session.step==="reward") return renderReward(s);
}

/* STEP 1 — VIDEO */
// extract the 11-char video id from any YouTube URL shape
function ytId(url){
  if(!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
  return m ? m[1] : null;
}
// proper, Safari-safe embed URL: no autoplay, privacy domain, inline playback
function ytEmbedUrl(id){
  return "https://www.youtube-nocookie.com/embed/" + id +
         "?rel=0&modestbranding=1&playsinline=1&autoplay=0";
}
// embeds commonly fail with "Error 153" on file:// or srcdoc previews → use link fallback there
function embedUnsupported(){
  const p = location.protocol;
  return p === "file:" || p === "about:" || p === "data:";
}
// requirement 4: if a YouTube iframe cannot load (blocked, no network, embedding
// disabled, Error 153), swap its wrapper for a tappable thumbnail that opens YouTube.
function ytFallback(frameId, id, title){
  const wrap = document.getElementById(frameId+"_wrap");
  if(!wrap || wrap.dataset.fellback) return;
  wrap.dataset.fellback = "1";
  const watch = "https://www.youtube.com/watch?v=" + id;
  const thumb = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
  wrap.outerHTML =
    `<a class="video as-link" href="${watch}" target="_blank" rel="noopener" style="background-image:url('${thumb}')">
       <span class="tag">▶ WATCH ON YOUTUBE</span>
       <div class="play">▶</div>
       <div class="vmeta"><b>${title||"Watch the lesson"}</b><span>Opens in YouTube</span></div>
     </a>`;
}
function renderVideo(s){
  const url = videoUrl(s.video.key);
  const id  = ytId(url);
  let player;
  if(!id){
    // No video for this stage in the current language (e.g. Welcome has no
    // English video). Show a gentle note instead of a teacher placeholder.
    player = `<div class="video">
         <span class="tag">▶ VIDEO LESSON</span>
         <div class="play">▶</div>
         <div class="vmeta"><b>${s.video.title}</b><span>${s.video.caption}</span></div>
       </div>`;
  } else {
    const watch = "https://www.youtube.com/watch?v=" + id;
    const thumb = "https://img.youtube.com/vi/" + id + "/hqdefault.jpg";
    if(embedUnsupported()){
      // local / sandboxed preview: show a tappable thumbnail that opens YouTube (avoids Error 153)
      player = `<a class="video as-link" href="${watch}" target="_blank" rel="noopener" style="background-image:url('${thumb}')">
           <span class="tag">▶ WATCH ON YOUTUBE</span>
           <div class="play">▶</div>
           <div class="vmeta"><b>${s.video.title}</b><span>Opens in YouTube</span></div>
         </a>
         <div class="placeholder-note">Embedded playback is blocked in local preview — opens on YouTube instead.</div>`;
    } else {
      // normal responsive iframe + automatic fallback if it can't load
      const fid = "yt_"+id+"_"+Math.random().toString(36).slice(2,7);
      player = `<div class="video" id="${fid}_wrap">
           <iframe id="${fid}" src="${ytEmbedUrl(id)}" title="${s.video.title}"
             loading="lazy" referrerpolicy="origin-when-cross-origin"
             allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
             allowfullscreen
             onerror="ytFallback('${fid}','${id}','${(s.video.title||'').replace(/'/g,'')}')"></iframe>
         </div>
         <div class="placeholder-note">Trouble playing here? <a href="${watch}" target="_blank" rel="noopener">Watch on YouTube ↗</a></div>`;
      // if the iframe hasn't reported load shortly, assume it's blocked and swap in the link card
      setTimeout(()=>{
        const f = document.getElementById(fid);
        if(f && !f.dataset.loaded){ ytFallback(fid, id, s.video.title||""); }
      }, 4000);
      // mark as loaded when the frame fires its load event (cancels the timeout swap)
      setTimeout(()=>{
        const f = document.getElementById(fid);
        if(f) f.addEventListener("load", ()=>{ f.dataset.loaded = "1"; });
      }, 0);
    }
  }
  $screen().innerHTML = `
    ${topbar(0)}
    <div class="pad">

/* =====================================================================
   9. EXERCISE ENGINE  —  ONE renderer for every question variant.
      STEP 3 of the stage template.
   ===================================================================== */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function renderExercise(s){
  const q = sessionExercises(s)[session.qi];
  if(!session._opts || session._optsFor!==session.qi){
    session._opts = shuffle(q.options); session._optsFor=session.qi; session.sel=null; session.locked=false;
  }
  const opts = session._opts;
  const isChip = q.variant==="fill";
  // prompt rendering by variant (with audio where a WORD is shown)
  let promptHTML="";
  if(q.variant==="fill"){
    const shown = q.prompt.replace(/_+/, `<span class="q-blank">&nbsp;?&nbsp;</span>`);
    promptHTML = `<div class="q-sub">Complete the transcription of <b>“${q.word}”</b> ${speaker(q.word,q.audioSrc)}</div>
                  <div class="q-prompt"><span class="big ipaword ipa">${shown}</span></div>`;
  } else if(q.variant==="word"){
    promptHTML = `<div class="q-sub">Which word is this?</div>
                  <div class="q-prompt"><span class="big ipaword ipa">${q.prompt}</span></div>`;
  } else if(q.variant==="identify"){
    const spk = isWordLabel(q.prompt) ? " "+speaker(q.prompt,q.audioSrc,"big") : "";
    promptHTML = `<div class="q-prompt"><span class="big ipaword ipa">${q.prompt}</span>${spk}</div>
                  <div class="q-sub">${q.sub||"Which one?"}</div>`;
  } else if(q.variant==="listen"){
    // listening practice INSIDE the lesson: hear the word, then pick it
    promptHTML = `<div class="q-sub">${q.sub||"Listen, then choose the word you hear"}</div>
                  <div class="big-listen"><button class="listen-btn" data-action="listen" data-word="${q.word}"${q.audioSrc?` data-src="${q.audioSrc}"`:""}><span class="li-ic">${SPK_SVG}</span> Tap to listen</button></div>`;
  } else { // choose IPA for a word
    promptHTML = `<div class="q-sub">${q.sub||"Choose the correct IPA for"}</div>
                  <div class="q-prompt"><span class="big">${q.prompt}</span> ${speaker(q.prompt,q.audioSrc,"big")}</div>`;
  }
  const optsHTML = opts.map((o,idx)=>{
    const spk = isWordLabel(o.label) ? speaker(o.label, o.src) : "";
    return `
    <button class="opt ${isChip?'chipopt':''}" data-action="pick" data-idx="${idx}">
      ${isChip?"":`<span class="key">${String.fromCharCode(65+idx)}</span>`}
      <span class="ipa">${o.label}</span>${spk?`<span class="opt-spk">${spk}</span>`:""}
    </button>`;}).join("");

  $screen().innerHTML = `
    ${topbar(2)}
    <div class="pad" style="position:relative">
      <div class="combo" id="comboMsg"></div>
      <span class="q-kind">${q.kind} · ${session.qi+1}/${session.total}${q.lvl?` <span class="q-lvl ${q.lvl.toLowerCase()}">${q.lvl}</span>`:""}</span>
      ${promptHTML}
      <div class="opts ${isChip?'wrap':''}" id="opts">${optsHTML}</div>
    </div>`;
  if(q.variant==="listen") setTimeout(()=>Audio$.play(q.word, q.audioSrc), 350);  // play once on load
}

function pickOption(idx){
  if(session.locked) return;
  session.sel = idx; sfx("tap");
  [...document.querySelectorAll("#opts .opt")].forEach((el,i)=>el.classList.toggle("sel", i===idx));
  showCheck();
}
function showCheck(){
  const fb=document.getElementById("feedback");
  fb.className="show"; fb.innerHTML=`<div class="fb-inner" style="background:#fff;border-color:var(--line)">
    <button class="btn" data-action="check">Check answer</button></div>`;
}

function checkAnswer(){
  const s = findStage(session.stageId);
  const q = sessionExercises(s)[session.qi];
  const opts = session._opts, sel = session.sel;
  if(sel==null) return;
  if(session.locked) return;                 // QA fix: block double-submit (fast double-tap)
  session.locked=true;
  const correct = opts[sel].correct;
  const els=[...document.querySelectorAll("#opts .opt")];
  els.forEach((el,i)=>{
    el.classList.remove("sel");
    if(opts[i].correct) el.classList.add("correct");
    else if(i===sel) el.classList.add("wrong");
    el.classList.add("answered");           // blocks re-pick (see pickOption) but
                                            // keeps the speaker buttons tappable
  });

  if(correct){
    sfx("ok");
    S.combo++; if(S.combo>S.bestCombo) S.bestCombo=S.combo;
    session.correct++;
    let gain = 10 + (S.combo>=5?5:0);          // 4. XP per correct + combo bonus
    session.earned += gain;
    const cl = opts.find(o=>o.correct).label;
    if(session.isReview){
      // PRIORITY 3 FIX: a correct review answer clears the item immediately —
      // remove it from the pending pool AND zero its weak-sound counter so the
      // weak-sound generator stops re-creating it.
      clearFromReview(q);
    } else if(!isWordLabel(cl) && S.weak[cl]){
      S.weak[cl] = Math.max(0, S.weak[cl]-1);  // normal lesson: ease off a weak sound
    }
    const okMsg = q.okMsg || pick(PRAISE);
    if(S.combo===5 && !S.badges.hot_streak){ S.badges.hot_streak=true; setTimeout(()=>miniBadge("hot_streak"),300); }
    if(COMBO_LINES[S.combo]) comboFlash(COMBO_LINES[S.combo]);
    feedbackOK(okMsg, gain);
    const correctEl = els.find(e=>e.classList.contains("correct"));
    awardXP(gain, correctEl);
  } else {
    sfx("no");
    session.perfect=false; S.combo=0;          // reset combo only — no penalty, learning continues
    // lightweight weak-sound tracking (unrelated to lives)
    const cl = opts.find(o=>o.correct).label;
    if(!isWordLabel(cl)) S.weak[cl] = (S.weak[cl]||0)+1;
    // PRIORITY 3: stash this question for "Today's Review" (dedupe by prompt, cap 30)
    addToReview(q);
    els[sel].classList.add("shake");
    // TEACHING FEEDBACK: explain chosen vs correct & why, falling back to the hint
    const chosenLbl = opts[sel].label;
    const teach = whyDifferent(chosenLbl, cl);
    const norm = s => String(s).replace(/[\/\[\]]/g,"").trim();
    const cTok = norm(chosenLbl), aTok = norm(cl);
    let compare = null;
    if(teach && PHONEME_SAY[cTok] && PHONEME_SAY[aTok]){
      compare = { a: PHONEME_SAY[aTok][0], b: PHONEME_SAY[cTok][0] };  // correct word first
    }
    feedbackNO(teach || q.hint, compare);
    renderHUD();
  }
  save();
}
function reviewKey(q){ return (q.variant||"std")+"|"+(q.prompt||q.word||""); }
function addToReview(q){
  const key = reviewKey(q);
  S.review = S.review.filter(r=>reviewKey(r)!==key);   // move-to-front dedupe
  // store a clean copy (the engine re-shuffles options at render time)
  S.review.unshift(JSON.parse(JSON.stringify(q)));
  if(S.review.length>30) S.review.length = 30;
}
// PRIORITY 3 FIX: clear a correctly-answered review item so it doesn't reappear.
function clearFromReview(q){
  const key = reviewKey(q);
  S.review = S.review.filter(r=>reviewKey(r)!==key);
  const strip = t => t.replace(/\//g,"");
  // 1) clear the exact correct-option IPA key if it's tracked as weak
  const correctLabel = (q.options||[]).find(o=>o.correct);
  if(correctLabel && !isWordLabel(correctLabel.label)) delete S.weak[correctLabel.label];
  // 2) clear ANY weak key (which are full IPA transcriptions like "/biːt/")
  //    whose sound contains one of the focus tokens this question drilled, so the
  //    weak-sound generator can no longer produce a phantom item for it.
  const focusTokens = [];
  if(q.fam) (q.fam.match(/\/[^\/]+\//g)||[]).forEach(t=>focusTokens.push(strip(t)));
  (q.options||[]).forEach(o=>{ if(!isWordLabel(o.label)) focusTokens.push(strip(o.label)); });
  if(focusTokens.length){
    for(const k of Object.keys(S.weak)){
      const ks = strip(k);
      if(focusTokens.some(t=> ks.includes(t) || t.includes(ks) )) delete S.weak[k];
    }
  }
}
function comboFlash(txt){ const c=document.getElementById("comboMsg"); if(!c)return; c.textContent=txt; c.classList.remove("show"); void c.offsetWidth; c.classList.add("show"); }

function feedbackOK(msg, gain){
  const fb=document.getElementById("feedback");
  fb.className="ok show";
  fb.innerHTML=`<div class="fb-inner">
    <div class="fb-head"><span class="ic">✓</span><b>${msg}</b><span class="xpgain">+${gain} XP</span></div>
    <button class="btn" data-action="next">Continue</button></div>`;
}
const GENTLE = ["Let's compare the two sounds","Listen for the difference","Worth a closer listen",
  "Almost — here's the distinction","Tune your ear to this one","Compare them once more"];
// ===== TEACHING FEEDBACK: explain WHY the chosen sound differs from the answer =====
const SOUND_DESC = {
  "ɪ":"short, relaxed ‘i’ (ship)","iː":"long, tense ‘ee’ (sheep)",
  "e":"short ‘e’ (bed)","æ":"open ‘a’, mouth wide (cat)","ʌ":"short ‘uh’ (cup)",
  "ɒ":"short, rounded ‘o’ (hot)","ɑː":"long, open ‘ah’ (car)",
  "ʊ":"short ‘oo’ (book)","uː":"long ‘oo’ (food)","ɔː":"long ‘aw’ (door)",
  "ə":"weak, unstressed ‘uh’ (about)","ɜː":"long ‘er’ (bird)",
  "eɪ":"glide ‘ay’ (day)","aɪ":"glide ‘eye’ (my)","ɔɪ":"glide ‘oy’ (boy)",
  "aʊ":"glide ‘ow’ (now)","əʊ":"glide ‘oh’ (go)",
  "ɪə":"glide ‘ear’ (here)","eə":"glide ‘air’ (hair)","ʊə":"glide ‘oor’ (tour)",
  "p":"voiceless ‘p’","b":"voiced ‘b’","t":"voiceless ‘t’","d":"voiced ‘d’",
  "k":"voiceless ‘k’","g":"voiced ‘g’","f":"voiceless ‘f’","v":"voiced ‘v’",
  "θ":"voiceless ‘th’ (think)","ð":"voiced ‘th’ (this)","s":"voiceless ‘s’ (hiss)","z":"voiced ‘z’ (buzz)",
  "ʃ":"voiceless ‘sh’ (she)","ʒ":"voiced ‘zh’ (vision)","tʃ":"voiceless ‘ch’ (chair)","dʒ":"voiced ‘j’ (jump)",
  "h":"breathy ‘h’","m":"‘m’, lips together","n":"‘n’, tongue up","ŋ":"‘ng’ (sing)",
  "l":"‘l’, tongue tip up","r":"‘r’","w":"‘w’, rounded lips","j":"‘y’ (yes)"
};
const LENGTH_PAIRS = {"ɪ":"iː","iː":"ɪ","ʊ":"uː","uː":"ʊ","ɒ":"ɔː","ɔː":"ɒ","ʌ":"ɑː","ɑː":"ʌ","ə":"ɜː","ɜː":"ə"};
const VOICE_PAIRS  = {"p":"b","b":"p","t":"d","d":"t","k":"g","g":"k","f":"v","v":"f","θ":"ð","ð":"θ","s":"z","z":"s","ʃ":"ʒ","ʒ":"ʃ","tʃ":"dʒ","dʒ":"tʃ"};
// Build a teaching explanation comparing the chosen vs correct option.
// Works when the options are IPA tokens (e.g. /ɪ/ vs /iː/). Returns "" otherwise.
function whyDifferent(chosenLabel, correctLabel){
  const norm = s => String(s).replace(/[\/\[\]]/g,"").trim();
  const c = norm(chosenLabel), a = norm(correctLabel);
  if(!c || !a || c===a) return "";
  const cDesc = SOUND_DESC[c], aDesc = SOUND_DESC[a];
  if(!cDesc || !aDesc) return "";
  let why;
  if(LENGTH_PAIRS[a]===c){
    why = "They differ in length — listen for how long the vowel is held.";
  } else if(VOICE_PAIRS[a]===c){
    why = "Same mouth shape, but one is voiced (throat buzzes) and one is voiceless. Rest a finger on your throat to feel it.";
  } else {
    why = "Different mouth position — say both slowly and notice where your tongue and lips move.";
  }
  return `You chose /${c}/ (${cDesc}). The answer is /${a}/ (${aDesc}). ${why}`;
}

function feedbackNO(hint, compare){
  const fb=document.getElementById("feedback");
  fb.className="no show";
  const cmp = (compare && compare.a && compare.b)
    ? `<button class="btn ghost" data-action="compareSounds" data-a="${compare.a}" data-b="${compare.b}" style="margin-bottom:8px">🔊 Hear both sounds</button>`
    : "";
  fb.innerHTML=`<div class="fb-inner">
    <div class="fb-head"><span class="ic">↻</span><b>${pick(GENTLE)}</b></div>
    <div class="fb-hint">💡 ${hint||"Tap 🔊 and listen for the small difference between the two words."}</div>
    ${cmp}
    <button class="btn" data-action="next">Got it, continue</button></div>`;
}
// play two example words back-to-back so the learner hears the contrast
function compareSounds(aWord, bWord){
  if(!aWord||!bWord) return;
  Audio$.speakSeq([[aWord,0.8],[bWord,0.8]]);
}

function finishStage(s){
  if(session.isReview){                                 // PRIORITY 3: review wrap-up
    // NOTE: correctly-answered items are already removed during checkAnswer via
    // clearFromReview(). Items the learner missed stay in S.review so they can
    // come back later. So we do NOT blanket-clear the queue here.
    save();
    session.step="reward";
    sfx("reward"); confetti(90);
    render();
    return;
  }
  // record progress
  const prev = S.stages[s.id]||{};
  const wasDone = prev.completed;
  S.stages[s.id] = {
    completed:true,
    correct:session.correct, total:session.total,
    best: Math.max(prev.best||0, session.correct)
  };
  if(!wasDone){
    awardXP(s.reward.xp);                              // big stage bonus
    if(s.reward.badge && !S.badges[s.reward.badge]) S.badges[s.reward.badge]=true;
    if(session.perfect && session.total>0 && !S.badges.flawless) S.badges.flawless=true;
    unlock(nextStageId(s.id));                          // progression
    if(s.reward.final) S.courseDone=true;
  }
  save();
  session.step="reward";
  sfx("reward"); confetti(120);
  render();
}

        ${session.total?`<div class="tally-row" style="animation-delay:.15s"><span class="ic">🎯</span><span class="lbl">Accuracy</span><span class="val">${acc}%</span></div>`:""}

  d.style.background="var(--sun)"; d.style.color="#5A3A1E";
  d.innerHTML=`🏅 ${b.name} Badge!`;
  document.getElementById("fx").appendChild(d); setTimeout(()=>d.remove(),1700); confetti(40);
}

/* =====================================================================
   EVENT DELEGATION  —  every interaction routes through here.
   ===================================================================== */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-action]"); if(!t) return;
  const a = t.dataset.action;
  switch(a){
    case "goMap": session=null; go({name:"map"}); break;
    case "goSounds": session=null; go({name:"sounds"}); break;
    case "playPhoneme": playPhoneme(t.dataset.ipa); break;
    case "openSoundCard": session=null; go({name:"soundcard", ipa:t.dataset.ipa}); break;
    case "goProfile": go({name:"profile"}); break;
    case "goDone": go({name:"done"}); break;
    case "openStage": startStage(t.dataset.id); break;
    case "startReview": startReview(); break;
    case "toLearn": session.step="learn"; render(); window.scrollTo(0,0); break;
    case "toQuiz": session.step="quiz"; session.qi=0; S.combo=0; renderHUD(); render(); window.scrollTo(0,0); break;
    case "pick": pickOption(+t.dataset.idx); break;
    case "check": checkAnswer(); break;
    case "next": nextQuestion(); window.scrollTo(0,0); break;
    case "compareSounds": compareSounds(t.dataset.a, t.dataset.b); break;
    // audio (in-lesson playback)
    case "playword": playWord(t.dataset.word, t.dataset.src, t, t.dataset.ipa); break;
    case "speak": playWord(t.dataset.word, t.dataset.src, t); break;
    case "listen": playWord(t.dataset.word, t.dataset.src, t); break;
    // daily goal
    case "cycleGoal": { const order=[20,50,100]; S.dailyGoal = order[(order.indexOf(S.dailyGoal)+1)%order.length]; save(); renderHUD(); renderMap(); } break;
    case "setGoal": S.dailyGoal=+t.dataset.g; save(); renderHUD(); renderProfile(); break;
    case "toggleSound": SOUND=!SOUND; if(SOUND){ac(); sfx("tap");} renderHUD(); break;
    case "pickLang": setLang(t.dataset.lang); break;
    case "saveName": commitName(); break;
    case "cycleLang": langMenuOpen=!langMenuOpen; renderLangMenu(); break;
    case "setLang": langMenuOpen=false; setLang(t.dataset.lang); break;
    case "closeLangMenu": langMenuOpen=false; renderLangMenu(); break;
    case "resetCourse":
      if(confirm("Reset ALL progress, XP and badges? This can't be undone.")){
        S=freshState(); save(); go({name:"map"});
      } break;
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(function init(){
  Audio$.init();                               // warm up speech voices
  const loaded = Persist.load();
  if(loaded){ S = Object.assign(freshState(), loaded); }
  touchStreak(); touchDaily(); save();
  go({name:"map"});
})();
</script>
